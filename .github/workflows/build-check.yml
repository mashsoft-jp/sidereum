# src/ を変更したのに index.html を再生成し忘れる事故を止めるための番人。
# ここではビルドして配信物を差し替えることはしない (index.html はリポジトリに commit 済み)。
name: build check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: index.html が src/ と一致しているか
        run: node tools/build.mjs --check
