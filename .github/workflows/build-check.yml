# src/ を変更したのに index.html を再生成し忘れる事故を止めるための番人。
# ここではビルドして配信物を差し替えることはしない (index.html はリポジトリに commit 済み)。
name: build check

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # サプライチェーン対策のため、アクションはタグではなくコミット SHA で固定する
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # 生成漏れの検出に加えて、build 内で連結後 JS の構文検査も行われる
      - name: index.html が src/ と一致しているか
        run: node tools/build.mjs --check
