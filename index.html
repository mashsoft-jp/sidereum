  /* ---- 初回ガイド (welcome overlay) ---- */

  /* ---- date readout ---- */

  /* Android の Chrome は date/time 欄に中身より広い既定の幅を持たせるので、

     余った分だけ詰める (内部は余白から先に潰れるので、字が欠けることはない)。
     em はフォントサイズに比例する文字の幅、+px はアイコンと内側の余白のぶん —

  #nowBtn:hover { color: var(--text); }

  #controls .slider { text-align: right; }
  /* 行の見出しはアイコンで置く。列の幅は一番長いラベルで決まるので、文字のままだと
     とくに英語 (Distance) が広く、そのぶんスライダーが痩せる。
     絵文字は使わない — Android が記号を絵文字として描くことがあり、再生/停止で
     同じ問題に当たって SVG に置き換えた経緯がある (playIcon)。
     語は .vh (読み上げ用) と title (ホバー) に残すので、意味は失わない */
  .ctlIcon {
    width: 13px; height: 13px;
    display: inline-block; vertical-align: -0.22em;
    color: var(--dim);
  }
  #angleCell .ctlIcon, #gAltCell .ctlIcon { display: block; }
  /* 説明文の中に埋め込んだ行見出しアイコン (ツアーのナレーション・操作方法)。
     文字サイズに合わせて拡縮し、強調色で「画面のこれ」と分かるようにする */
  .inlIcon { white-space: nowrap; }
  .inlIcon .ctlIcon {
    width: 1.15em; height: 1.15em;
    vertical-align: -0.24em;
    color: var(--accent);
  }
  /* 視覚的には隠すが読み上げには残す */
  .vh {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap; border: 0;
  }
  #controls input[type="range"] { width: 100%; }
  /* カメラ視点プルダウン (距離・ズームの左横、col1 を2行ぶん占有) */
  #camSelect {
    grid-column: 1; grid-row: 2 / span 2; align-self: center; justify-self: stretch;
    font-family: var(--font-ui); font-size: 11px; letter-spacing: 0.03em;
    color: var(--text); background: rgba(150, 178, 224, 0.08);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 6px 4px; cursor: pointer; max-width: 100%;
  }
  /* col1 のプレースホルダ: PC はカメラが col1 を占有するため不要 (縦持ちのみ距離/ズーム行の col1 を確保) */
  #controls .camGap { display: none; }
  /* カメラのアイコンはモバイルだけ。PC は select の文字「カメラ」をそのまま出す */
  #camIcon { display: none; }
  /* ---- 地上ビュー用コントロールの出し分け ---- */
  .groundOnly { display: none; }
  #app.groundMode .spaceOnly { display: none; }
  #app.groundMode #controls .groundOnly { display: revert; }
  #gFovVal, #gAzReadout, #gAzDir {
    font-family: var(--font-num); font-variant-numeric: tabular-nums;
    font-size: 11.5px; color: var(--text); white-space: nowrap;
  }
  #gFovVal { min-width: 88px; text-align: left; }
  /* 方位 (操作パネル内: ◀ 目盛りテープ ▶ + 方角表示) */
  #gAzDir { min-width: 88px; text-align: left; color: var(--dim); }
  #gAzTape { width: 100%; height: 32px; touch-action: none; cursor: ew-resize; }   /* display は .groundOnly の出し分けに任せる */
  #gAzTape .tapetxt { fill: var(--dim); font-size: 10px; font-family: var(--font-ui); text-anchor: middle; }
  #gAzTape .tapen { fill: #e8785f; }
  /* 宇宙/地上のビュー切替 (画面上部中央) */
  #viewMode {
    position: absolute; top: calc(14px + var(--sat)); left: 50%; transform: translateX(-50%);
    z-index: 15; display: flex; gap: 3px; padding: 4px;
    background: rgba(16, 22, 42, 0.82); border: 1px solid var(--line);
    border-radius: 20px; backdrop-filter: blur(4px);
  }
  #viewMode button {
    padding: 5px 16px; font-size: 12px; letter-spacing: 0.08em;
    color: var(--dim); background: none; border: none; border-radius: 14px;
  }
  #viewMode button:hover { color: var(--text); background: rgba(150, 178, 224, 0.10); }
  #viewMode button.on { color: #0a0d16; background: var(--accent); font-weight: 600; }
  #vmSelect { display: none; }
  /* 狭い画面: 3つ並べるとタイトルと時計の間に入らないので、選択中のビューを出す
     select にする (開いた一覧は端末が出すので、こちらの画面配置に干渉しない)。
     translateX で中央に寄せないのは、レイヤに乗ると iOS で書き換えた文字が
     描き残ることがあるため (ツアーのナレーションで実際に起きた) */
  @media (max-width: 720px), (max-height: 480px) {
    #viewMode {
      left: 0; right: 0; margin-inline: auto; transform: none; width: max-content;
      padding: 0; gap: 0; border-radius: 15px;
      backdrop-filter: none; -webkit-backdrop-filter: none;
      background: rgba(9, 14, 28, 0.92);
    }
    #viewMode > button { display: none; }
    /* 縦の余白はタイトルの箱と同じ高さ (37px) になるよう取る。上端の行に並べたとき、
       ☰ の箱・時計の箱と天地が揃う */
    #vmSelect {
      display: block;
      font-family: var(--font-ui); font-size: 11px; letter-spacing: 0.08em;
      color: var(--text); background: none; border: none; border-radius: 15px;
      padding: 9px 10px; cursor: pointer; color-scheme: dark;
    }
  }
  /* 縦持ち: 上端の行はタイトルと時計で埋まっているので、中央に入る幅があるときだけ
     同じ行に並べ、足りない端末では時計の下に一段取る (そのぶん天体リストを下げる)。
     効くのはタイトル側の隙間で、幅 W のとき W/2 −(タイトル右端)−(切替幅/2)。
     4px 残す条件が、日本語 (タイトル 157・切替 66) で 388px、
     英語 (161・87) で 417px になる */
  @media (max-width: 720px) {
    #viewMode { top: calc(var(--vmTop, 96px) + var(--sat)); }
    /* #app #navPanel (ID 2つ) の既定に勝たせるため、こちらも同じ形で書く */
    #app #navPanel, #app #navExpand { top: calc(var(--vmNavTop, 140px) + var(--sat)); }
  }
  @media (min-width: 388px) {
    :root { --vmTop: 16px; --vmNavTop: 108px; }
  }
  @media (max-width: 416px) {
    :root[lang="en"] { --vmTop: 96px; --vmNavTop: 140px; }
  }
  /* 横持ちは上端が横に空いているので、幅を問わず同じ行に置ける */
  @media (max-height: 480px) {
    #viewMode { top: calc(16px + var(--sat)); }
  }
  /* 高度(地上・月面)/角度(宇宙) の縦スライダー。操作パネルからは切り離し、画面の
     右端に独立して置く。パネルの行数に縛られないので、つまみの可動域を画面の
     高さに合わせて伸ばせる (パネル内では3行ぶん = 38px が上限だった) */
  #angleCell, #gAltCell {
    position: absolute;
    right: calc(var(--vslR) + var(--sar));
    top: 50%; transform: translateY(-50%);
    height: clamp(150px, 42vh, 320px);
    height: clamp(150px, 42dvh, 320px);
    z-index: 11;
    box-sizing: border-box;
    padding: 8px 5px 6px;
    display: none;
    flex-direction: column; align-items: center; gap: 4px;
  }
  #app:not(.groundMode) #angleCell { display: flex; }
  #app.groundMode #gAltCell { display: flex; }
  #gAltCell #gAlt, #angleCell #angle {
    writing-mode: vertical-lr; direction: rtl;
    -webkit-appearance: slider-vertical; appearance: slider-vertical;
    width: 8px; accent-color: var(--accent);
    flex: 1; min-height: 60px;
    margin: 2px 0;
  }
  #gAltLabelTop, #gAltVal, #angleCell #angleLabel, #angleVal {
    font-size: 10.5px; color: var(--dim); font-family: var(--font-num); white-space: nowrap;
  }
  #gAltCell .step, #angleCell .step { padding: 2px 8px; font-size: 9px; line-height: 1.4; }
  /* ---- 操作パネルの折りたたみ (下へ引っ込む) ---- */
  #controls { transition: transform 0.25s ease; }
  /* 2重 ID なのは、各モードの #controls button の padding 上書きに勝つため。
     復帰用の ⌃ ピルと同じ幅・高さになるよう padding を揃えている */
  #controls #ctrlCollapse {
    position: absolute; top: -25px; left: 50%; transform: translateX(-50%);
    padding: 2px 20px; font-size: 12px; line-height: 1.5;
    color: var(--dim); background: rgba(16, 22, 42, 0.72);
    border: 1px solid var(--line); border-bottom: none;
    border-radius: 8px 8px 0 0; backdrop-filter: blur(4px);
  }
  #ctrlCollapse:hover { color: var(--text); background: rgba(16, 22, 42, 0.9); }
  #app.ctrlHidden #controls { transform: translate(-50%, calc(100% + 40px + env(safe-area-inset-bottom, 0px))); pointer-events: none; }
  #ctrlExpand {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(6px + env(safe-area-inset-bottom, 0px));
    z-index: 13; padding: 2px 20px; font-size: 12px; line-height: 1.5;
    color: var(--dim); background: rgba(16, 22, 42, 0.72);
    border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(4px); display: none;
  }
  #ctrlExpand:hover { color: var(--text); }
  #app.ctrlHidden #ctrlExpand { display: block; }

  /* ---- ガイドツアーのナレーションバー (操作パネルと同じ位置に入れ替わる) ---- */
  /* iOS Safari は、合成レイヤに載った箱の中身を差し替えたときに塗り直しそこねる
     ことがある。ナレーションは回ごとに中身を丸ごと入れ替えるので、前の回の文字が
     残って描かれていた (textContent から innerHTML に変えてアイコンを埋め込む
     ようにしてから出るようになった)。
     この箱からはレイヤを作る指定を落とす:
       - transform (中央寄せ) → left/right + margin auto で寄せる。これは広い画面
         だけの指定で、スマホは元から transform: none。iPad でだけ症状が出ていた
         のと符合する
       - backdrop-filter (.hud の blur) → 背景を濃くして補う */
  #tourBar {
    left: 0; right: 0;
    margin-left: auto; margin-right: auto;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    transform: none;
    width: min(620px, calc(100vw - 24px));
    box-sizing: border-box;
    padding: 12px 16px 10px;
    z-index: 14;
    display: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    background: rgba(9, 14, 28, 0.94);
  }
  #tourBar.open { display: block; }
  /* ツアー中は操作パネル・天体リスト・ヒントを引っ込め、画面を空ける。
     メニュー・ビュー切替・観測地・現在時刻ボタンも、シーンを壊すので隠す */
  #app.tourMode #controls,
  #app.tourMode #angleCell,
  #app.tourMode #gAltCell,
  #app.tourMode #ctrlExpand,
  #app.tourMode #navPanel,
  #app.tourMode #navExpand,
  #app.tourMode #hint,
  #app.tourMode #menuBtn,
  #app.tourMode #viewMode,
  #app.tourMode #obsSiteBar,
  #app.tourMode #nowBtn { display: none; }
  /* 日時は時間の経過が見えるよう表示は残し、入力だけ止める */
  #app.tourMode #dateInput,
  #app.tourMode #timeInput { pointer-events: none; color: var(--dim); }
  /* チュートリアルのステップが ui: [...] で一時的に出すもの。
     display は隠す前の値に戻す必要があるため、要素ごとに書く */
  #app.tourMode #controls.tourShow { display: grid; }
  /* 縦スライダーは操作パネルと一組。パネルを出す回では一緒に出す */
  /* ビューで振り分ける。2つは同じ位置に絶対配置されるので、両方出すと後ろの
     #gAltCell が上に乗り、宇宙ビューなのに地上の「高度」が指を受け取ってしまう
     (見た目は同じなので、角度が動かないようにしか見えない) */
  #app.tourMode:not(.groundMode) #angleCell.tourShow { display: flex; }
  #app.tourMode.groundMode #gAltCell.tourShow { display: flex; }
  /* 操作パネルを出す回でも、畳む ⌃ は出さない。ナレーションバーのすぐ上に来るので
     押すつもりのない指が当たり、説明している当のパネルが引っ込んでしまう
     (戻すための ⌄ もツアー中は隠しているので、手詰まりになる) */
  #app.tourMode #controls #ctrlCollapse { display: none; }
  #app.tourMode #navPanel.tourShow,
  #app.tourMode #viewMode.tourShow { display: flex; }
  #app.tourMode #menuBtn.tourShow { display: block; }
  /* 天体リストはモバイルでは既定で引っ込んでいる (navHidden で画面外へ平行移動)。
     display だけ戻しても画面外のままで、出すための » も tourMode で隠しているため、
     「左のリストからも選べます」と言いながら何も無い状態になる。
     ツアーが出すと決めた回だけは navHidden に勝たせる */
  #app.tourMode.navHidden #navPanel.tourShow { transform: none; pointer-events: auto; }
  #app.tourMode #clock.tourShow #nowBtn { display: block; }
  #app.tourMode #clock.tourShow #dateInput,
  #app.tourMode #clock.tourShow #timeInput { pointer-events: auto; color: var(--text); }
  /* 説明している要素のハイライト */
  .tourHi {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 8px;
    animation: tourPulse 1.8s ease-in-out infinite;
  }
  @keyframes tourPulse {
    0%, 100% { outline-color: var(--accent); }
    50% { outline-color: rgba(242, 178, 62, 0.25); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tourHi { animation: none; }
  }
  /* 自動送りの残り時間 (幅のトランジションで伸ばすので rAF は増やさない) */
  #tourProg {
    position: absolute; top: 0; left: 0; height: 2px; width: 0;
    background: var(--accent); border-radius: 6px 0 0 0;
  }
  #tourHead { display: flex; align-items: baseline; gap: 10px; }
  #tourTitle {
    font-size: 10px; letter-spacing: 0.22em; color: var(--accent);
    text-transform: none;
  }
  #tourStep {
    font-family: var(--font-num); font-variant-numeric: tabular-nums;
    font-size: 10px; letter-spacing: 0.1em; color: var(--dim);
  }
  #tourClose {
    padding: 2px 8px; font-size: 13px; line-height: 1;
    background: none; border: none; color: var(--dim);
  }
  #tourClose:hover { color: var(--text); background: none; }
  /* 操作を検知したときの合図 (次のステップへ進むまでの短い間だけ出す) */
  #tourDone {
    font-size: 10px; letter-spacing: 0.12em; color: var(--accent);
    margin-right: auto;
    opacity: 0; transition: opacity 0.2s;
  }
  #tourDone::before { content: "✓ "; }
  #tourBar.done #tourDone { opacity: 1; }
  #tourText {
    margin: 8px 0 10px;
    font-size: 12.5px; line-height: 1.85; color: var(--text);
    min-height: 3.7em;
  }
  #tourNav { display: flex; align-items: center; gap: 8px; }
  #tourDots { display: flex; align-items: center; gap: 5px; margin-right: auto; }
  #tourDots i {
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(150, 178, 224, 0.28);
  }
  #tourDots i.on { background: var(--accent); }
  #tourPrev, #tourNext { min-width: 62px; }
  #tourPrev:disabled { opacity: 0.35; cursor: default; }
  #tourAuto.on { color: var(--accent); border-color: var(--accent-dim); }
  #tourResume { color: var(--accent); border-color: var(--accent-dim); }

  button {
    font-family: var(--font-ui);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--text);
    background: rgba(150, 178, 224, 0.08);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px 12px;
    cursor: pointer;
    touch-action: manipulation;   /* ダブルタップズーム抑止 */
  }
  input[type="range"], input[type="date"], input[type="time"] { touch-action: manipulation; }
  button:hover { background: rgba(150, 178, 224, 0.16); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { color: #0a0d16; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  button.primary:hover { background: #f7c25c; }
  button.on { color: var(--accent); border-color: var(--accent-dim); }

  #play { min-width: 74px; white-space: nowrap; }
  /* 再生/停止アイコンは SVG (文字グリフだと Android が ⏸ を絵文字描画するため)。
     箱を固定してトグル時のレイアウトのブレも防ぐ */
  #playIcon { margin-right: 5px; display: inline-block; width: 1.1em; height: 1.1em; vertical-align: -0.18em; }
  #playIcon svg { display: block; width: 100%; height: 100%; }

  .slider {
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--dim);
    white-space: nowrap;
  }
  button.step {
    padding: 4px 9px;
    font-size: 13px;
    line-height: 1.2;
    font-family: var(--font-num);
  }
  input[type="range"] {
    accent-color: var(--accent);
  }
  #speedVal, #zoomVal, #magVal {
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 11.5px;
    color: var(--text);
    min-width: 88px;
    text-align: left;
    white-space: nowrap;
  }
  #magVal { min-width: 38px; }

  /* ---- info panel ---- */
  #info {
    top: 50%;
    right: calc(16px + var(--vslGap));
    transform: translateY(-50%) translateX(16px);
    width: 306px; /* border-box: padding 40px + border 2px 込み */
    box-sizing: border-box;
    padding: 18px 20px 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
  }
  #info.open { opacity: 1; pointer-events: auto; transform: translateY(-50%); }
  @media (prefers-reduced-motion: reduce) {
    #info, #navPanel { transition: none; }
  }
  #info .eyebrow {
    font-size: 10px;
    letter-spacing: 0.28em;
    color: var(--accent);
    margin: 0 0 4px;
  }
  #info h2 {
    margin: 0 0 12px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.06em;
  }
  /* 基本情報 / 地球から見る タブ */
  #infoTabs { display: flex; gap: 6px; margin: 0 0 12px; }
  #infoTabs button {
    flex: 1; padding: 5px 8px; font-size: 11px; letter-spacing: 0.04em;
    color: var(--dim); background: none; border: 1px solid var(--line); border-radius: 4px;
    cursor: pointer; transition: color 0.15s, border-color 0.15s;
  }
  #infoTabs button.on { color: var(--accent); border-color: var(--accent-dim); }
  #infoTabs button:hover { color: var(--text); }
  /* ---- 観測地エディタ (中身。枠は #obsSitePop の観測地バー用ルールで指定) ---- */
  #obsLoc { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; font-size: 11px; color: var(--dim); }
  #obsCity {
    flex: 1 1 100%; padding: 4px 6px; font-size: 11px; font-family: var(--font-ui);
    color: var(--text); background: rgba(150, 178, 224, 0.08);
    border: 1px solid var(--line); border-radius: 3px; cursor: pointer;
  }
  .obsField { display: inline-flex; align-items: stretch; }
  #obsLoc input {
    width: 56px; padding: 3px 5px; font-size: 11px; font-family: var(--font-num);
    color: var(--text); background: rgba(150, 178, 224, 0.08);
    border: 1px solid var(--line); border-radius: 3px 0 0 3px; border-right: none; text-align: right;
    -moz-appearance: textfield; appearance: textfield;
  }
  #obsLoc input::-webkit-outer-spin-button,
  #obsLoc input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  #obsLoc input:focus-visible { outline: 1px solid var(--accent-dim); }
  .obsHemi {
    padding: 0 8px; font-size: 11px; letter-spacing: 0.04em; color: var(--accent);
    background: rgba(150, 178, 224, 0.08); border: 1px solid var(--line);
    border-radius: 0 3px 3px 0; cursor: pointer; min-width: 26px;
  }
  .obsHemi:hover { color: var(--text); }
  #obsGeo {
    padding: 3px 9px; font-size: 10px; color: var(--dim);
    background: none; border: 1px solid var(--line); border-radius: 3px; cursor: pointer;
  }
  #obsGeo:hover { color: var(--text); }
  #info table { width: 100%; border-collapse: collapse; color: var(--text); font-family: var(--font-ui); }
  #info td {
    padding: 4.5px 0;
    font-size: 11.5px;
    border-top: 1px solid var(--line);
    vertical-align: top;
  }
  #info td:first-child { color: var(--dim); letter-spacing: 0.06em; white-space: nowrap; padding-right: 14px; }
  #info td:last-child {
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    text-align: right;
    letter-spacing: 0.02em;
  }
  #info .fact {
    margin: 12px 0 0;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size: 11.5px;
    line-height: 1.75;
    color: var(--text);
  }
  #info .credit {
    margin: 10px 0 0;
    padding-top: 8px;
    border-top: 1px solid var(--line);
    font-size: 9.5px;
    line-height: 1.6;
    letter-spacing: 0.04em;
    color: var(--dim);
  }
  #closeInfo {
    position: absolute;
    top: 10px; right: 10px;
    padding: 2px 8px;
    font-size: 13px;
    line-height: 1.4;
    background: none;
    border: none;
    color: var(--dim);
  }
  #closeInfo:hover { color: var(--text); background: none; }

  /* ---- hint ---- */
  #hint {
    position: absolute;
    left: 50%;
    bottom: 76px;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--dim);
    pointer-events: none;
    transition: opacity 1s;
    white-space: nowrap;
  }
  #hint.fade { opacity: 0; }

  /* 高解像度テクスチャの保存確認。ツアーバーと同じ位置・幅に置く
     (同時に出ることはない — ツアー中はメニューを開けない) */
  #hiResConfirm {
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    width: min(520px, calc(100vw - 24px));
    box-sizing: border-box;
    padding: 14px 16px 12px;
    z-index: 17;   /* 開いたメニュー(16)より前面 */
    display: none;
  }
  #hiResConfirm.open { display: block; }
  #hiResConfirm p { margin: 0 0 10px; font-size: 12px; line-height: 1.7; }
  #hiResConfirm .row { display: flex; justify-content: flex-end; gap: 8px; }

  #noGL {
    position: absolute;
    inset: 0;
    display: none;
    place-items: center;
    font-size: 13px;
    color: var(--dim);
    text-align: center;
    line-height: 2;
  }

  @media (max-width: 720px) {
    #title { padding: 6px 10px 6px 6px; gap: 6px; }
    #title h1 { font-size: 11px; letter-spacing: 0.14em; }
    #menuBtn { padding: 4px 6px; font-size: 15px; }
    #clock { padding: 6px 10px; }
    #dateInput, #timeInput { font-size: 13px; }
    #nowBtn { font-size: 9px; padding: 2px 8px; margin-top: 4px; }
    #tourBar {
      left: 8px; right: calc(8px + var(--vslGap));
      width: auto; transform: none; padding: 10px 12px 8px;
    }
    #tourText { margin: 6px 0 8px; font-size: 11.5px; line-height: 1.7; min-height: 0; }
    #tourPrev, #tourNext { min-width: 0; }
    /* 縦持ち: 日付を上、時刻を下の2行にしてタイトルと重ならないよう幅を詰める */
    #clock .dtrow { flex-direction: column; align-items: flex-end; gap: 1px; }
    /* 情報パネル: 操作パネルの直上に、同程度の高さで内部スクロール。
       右端は縦スライダー (角度/高度) のぶんを空ける */
    #info {
      top: auto;
      left: 8px;
      right: calc(8px + var(--vslGap));
      bottom: calc(190px + env(safe-area-inset-bottom, 0px));
      width: auto;
      max-height: 160px;
      overflow-y: auto;
      scrollbar-width: thin;
      transform: translateY(8px);
    }
    #info.open { transform: none; }
    #hint { display: none; }
    #menu { top: calc(60px + var(--sat)); }
    /* top は指定しない。上端は観測地バーぶんを空けた 108px で全画面サイズ共通 */
    #navPanel { max-height: 40vh; max-height: 40dvh; }
    #masterToggles button { padding: 3px 9px; font-size: 10px; }
    #nav { gap: 3px; }
    #nav button { padding: 4px 9px; font-size: 10px; }
    #controls {
      /* 縮小適合幅だと min-width:0 の値列が 0 に潰れるため、全幅固定にする */
      left: 8px; right: 8px; transform: none; max-width: none;
      gap: 3px 4px;
      padding: 6px 10px;
      grid-template-columns: auto auto auto minmax(50px, 1fr) auto auto;
    }
    #controls button { padding: 4px 9px; }
    #app.ctrlHidden #controls { transform: translateY(calc(100% + 40px + env(safe-area-inset-bottom, 0px))); }
    button { padding: 6px 9px; font-size: 11px; }
    /* 再生/停止は記号のみ + 値表示を圧縮して、高度カラム (7列目) を収める */
    #play { min-width: 0; }
    #playLabel { display: none; }
    #playIcon { margin-right: 0; }
    #speedVal, #zoomVal, #magVal, #gFovVal, #gAzDir { min-width: 0; font-size: 10px; }
    /* 値は速度によって伸び縮みする (最長「12.2 時間/秒」= 68px)。畳んだままだと
       その差がそのまま隣のスライダーの幅の揺れになるので、最長ぶんで固定する。
       行見出しをアイコンにして空いたぶんで、320px 級でも収まるようになった */
    #speedVal, #zoomVal { min-width: 68px; }
  }


  /* ---- 横向きスマホ / 高さの低い画面 (Landscape) ---- */
  @media (max-height: 480px) {
    /* 左端のノッチのセーフエリアは半分だけ尊重して余白を詰める
       (上端付近の HUD はノッチと垂直位置が重ならないため) */
    /* 左端の基準。ノッチを避ける最小位置でもある (帯を縦に横切る要素と同じ値)。
       ハンバーガーの左端をここに置き、開いたメニューの左端も同じ値にして揃える */
    :root { --barL: max(calc(16px + var(--sal)), 44px); }
    /* タイトルの枠線 1px と padding-left 6px ぶん戻すと、中の ☰ の左端が
       --barL に来る = 開いたメニューの左端とちょうど揃う */
    #title { padding: 6px 10px 6px 6px; gap: 6px; left: calc(var(--barL) - 7px); }
    #title h1 { font-size: 11px; letter-spacing: 0.14em; }
    #menuBtn { padding: 4px 6px; font-size: 15px; }
    /* 横持ちではメニューが画面より高くなる (13項目で 498px / 画面 393px)。
       はみ出したぶんは触れないので、収まらないときだけ中でスクロールさせる。
       左はリストやガイドと同じくノッチの帯を縦に横切るので同じ扱いにする */
    #menu {
      top: calc(54px + var(--sat));
      left: var(--barL);
      max-height: calc(100vh - 62px);
      max-height: calc(100dvh - 62px - var(--sat) - env(safe-area-inset-bottom, 0px));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }
    /* 横持ちは縦が足りない。時計を2段 (日時 / 現在時刻に合わせる) で組むと 55px
       使い、その下に入る情報パネルがそのぶん痩せる。上部は横に空いているので、
       ボタンを日時の左へ並べて1段にする (55px → 30px) */
    #clock {
      display: flex; flex-direction: row-reverse; align-items: center; gap: 10px;
      padding: 5px 10px;
    }
    #dateInput, #timeInput { font-size: 13px; }
    #nowBtn { font-size: 9px; padding: 2px 8px; margin-top: 0; }
    /* 横持ちのノッチは画面の左右、しかも上下の中央あたりに来る。上端の HUD
       (タイトル・時計・観測地チップ) は縦位置が重ならないのでセーフエリアを
       半分しか見ないが、ノッチの帯を縦に横切る要素は丸ごと空ける必要がある。
       さらに実機で env() が 0 のまま返る例があり、それだと丸ごと空けても
       避けきれない。セーフエリアと固定の下限の大きい方を採る */
    #tourBar {
      left: max(calc(8px + var(--sal)), 44px);
      right: calc(max(calc(8px + var(--sar)), 20px) + var(--vslGap));
      width: auto; transform: none;
      bottom: calc(6px + env(safe-area-inset-bottom, 0px)); padding: 8px 12px 7px;
    }
    /* 縦持ちの3段 (見出し / 説明 / ボタン) だと、操作パネルと同時に出したときに
       画面がほとんど残らない。2段に畳む:
         はじめての操作  3/11  ・・・・・  ✓できました  ✕
         ◀  〜〜説明文〜〜  シーンに戻す  自動送り  次へ▶
       行をまたいで並べ替えるため、包み (tourHead/tourNav) は display: contents で
       畳んで、中身を直接グリッドに載せる */
    #tourBar.open {
      display: grid;
      grid-template-columns: auto auto 1fr auto auto auto;
      align-items: center;
      column-gap: 8px; row-gap: 3px;
    }
    #tourHead, #tourNav { display: contents; }
    #tourTitle { grid-row: 1; grid-column: 1; }
    #tourStep  { grid-row: 1; grid-column: 2; }
    #tourDots  { grid-row: 1; grid-column: 3; margin: 0; justify-self: start; }
    #tourDone  { grid-row: 1; grid-column: 4 / span 2; margin: 0; justify-self: end; }
    #tourClose { grid-row: 1; grid-column: 6; justify-self: end; }
    #tourPrev   { grid-row: 2; grid-column: 1; }
    #tourText   { grid-row: 2; grid-column: 2 / span 2; margin: 0; }
    #tourResume { grid-row: 2; grid-column: 4; }
    #tourAuto   { grid-row: 2; grid-column: 5; }
    #tourNext   { grid-row: 2; grid-column: 6; }
    #tourText { font-size: 11px; line-height: 1.55; min-height: 0; }
    #tourPrev, #tourNext { min-width: 0; }
    #hint { display: none; }
    /* 観測地チップはタイトルの右横へ。縦持ちのようにタイトルの下に積むと、
       その帯ぶん天体リストが下がり、ただでさえ足りない縦をさらに使う。
       上端は横に空いているので、そちらへ逃がす (--titleR は実測値) */
    #obsSiteBar {
      top: calc(16px + var(--sat));
      left: calc(var(--titleR, 170px) + 10px);
    }
    /* 観測地バーが上へ抜けたぶん、天体リストをタイトルのすぐ下まで上げる。
       #app #navPanel (ID 2つ) に勝たせるため、こちらも同じ形で書く */
    #app #navPanel, #app #navExpand { top: calc(57px + var(--sat)); }
    /* リストはノッチの帯を縦に横切るので、#tourBar と同じ扱いにする
       (半分だけ避けていたため、天体名の頭がノッチに食われていた) */
    #navPanel {
      left: max(calc(16px + var(--sal)), 44px);
      max-height: calc(100vh - 134px);
      max-height: calc(100dvh - 134px - var(--sat));
    }
    #navExpand { left: max(var(--sal), 28px); }
    #nav button { padding: 3px 9px; font-size: 10px; }
    #controls {
      /* ホームバーのセーフエリアも半分だけ尊重して画面下端に寄せる */
      bottom: calc(4px + env(safe-area-inset-bottom, 0px) / 2);
      gap: 2px 6px;
      padding: 5px 10px;
      grid-template-columns: auto auto auto minmax(70px, 130px) auto auto;
    }
    #ctrlExpand { bottom: calc(4px + env(safe-area-inset-bottom, 0px) / 2); }
    #controls button { padding: 3px 8px; font-size: 10.5px; }
    #play { min-width: 0; }
    #playLabel { display: none; }
    #playIcon { margin-right: 0; }
    /* 情報パネルは右側に縦利用 (時計の下から)。時計は上端 16px + 高さ 30px
       (1段に詰めた後) なので、下端は 46px。実際の高さは positionInfoPanel が
       操作パネルの上端まで測って決めるので、ここの max-height は保険 */
    #info {
      top: calc(55px + var(--sat));
      right: calc(8px + var(--sar) + var(--vslGap));
      bottom: auto;
      left: auto;
      transform: translateX(16px);
      width: min(290px, 42vw);
      max-height: calc(100vh - 63px);
      max-height: calc(100dvh - 63px - var(--sat) - env(safe-area-inset-bottom, 0px));
      overflow-y: auto;
      scrollbar-width: thin;
    }
    #info.open { transform: none; }
  }

  /* ---- モバイル共通 (縦持ち・横持ち) ---- */
  @media (max-width: 720px), (max-height: 480px) {
    /* 操作パネルの高さを決めているのは行間ではなく、右端の縦スライダー列
       (宇宙=角度 / 地上=高度)。3行すべてにまたがるので、この列を縮めない
       かぎりパネルは縮まない — 中身が 26px しかない行が、この列の 144px に
       合わせて 44px へ引き伸ばされていた。
       つまみの可動域と ▲▼ は残す (指で細かく動かすには押して1目盛りが要る) */
    #app.groundMode #controls #gAltCell,
    #app:not(.groundMode) #controls #angleCell { gap: 2px; }
    #gAltCell #gAlt, #angleCell #angle { min-height: 38px; }
    #gAltLabelTop, #gAltVal, #angleCell #angleLabel, #angleVal { font-size: 9.5px; }
    #gAltCell .step, #angleCell .step { padding: 0 8px; font-size: 9px; }

    /* カメラは文字だと 1列目が 70px 近くまで広がり、縦持ちでは収まらないので
       4行目へ落としていた。アイコンにすれば ▲▼ と同じ幅で 1列目に収まり、
       PC・横持ちと同じ位置 (1列目の2〜3行) に置ける。
       select の中に SVG は入れられないので、文字を透明にして背景に置く
       (開いたときの一覧は OS が描くので影響しない)。背景画像では currentColor
       が使えないため、色は --text の値を直に書いている */
    #camSelect {
      color: transparent;
      appearance: none; -webkit-appearance: none;
      /* select は最長の選択肢 (「全体表示」) で幅が決まる。文字を透明にしても
         箱はその幅のままなので、明示的に詰める (▲▼ と同じくらいの指の的) */
      width: 34px; min-width: 0;
      padding: 6px 2px;
    }
    /* アイコンは select と同じセルへ重ねる (グリッドは同じ区画に複数置ける)。
       指は下の select に通す */
    #app:not(.groundMode) #controls #camIcon {
      display: block;
      grid-column: 1; grid-row: 2 / span 2;
      justify-self: center; align-self: center;
      pointer-events: none;
      color: var(--text);
    }

    /* モーダル3種 (ガイドツアー一覧・操作方法・ライセンス)。PC と同じ字送りだと
       ツアーはカード2枚、操作方法は数行で画面が埋まる。3つとも一段落とす —
       枠と見出しは共通の指定なので、ここでも揃えて掛ける */
    #about, #howto, #tourList { padding: 14px 16px 12px; }
    #about h2, #howto h2, #tourList h2 { font-size: 13px; margin-bottom: 8px; }
    #aboutClose, #howtoClose, #tourListClose { top: 8px; right: 8px; font-size: 12px; }
    #about h3, #howto h3 { margin: 12px 0 5px; font-size: 9px; }
    #about p, #howto p { margin: 5px 0; font-size: 10.5px; line-height: 1.7; }
    #about td, #howto td { padding: 3px 0; font-size: 10px; }
    #about td:first-child, #howto td:first-child { padding-right: 10px; }
    #tourList .tourCard { padding: 9px 11px 8px; margin-top: 8px; }
    #tourList .tourCard h3 { margin-bottom: 3px; font-size: 12px; }
    #tourList .tourCard p { font-size: 10.5px; line-height: 1.7; }
    #tourList .tourNo { font-size: 10px; }
    #tourList .tourNew { margin-left: 6px; padding: 1px 5px; font-size: 8.5px; }
    #tourList .tourMeta { margin-top: 7px; font-size: 9px; }
    #tourList .tourStart { padding: 4px 12px; font-size: 10px; }
  }

</style>

  <!-- 狭い画面は 3 つ並べる幅が無いので、選択中のビューを出す select にする

    <button id="play" class="primary"><span id="playIcon"><svg viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><rect x="2.4" y="1.8" width="2.6" height="8.4" rx="0.7"/><rect x="7" y="1.8" width="2.6" height="8.4" rx="0.7"/></svg></span><span id="playLabel">停止</span></button>
    <label class="slider" id="speedLabel" for="speed" title="速度"><svg class="ctlIcon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="4.5"/><path d="M6 3.3V6.1l2 1.3"/></svg><span class="vh">速度</span></label>
    <button id="speedDown" class="step" aria-label="遅くする">−</button>

  const s2l1 = (v) => (v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));

  //   fit   この軌道半径 [au] が画面に収まる距離にする (画角と縦横比から算出)。
  //         目的地の軌道を写す回は、軌道半径の 1.25倍ほどを渡す — ぴったりの
  //         値だと軌道の輪も惑星の名前も画面の端に貼りつく
  //   km    選択天体からの距離 [km]
  //   z     カメラ距離 [world]。km / fit / z は後から書いたものだけが効く
  //   mag   ズーム倍率   a 俯角 [rad]   y 方位 [rad]
  //   lit   true なら太陽光の当たる側へ回り込む (a・y より優先)
  //   side  true なら彗星の尾を横から見る向きへ回り込む (y より優先)
  //   apart 中心天体とこの天体が画面上で重ならない向きへ回り込む (lit より優先)
  //   front この天体が中心天体の手前に重なる向きへ回り込む (apart の逆)。
  //         km をこの天体までの距離より大きくすると、円盤を背に小さく写る
  //   on    その回に乗る機体 (既定はツアーの主役)。分離した子機に乗り換えるとき
  //   dot   探査機を点だけで描く。天体を大きく写す回で、機体が天体に埋まって
  //         見えるのを避ける
  //   stay  ride の天体までこの距離 [km] まで寄ったら、それ以上は寄らない。
  //         天体が画面を覆ったあとも追走すると画が動かなくなるため。手前から
  //         滑らかに減速して止まり、以後は置いていかれる機体が小さく描かれる

                "「当たり年がある」のは、均されていない細い帯がまだ残っているからです。日付は定常、量は定常ではない。" +
                "この画面の日付を動かせば、どの群も同じように空へ出てきます。",
            en: "The date repeats because the dust has spread all the way around the orbit, so the crossing " +
                "point stays put. The outbursts happen because narrow, un-spread trails are still out there. " +
                "The timing is steady; the numbers are not. " +
                "Change the date on this screen and any of these showers will come back.",
          },
        },
      ],
    },
  ];

  //#endregion
  //#region src/core/math.js
  // ---------- 表示スケール (実距離・実サイズ) ----------
  const WORLD = 340;              // 海王星軌道 (30.11 au) = WORLD
  const K_REAL = WORLD / 30.11;
  const AU_KM = 149597870.7;
  const KM2W = K_REAL / AU_KM;    // km → world 単位

  function mapRadius(rAU) {
    return rAU * K_REAL;
  }

  // 天体の表示半径 (world 単位, 実寸比)
  function bodyR(b) {
    return b.rkm * KM2W;
  }

  // ---------- ケプラー軌道 (3D) ----------
  for (const p of PLANETS) {
    const w = (p.peri - p.node) * DEG, O = p.node * DEG, inc = p.i * DEG;
    const cw = Math.cos(w), sw = Math.sin(w), cO = Math.cos(O), sO = Math.sin(O), ci = Math.cos(inc), si = Math.sin(inc);
    // 軌道面 → 黄道座標の回転係数 (定数)
    p.m = [
      cO * cw - sO * sw * ci, -cO * sw - sO * cw * ci,
      sO * cw + cO * sw * ci, -sO * sw + cO * cw * ci,
      sw * si, cw * si,
    ];
  }

  // 実際の近日点通過日 (TT)。ハレー彗星は木星・土星の摂動で回帰間隔が毎回
  // 0.5年ほど変わるため、単一の公転周期では全ての回帰に時期を合わせられない
  // (1986年に合わせると1910年が約半年ずれ、近日点付近では位置が大きく外れる)。
  // 区間ごとの実周期で平均近点角を求めることで、どの回帰でも時期を合わせる
  const PERI_EPOCHS = {
    halley: [
      Date.UTC(1835, 10, 16), Date.UTC(1910, 3, 20), Date.UTC(1986, 1, 9),
      Date.UTC(2061, 6, 28), Date.UTC(2134, 2, 27),
    ].map((ms) => (ms - J2000) / DAY_MS),
  };
  for (const p of PLANETS) {
    if (PERI_EPOCHS[p.key]) p.periT = PERI_EPOCHS[p.key];
  }
  // 平均近点角。近日点通過日の表を持つ天体は、その区間の実周期から求める
  // (表の範囲外は両端の区間の周期で外挿)
  function meanAnom(p, days) {
    const tp = p.periT;
    if (!tp) return (p.L0 - p.peri) * DEG + 2 * Math.PI * days / p.T;
    let i = 0;
    while (i < tp.length - 2 && days >= tp[i + 1]) i++;
    return 2 * Math.PI * (days - tp[i]) / (tp[i + 1] - tp[i]);
  }

  function keplerAU(p, days, out) {
    const M = meanAnom(p, days) % (2 * Math.PI);
    let E = M;
    // 反復回数はハレー彗星 (e≈0.97) でも収束する回数に設定
    for (let k = 0; k < 12; k++) E -= (E - p.e * Math.sin(E) - M) / (1 - p.e * Math.cos(E));
    const xo = p.a * (Math.cos(E) - p.e);
    const yo = p.a * Math.sqrt(1 - p.e * p.e) * Math.sin(E);
    out[0] = p.m[0] * xo + p.m[1] * yo;   // 黄道 X
    out[1] = p.m[2] * xo + p.m[3] * yo;   // 黄道 Y
    out[2] = p.m[4] * xo + p.m[5] * yo;   // 黄道 Z (北)
    return out;
  }

  // 現在の離心近点角 E ∈ [0, 2π) を返す (軌道の高精細パッチ用)
  function keplerE(p, days) {
    const M = meanAnom(p, days) % (2 * Math.PI);
    let E = M;
    for (let k = 0; k < 12; k++) E -= (E - p.e * Math.sin(E) - M) / (1 - p.e * Math.cos(E));
    return ((E % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  }

  // 黄道座標 [AU] → ワールド座標 (Y-up)
  function toWorld(au, out) {
    const r = Math.hypot(au[0], au[1], au[2]);
    const s = r < 1e-9 ? 0 : mapRadius(r) / r;
    out[0] = au[0] * s;
    out[1] = au[2] * s;
    out[2] = -au[1] * s;
    return out;
  }

  // ---------- 最小 mat4 (列優先) ----------
  //   out を渡すとその配列に書き込んで返す (毎フレームのアロケーション回避)。
  //   mMul の out は a・b と別の配列であること。
  function mIdent(out) {
    const o = out || new Float32Array(16);
    o.fill(0); o[0] = o[5] = o[10] = o[15] = 1;
    return o;
  }
  function mMul(a, b, out) {
    const o = out || new Float32Array(16);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
      o[c*4+r] = a[r]*b[c*4] + a[4+r]*b[c*4+1] + a[8+r]*b[c*4+2] + a[12+r]*b[c*4+3];
    }
    return o;
  }
  function mPersp(fovy, aspect, near, far, out) {
    const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
    const o = out || new Float32Array(16);
    o.fill(0);
    o[0] = f / aspect; o[5] = f; o[10] = (far + near) * nf; o[11] = -1; o[14] = 2 * far * near * nf;
    return o;
  }
  function mLookAt(eye, tgt, up, out) {
    const o = out || new Float32Array(16);
    let zx = eye[0]-tgt[0], zy = eye[1]-tgt[1], zz = eye[2]-tgt[2];
    let l = Math.hypot(zx,zy,zz); zx/=l; zy/=l; zz/=l;
    let xx = up[1]*zz - up[2]*zy, xy = up[2]*zx - up[0]*zz, xz = up[0]*zy - up[1]*zx;
    l = Math.hypot(xx,xy,xz) || 1; xx/=l; xy/=l; xz/=l;
    const yx = zy*xz - zz*xy, yy = zz*xx - zx*xz, yz = zx*xy - zy*xx;
    o[0]=xx; o[1]=yx; o[2]=zx; o[3]=0;
    o[4]=xy; o[5]=yy; o[6]=zy; o[7]=0;
    o[8]=xz; o[9]=yz; o[10]=zz; o[11]=0;
    o[12] = -(xx*eye[0]+xy*eye[1]+xz*eye[2]);
    o[13] = -(yx*eye[0]+yy*eye[1]+yz*eye[2]);
    o[14] = -(zx*eye[0]+zy*eye[1]+zz*eye[2]);
    o[15] = 1;
    return o;
  }
  function mRotX(a, out) {
    const c=Math.cos(a), s=Math.sin(a);
    const o = out || new Float32Array(16);
    o.fill(0); o[0]=1; o[5]=c; o[6]=s; o[9]=-s; o[10]=c; o[15]=1;
    return o;
  }
  function mRotY(a, out) {
    const c=Math.cos(a), s=Math.sin(a);
    const o = out || new Float32Array(16);
    o.fill(0); o[0]=c; o[2]=-s; o[5]=1; o[8]=s; o[10]=c; o[15]=1;
    return o;
  }
  function mTRS(t, rot, s, out) {
    const o = out || new Float32Array(16);
    if (rot) {
      for (let i = 0; i < 12; i++) o[i] = rot[i] * s;
    } else {
      o.fill(0); o[0] = o[5] = o[10] = s;
    }
    o[3] = o[7] = o[11] = 0;
    o[12] = t[0]; o[13] = t[1]; o[14] = t[2]; o[15] = 1;
    return o;
  }

  //#endregion
  //#region src/gl/setup.js
  // ---------- WebGL 初期化 ----------
  const glc = document.getElementById("gl");
  const gl = glc.getContext("webgl", { antialias: true, alpha: false });
  if (!gl) {
    document.getElementById("noGL").style.display = "grid";
    return;
  }
  const ovl = document.getElementById("overlay");
  const octx = ovl.getContext("2d");

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      throw new Error("shader: " + gl.getShaderInfoLog(sh));
    }
    return sh;
  }
  function program(vs, fs) {
    const pr = gl.createProgram();
    gl.attachShader(pr, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(pr, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) {
      throw new Error("link: " + gl.getProgramInfoLog(pr));
    }
    const u = {}, a = {};
    const nu = gl.getProgramParameter(pr, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < nu; i++) { const info = gl.getActiveUniform(pr, i); u[info.name] = gl.getUniformLocation(pr, info.name); }
    const na = gl.getProgramParameter(pr, gl.ACTIVE_ATTRIBUTES);
    for (let i = 0; i < na; i++) { const info = gl.getActiveAttrib(pr, i); a[info.name] = gl.getAttribLocation(pr, info.name); }
    return { pr, u, a };
  }

  // 全シェーダ共通の前置き。色は「sRGB のテクスチャ・定数 → リニアへ戻す →
  // リニアのまま照明を計算 → 露出 → トーンマップ → sRGB へ書き戻す」の順で扱う。
  // 以前は sRGB 値をそのまま掛けていたため、昼夜の境界が不自然に硬く、明るい
  // 面ほど暗く沈んでいた。EXPOSURE は「真正面から照らされた面が元テクスチャと
  // ほぼ同じ明るさで出る」ように決めてある
  const PRE = `precision highp float;
    const float EXPOSURE = 1.15;
    vec3 srgbToLinear(vec3 c) {
      return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)), step(vec3(0.04045), c));
    }
    vec3 linearToSrgb(vec3 c) {
      c = max(c, vec3(0.0));
      return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(vec3(0.0031308), c));
    }
    // ACES のフィルミックカーブ。白飛びを滑らかに丸める
    vec3 acesToneMap(vec3 x) {
      return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
    }
    // リニアの放射輝度 → 画面へ出す sRGB
    vec3 tonemap(vec3 lin) { return linearToSrgb(acesToneMap(lin * EXPOSURE)); }
`;
  // 画素ごとの微分と、微分を指定したテクスチャ取得。どちらも天体テクスチャの
  // 継ぎ目対策に要る (下の bodyFS)
  const hasDeriv = !!gl.getExtension("OES_standard_derivatives");
  const hasTexLod = hasDeriv && !!gl.getExtension("EXT_shader_texture_lod");
  const EXT_DERIV = hasDeriv ? "#extension GL_OES_standard_derivatives : enable\n" : "";

  // ---- 天体シェーダ (全種別を uType で分岐) ----
  const bodyVS = `
    attribute vec3 aPos;
    uniform mat4 uMVP, uModel;
    uniform float uComet;
    uniform vec3 uOblate;              // 赤道/極の伸縮 (真球なら 1,1,1)
    varying vec3 vL, vW, vN;
    void main() {
      vec3 q = aPos;
      vec3 nrm = aPos;                 // 単位球なので既定では位置がそのまま法線
      vL = aPos;                       // 模様とテクスチャは単位球の向きで引く
      if (uComet > 0.5) {
        // ハレー核の実測に近い細長い比率と、低ポリ化せず分かる程度の凹凸
        vec3 s = vec3(1.28, 0.72, 0.82);
        q *= s;
        float rough = 1.0 + sin(q.x * 19.0 + q.y * 13.0) *
                            sin(q.z * 17.0 - q.x * 7.0) * 0.055;
        q *= rough;
        // 非等方スケール後は「位置 = 法線」が成り立たない。楕円体の法線は
        // 逆数スケールに比例する (位置を使うと明暗境界が最大30°ずれる)。
        // 凹凸ぶんの傾きは頂点シェーダでは出せないため近似のまま
        nrm = normalize(aPos / s);
        vL = q;                        // 彗星だけは歪んだ形そのものを模様の座標にする
      } else {
        // 自転で赤道方向に膨らんだ回転楕円体。非等方スケールなので法線は
        // 逆数スケールで出す (位置をそのまま使うと明暗境界がずれる)
        q = aPos * uOblate;
        nrm = normalize(aPos / uOblate);
      }
      vW = (uModel * vec4(q, 1.0)).xyz;
      vN = normalize((uModel * vec4(nrm, 0.0)).xyz);
      gl_Position = uMVP * vec4(q, 1.0);
    }`;

  // 空の色は空ドームと天体のエアライトで共有する (GLSL は入れ子 include できないので
  // ここで前置きして両方に持たせる)
  const SKY_FN = `
    // 昼の空の色 (地上ビュー)。空ドームと、天体に上乗せする大気の光 (エアライト)
    // で同じ式を使うため切り出してある。
    //   d = 視線方向 (地平フレーム [東, 天頂, -北])  s = 太陽方向  day = 昼夜係数
    //
    // 大気散乱 (単散乱) を視線に沿って積分する。以前は色を手で置いていたが、
    // 「夕焼けは地平に沿った帯」「沈む太陽は赤い」といった性質をいちいち手で
    // 作り込むことになり、しかも中間の時刻で嘘が出た。散乱を解けばどれも
    // 式から出てくる。
    //
    //   レイリー散乱 … 空気分子。断面積が波長の4乗に反比例するので青が強い。
    //                  太陽が低いと光路が延び、青が散乱しきって赤だけ残る = 夕焼け
    //   ミー散乱     … エアロゾル。波長依存が弱く前方に強い = 太陽まわりの白い暈
    //
    // 地球を球として扱うので、光路長が高度で正しく延びる。平行平面の近似だと
    // 日の入りぎわで発散して破綻する。
    //
    // 返すのはリニアの放射輝度 (呼び出し側で tonemap する)。色定数は無い —
    // 散乱係数と太陽の強さだけで決まる
    const float ATM_RG = 6360.0;                  // 地表 [km]
    const float ATM_RA = 6420.0;                  // 大気の上端 [km]
    const float ATM_HR = 8.0;                     // レイリーのスケールハイト [km]
    const float ATM_HM = 1.2;                     // ミーのスケールハイト [km]
    const vec3  ATM_BR = vec3(0.0058, 0.0135, 0.0331);   // レイリー散乱係数 [1/km]
    const float ATM_BM = 0.0040;                  // ミー散乱係数 [1/km]
    const float ATM_G  = 0.76;                    // ミーの非対称因子 (前方散乱の強さ)
    const float ATM_SUN = 7.0;                    // 太陽の強さ (画面の明るさ合わせ)
    const float ATM_MULT = 0.45;                   // 多重散乱の近似 (地平の霞)

    // 中心 (地球の中心) を原点とする球と ray の交点。手前の解と奥の解を返す。
    // 交わらないときは x > y になる
    vec2 atmSphere(vec3 o, vec3 d, float r) {
      float b = dot(o, d);
      float c = dot(o, o) - r * r;
      float disc = b * b - c;
      if (disc < 0.0) return vec2(1.0, -1.0);
      float sq = sqrt(disc);
      return vec2(-b - sq, -b + sq);
    }

    vec3 skyDayColor(vec3 d, vec3 s, float day) {
      // 宇宙ビュー (day = 0) では大気が無い。GLSL は遅延評価しないので、
      // ここで抜けないと天体の画素すべてで積分を回すことになる
      if (day <= 0.001) return vec3(0.0);

      vec3 sun = normalize(s);
      vec3 o = vec3(0.0, ATM_RG + 0.5, 0.0);      // 観測者 (高度 0.5km ≒ 地表)

      // 視線が大気を抜けるまで。地面に当たるならそこで打ち切る
      // (地平線より下を向いたときのエアライトが空と同じ明るさにならないように)
      float tMax = atmSphere(o, d, ATM_RA).y;
      if (tMax <= 0.0) return vec3(0.0);
      vec2 g = atmSphere(o, d, ATM_RG);
      if (g.x < g.y && g.x > 0.0) tMax = min(tMax, g.x);

      const int VIEW_N = 12;
      const int SUN_N = 4;
      float segLen = tMax / float(VIEW_N);
      float odR = 0.0, odM = 0.0;                 // 視線に沿った光学的厚さ
      vec3 sumR = vec3(0.0), sumM = vec3(0.0), sumMS = vec3(0.0);

      for (int i = 0; i < VIEW_N; i++) {
        vec3 p = o + d * (segLen * (float(i) + 0.5));
        float h = length(p) - ATM_RG;
        float hr = exp(-h / ATM_HR) * segLen;
        float hm = exp(-h / ATM_HM) * segLen;
        odR += hr;
        odM += hm;

        // この点から太陽へ。地球に遮られていれば陽は当たらない
        // (これが地球の影 = 日没後に空が下から暗くなる理由になる)
        vec2 sg = atmSphere(p, sun, ATM_RG);
        if (sg.x < sg.y && sg.y > 0.0) continue;

        float tSun = atmSphere(p, sun, ATM_RA).y;
        float sLen = tSun / float(SUN_N);
        float odRs = 0.0, odMs = 0.0;
        for (int j = 0; j < SUN_N; j++) {
          vec3 q = p + sun * (sLen * (float(j) + 0.5));
          float hs = length(q) - ATM_RG;
          odRs += exp(-hs / ATM_HR) * sLen;
          odMs += exp(-hs / ATM_HM) * sLen;
        }
        // 行き (太陽 → 散乱点) と帰り (散乱点 → 目) の減衰。
        // ミーの消散はおよそ散乱の 1.1倍 (吸収ぶん)
        vec3 att = exp(-(ATM_BR * (odR + odRs) + ATM_BM * 1.1 * (odM + odMs)));
        sumR += att * hr;
        sumM += att * hm;
        // 多重散乱ぶんの積算。減衰を「灰色」で掛けるのが要点。
        //   - 単散乱と同じ波長ごとの減衰を掛けると、同じだけ赤くなって
        //     「青を戻す」働きをしない (地平がいつ見ても黄色くなる)
        //   - かといって減衰を弱めると、飽和する光路長が遠のいて白む範囲が
        //     空の高いところまで伸びる (実際の白い帯は地平から10度ほど)
        // 波長依存だけ外し、厚みは本来のまま (緑の係数を代表値に) 積む。
        // 色は掛け先の ATM_BR が青寄りなので、単散乱の黄色を打ち消して白くなる
        float attG = exp(-(ATM_BR.g * (odR + odRs) + ATM_BM * 1.1 * (odM + odMs)));
        sumMS += attG * hr;
      }

      // 位相関数 (散乱角ごとの配分)
      float mu = dot(d, sun);
      float pR = 0.0596831 * (1.0 + mu * mu);     // 3/(16π)
      float gg = ATM_G * ATM_G;
      float pM = 0.1193662 * ((1.0 - gg) * (1.0 + mu * mu)) /
                 ((2.0 + gg) * pow(max(1.0 + gg - 2.0 * ATM_G * mu, 1e-4), 1.5));

      vec3 c = (sumR * ATM_BR * pR + sumM * ATM_BM * pM) * ATM_SUN;
      // 多重散乱の近似。単散乱だけだと地平がいつも金色に寄る — 実際は何度も
      // 散乱した光が青を戻し、昼の地平は白っぽい霞になる。きちんと解くには
      // 事前計算テーブルが要るので、単散乱と同じ形の等方成分を足して代える
      c += sumMS * ATM_BR * 0.0796 * ATM_MULT * ATM_SUN;   // 1/(4π) = 等方
      return c * day;
    }
`;
  const bodyFS = EXT_DERIV
    + (hasTexLod ? "#extension GL_EXT_shader_texture_lod : enable\n#define TEXLOD 1\n" : "")
    + PRE + SKY_FN + `
    varying vec3 vL, vW, vN;
    uniform float uType, uTime, uHasTex, uComet, uAmb;
    uniform vec3 uCam, uSun, uColA, uColB, uColC, uRim;
    uniform vec3 uAirSun;   // 大気の光の計算に使う太陽方向 (地平フレーム)
    uniform float uAirDay;  // 昼夜係数。宇宙ビューは 0 (大気が無い)
    uniform vec4 uParams;
    uniform sampler2D uTex;
    uniform mat4 uModel;        // 中心・極方向・スケールを取り出すのに使う
    uniform float uRingOn;      // 環を持つ天体 (土星) だけ 1
    uniform vec2 uRingR;        // 環プロファイルの参照範囲 (内径, 1/(外径-内径))
    uniform sampler2D uRing;
    uniform sampler2D uCloud;   // 地球の雲 (被覆率。グレースケール)
    uniform sampler2D uNight;   // 地球の夜景 (街灯りの強さ。グレースケール)
    uniform float uCloudRot;    // 雲の経度オフセット。地表と別に流すため
    uniform float uSunT;        // 黒点の世代を決める暦の時刻 [日]
    uniform sampler2D uNrm;     // 実測標高から作った接空間の法線 (月・水星・火星)
    uniform float uNrmAmt;      // その強さ。0 = 法線マップを持たない天体
    uniform float uAtmos;       // 1 = 大気シェルとして描く (本体ではなく)
    uniform float uAtmosT;      // シェルの厚み (天体半径を 1 とした比)
    uniform vec3 uEclC;         // 食: 遮蔽体の中心 (uSun と同じ座標系)
    uniform vec2 uEclR;         // x = 遮蔽体の半径 (同じ単位。0 = 食なし), y = 太陽の視半径 [rad]
    uniform vec3 uEclCol;       // 皆既のとき遮蔽体の大気を回り込んで届く光 (リニア)

    // 全球マップの取得はすべてこれを通す。経度方向は必ずどこかで折り返すので、
    // 微分を自動で取らせるとその1列でミップ段が最粗まで落ちて縦縞になる。
    // 折り返しを含まない微分 (dux/duy) を呼び出し側で用意して渡す
#ifdef TEXLOD
    #define SAMPLE(t, c) texture2DGradEXT(t, c, dux, duy)
#else
    #define SAMPLE(t, c) texture2D(t, c)
#endif

    float hash(vec3 p) {
      p = fract(p * 0.1031);
      p += dot(p, p.yzx + 33.33);
      return fract((p.x + p.y) * p.z);
    }
    float noise(vec3 x) {
      vec3 i = floor(x), f = fract(x);
      f = f * f * (3.0 - 2.0 * f);
      return mix(
        mix(mix(hash(i), hash(i+vec3(1,0,0)), f.x), mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
        mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x), mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y),
        f.z);
    }
    float fbm(vec3 p) {
      float v = 0.0, a = 0.5;
      for (int k = 0; k < 5; k++) { v += a * noise(p); p *= 2.02; a *= 0.5; }
      return v;
    }

    void main() {
      vec3 p = normalize(vL);
      vec3 N = normalize(vN);
      vec3 V = normalize(uCam - vW);

      if (uAtmos > 0.5) {
        // ---- 大気シェル ----
        // 本体より一回り大きい球を加算で重ね、円盤の外へはみ出す光の輪を出す。
        // 描くのはシェルの手前側の面だけで、視線が大気の中を通る長さはここで
        // 解析的に求める (天体半径を 1 とした単位で計算する)
        vec3 ctr = uModel[3].xyz;
        float ro = 1.0 + uAtmosT;                     // シェルの外径
        float R = length(uModel[0].xyz) / ro;         // 天体の半径 (ワールド)
        vec3 P = (vW - ctr) / R;
        vec3 C = P - V * dot(P, V);                   // 視線の最接近点
        float b = length(C);                          // 最接近距離 (= 見かけの高度)
        float outer = sqrt(max(ro * ro - b * b, 0.0));
        float inner = sqrt(max(1.0 - b * b, 0.0));
        // 円盤に重なる視線は地表で止まる。外れる視線は大気を貫いて反対側へ抜ける
        float path = b < 1.0 ? outer - inner : 2.0 * outer;
        // 実際の大気は上へ行くほど薄い。指数で落として縁に張り付く輪にする
        float tau = path * 5.5 * exp(-max(b - 1.0, 0.0) / 0.006);
        // 円盤の内側は本体側でもエアライトを足しているので、二重に乗らないよう薄く
        tau *= mix(0.30, 1.0, smoothstep(0.97, 1.02, b));

        vec3 Ld = normalize(uSun - vW);
        float sun = smoothstep(-0.30, 0.25, dot(normalize(C + vec3(1e-6)), Ld));
        float fwd = pow(max(dot(-V, Ld), 0.0), 8.0);  // 太陽が向こう側にあるほど強い
        vec3 col = mix(vec3(0.055, 0.145, 0.400),     // レイリー (青)
                       vec3(0.520, 0.220, 0.080),     // 前方散乱 (朝焼け色)
                       fwd * 0.7)
                 * (1.0 - exp(-tau)) * sun;
        gl_FragColor = vec4(tonemap(col), 0.0);       // 乗算済みアルファでの加算
        return;
      }

      if (uType < 0.5) {
        // ---- 太陽 ----
        // 光球は照らされる面ではなく自発光なので、アルベドではなく放射輝度を直に
        // 置く。赤だけトーンマップの肩を大きく超えさせるのがコツで、そうしないと
        // ACES が彩度を落として白い円盤になる (実際に露出過多の太陽は白く写る)。
        // ここの2色は、画面上の (0.99,0.72,0.26) と (1.0,0.94,0.66) を
        // トーンマップ後に再現するリニア値
        vec3 cA = vec3(3.729, 0.291, 0.050);
        vec3 cB = vec3(8.000, 1.239, 0.230);
        float mu = max(dot(N, V), 0.0);

        // ---- 粒状斑 ----
        // 対流セルなので、明るいセルの中心と暗い境目でできている。大・中・小の
        // 3スケールを重ね、細かいほど速く入れ替わるようにして沸き立たせる
        float g1 = fbm(p * 5.0  + vec3(0.0, uTime * 0.020, uTime * 0.008));
        float g2 = fbm(p * 26.0 + vec3(uTime * 0.05, 0.0, uTime * 0.03));
        float g3 = noise(p * 90.0 + uTime * 0.30);
        float gran = g1 * 0.46 + g2 * 0.34 + g3 * 0.20;
        // 境目 (暗いレーン) を少し立たせる。遠目には効かないので縁では薄める
        gran += (smoothstep(0.42, 0.5, g2) - smoothstep(0.5, 0.58, g2)) * -0.10 * mu;

        // ---- 黒点と白斑 ----
        // 群は緯度 ±30° あたりに現れ、数十日かけて出て消える。世代を暦の時刻から
        // 決めるので、停止中は動かず、同じ日付なら同じ配置になる
        float spot = 0.0, fac = 0.0;
        for (int i = 0; i < 11; i++) {
          float fi = float(i);
          float ph = uSunT / 41.0 + fi * 0.43;
          float gen = floor(ph), age = fract(ph);
          float h1 = hash(vec3(fi, gen, 1.7));
          float h2 = hash(vec3(fi, gen, 5.3));
          float h3 = hash(vec3(fi, gen, 9.1));
          float h4 = hash(vec3(fi, gen, 13.9));
          // 出現から成長し、やがて崩れて消える。3割の世代は群ができない
          float life = smoothstep(0.0, 0.15, age) * (1.0 - smoothstep(0.55, 1.0, age))
                     * step(0.16, h3);
          float lat = (h1 - 0.5) * 0.60;                 // ±約17°
          float lon = h2 * 6.2831853;
          float cl = cos(lat);
          float d = distance(p, vec3(cl * cos(lon), sin(lat), cl * sin(lon)));
          // life=0 のとき smoothstep の両端が一致すると結果が未定義になるので下限を置く
          float sz = max((0.030 + 0.075 * h4) * life, 1e-4);
          float umb = 1.0 - smoothstep(sz * 0.40, sz * 0.62, d);   // 暗部
          float pen = 1.0 - smoothstep(sz * 0.95, sz * 1.20, d);   // 半暗部
          spot = max(spot, umb * 0.90 + (pen - umb) * 0.52);
          // 白斑は群のまわり。縁に近いほど目立つ (実際の観測と同じ)
          fac = max(fac, (1.0 - smoothstep(sz * 1.3, sz * 2.6, d)) * (1.0 - pen) * life);
        }

        // 3スケールを足すと分散が下がるので、閾を狭めてコントラストを戻す
        vec3 c = mix(cA, cB, smoothstep(0.33, 0.71, gran));
        c *= 1.0 - spot * 0.88;
        c += cB * fac * 0.28 * (1.0 - mu * 0.75);        // 白斑
        c *= mix(0.30, 1.0, pow(mu, 0.55));              // 周縁減光
        // ---- 彩層とプロミネンス ----
        // 光球のすぐ外側の薄い層。縁だけに赤い縁取りとして出て、ところどころ
        // 炎のように立ち上がる
        float rim = 1.0 - smoothstep(0.0, 0.22, mu);
        float flame = fbm(p * 9.0 + vec3(uTime * 0.03, 0.0, 0.0));
        c += vec3(2.30, 0.30, 0.16) * pow(rim, 2.2) * (0.35 + 0.9 * flame);
        gl_FragColor = vec4(tonemap(c), 1.0);
        return;
      }

      // ---- 全球マップの uv と、その折り返しを含まない微分 ----
      // 法線マップを照明より先に当てたいので、テクスチャの分岐より上で作る
      vec2 uv = vec2(0.5 - atan(p.z, p.x) / 6.2831853,
                     acos(clamp(p.y, -1.0, 1.0)) / 3.14159265);
      vec2 dux = vec2(0.0), duy = vec2(0.0);
#ifdef TEXLOD
      // 経度は継ぎ目 (atan の折り返し) で 1→0 に飛ぶ。連続な p の微分から
      // 連鎖律で uv の微分を出し、折り返しを含まない値を SAMPLE へ渡す
      {
        vec3 px = dFdx(p), py = dFdy(p);
        float r2 = max(p.x * p.x + p.z * p.z, 1e-8);                // ∂atan の分母
        float sv = 3.14159265 * sqrt(max(1.0 - p.y * p.y, 1e-8));   // ∂acos の分母
        dux = vec2(-(p.x * px.z - p.z * px.x) / (r2 * 6.2831853), -px.y / sv);
        duy = vec2(-(p.x * py.z - p.z * py.x) / (r2 * 6.2831853), -py.y / sv);
      }
#endif

      // ---- 法線マップ (月・水星・火星) ----
      // 実測の標高から作った接空間の法線を、球の法線へ乗せる。アルベド図は
      // 一定の照明で正規化されていて起伏が焼き込まれているため、これが無いと
      // 太陽が動いてもクレーターの陰影が変わらず、のっぺりして見える
      if (uNrmAmt > 0.0) {
        vec3 t = SAMPLE(uNrm, uv).rgb * 2.0 - 1.0;
        // 接基底。極では東西方向が縮退するので、そこは素の法線のままにする
        vec3 e = cross(vec3(0.0, 1.0, 0.0), p);
        float el = length(e);
        if (el > 0.02) {
          e /= el;
          N = normalize(N + (e * t.x + cross(p, e) * t.y) * uNrmAmt);
        }
      }

      vec3 L = normalize(uSun - vW);                // 光源 = 太陽 (カメラ相対座標)
      float dif = max(dot(N, L), 0.0);

      // ---- 環が本体へ落とす影 (土星のみ) ----
      // 地表の点から太陽へ線を伸ばし、環面 (赤道面) との交点の半径を求めて、
      // その半径の透過率で日射を弱める。斜めに抜けるぶん経路長は 1/|cos| 倍
      if (uRingOn > 0.5 && dif > 0.0) {
        vec3 ctr = uModel[3].xyz;                   // 天体の中心
        vec3 axis = normalize(uModel[1].xyz);       // 自転軸 = 環面の法線
        float scl = length(uModel[0].xyz);          // ワールド単位での平均半径
        vec3 P = vW - ctr;
        float pa = dot(P, axis), la = dot(L, axis);
        if (abs(la) > 0.002) {
          float t = -pa / la;                       // 環面まで太陽方向に伸ばす長さ
          if (t > 0.0) {
            float u = (length(P + L * t) / scl - uRingR.x) * uRingR.y;
            if (u > 0.0 && u < 1.0) {
              float tr = texture2D(uRing, vec2(u, 0.5)).a;
              // 環と同じく、影は真っ黒にせず 3割の明るさを残す。B環の影は
              // 実際にはほぼ完全な暗黒だが、雲の模様が見えなくなってしまう
              dif *= mix(0.30, 1.0, pow(max(tr, 0.0015), 1.0 / abs(la)));
            }
          }
        }
      }
      // ---- 食: 他の天体が太陽面を隠す ----
      // 月食 (地球の影に入る月)・日食 (地球へ落ちる月の影)・木星面を渡る
      // ガリレオ衛星の影は、どれも「その点から見て太陽面の何割が遮蔽体に
      // 隠れたか」で決まる。2円の重なり面積をここで解く。遮蔽体の選定は
      // CPU 側 (core/eclipse.js)
      vec3 eclLight = vec3(0.0);
      if (uEclR.x > 0.0) {
        vec3 D = uEclC - vW;
        float d = length(D);
        float ro = asin(clamp(uEclR.x / d, 0.0, 1.0));        // 遮蔽体の視半径
        float rs = uEclR.y;                                   // 太陽の視半径
        float sep = acos(clamp(dot(D / d, L), -1.0, 1.0));    // 中心どうしの離角
        float cov = 0.0;
        if (sep < rs + ro) {
          if (sep <= ro - rs) {
            cov = 1.0;                                        // 皆既
          } else if (sep <= rs - ro) {
            cov = (ro * ro) / (rs * rs);                      // 金環
          } else {
            float ca = clamp((sep*sep + rs*rs - ro*ro) / (2.0*sep*rs), -1.0, 1.0);
            float cb = clamp((sep*sep + ro*ro - rs*rs) / (2.0*sep*ro), -1.0, 1.0);
            cov = (rs*rs * (acos(ca) - ca * sqrt(max(1.0 - ca*ca, 0.0)))
                 + ro*ro * (acos(cb) - cb * sqrt(max(1.0 - cb*cb, 0.0))))
                / (3.14159265 * rs * rs);
          }
        }
        // 本影の中へ届くのは、遮蔽体の大気を回り込んだ光だけ (皆既月食の赤銅色)。
        // 本影の縁ほど明るく中心ほど暗いので、離角で暗くする。大気を持たない
        // 遮蔽体は uEclCol = 0 なので、この項は消える
        float t = clamp(sep / max(ro - rs, 1e-6), 0.0, 1.0);  // 0 = 本影の中心
        eclLight = uEclCol * dif * cov * mix(0.22, 1.0, t * t);
        dif *= 1.0 - cov;
      }

      float lat = p.y;
      // アルベドは以降すべてリニア。uColA/B/C・uRim・uAmb は CPU 側で変換済み、
      // テクスチャと即値だけここで戻す
      vec3 alb = vec3(0.5);
      float spec = 0.0;
      // 地球だけ、地表のあとに雲・夜景・大気を重ねる。そのぶんの持ち回り
      float isEarth = step(3.5, uType) * step(uType, 4.5) * uHasTex;
      float cloud = 0.0;

      if (uComet > 0.5) {
        // ---- 彗星核: 自発光しない、煤と有機物に覆われた非常に暗い表面 ----
        float rock = fbm(p * 6.0 + 2.0);
        float pits = fbm(p * 18.0 - 4.0);
        alb = mix(vec3(0.00310, 0.00334, 0.00359),    // sRGB (0.040,0.043,0.046)
                  vec3(0.04696, 0.03157, 0.01848), rock);  //      (0.240,0.195,0.145)
        alb *= 0.58 + 0.52 * smoothstep(0.28, 0.76, pits);
      } else if (uHasTex > 0.5) {
        // ---- 実テクスチャ (NASA/USGS 全球マップ) ----
        alb = srgbToLinear(SAMPLE(uTex, uv).rgb);
        if (uType > 3.5 && uType < 4.5) {
          // ---- 地球: 雲・雲の影・海面の反射 ----
          // 雲は地表とは別に、ゆっくり東へ流す。1 を超えたぶんは REPEAT に任せる
          // (fract で畳むと、そこで微分が飛んでヨーロッパ〜アフリカに縦縞が出た)
          vec2 cuv = vec2(uv.x + uCloudRot, uv.y);
          cloud = SAMPLE(uCloud, cuv).r;

          // 雲が地表へ落とす影。雲層は地表より CLOUD_H だけ高いので、地表の点から
          // 太陽へ伸ばした線が雲層を横切る位置は接平面方向へ CLOUD_H/cosθ ずれる。
          // 太陽が低いほど影が長く伸びる (朝夕の斜光と同じ)
          float ndl = max(dot(p, L), 0.08);
          vec3 Lt = L - p * dot(L, p);                        // 太陽方向の接平面成分
          vec3 east = normalize(cross(vec3(0.0, 1.0, 0.0), p));
          vec3 north = cross(p, east);
          float k = 0.0016 / ndl;                             // 弧長 (地球半径 = 1)
          float cosLat = max(sqrt(max(1.0 - p.y * p.y, 0.0)), 0.15);
          vec2 suv = vec2(cuv.x + dot(Lt, east) * k / cosLat / 6.2831853,
                          clamp(cuv.y - dot(Lt, north) * k / 3.14159265, 0.0, 1.0));
          alb *= 1.0 - 0.55 * SAMPLE(uCloud, suv).r;

          // 海面の太陽反射 (サングリント)。実物の写真にも写るが、水の正面反射率は
          // 2% しかないので、正面から見ているうちはほとんど光らない。フレネルを
          // 入れずに強度だけで出すと、満に近い画で円盤の真ん中に大きな艶が乗り、
          // 地球儀の照り返しのような見た目になる。
          //   - フレネルは Schlick 近似 (水の F0 = 0.02)。斜めから見るほど強い
          //   - ローブ幅は Cox-Munk の波面傾斜 (σ ≒ 10°) 相当。Blinn の指数は
          //     Phong のおよそ4倍で同じ広さになるので 240
          //   - 最大でもリニア 0.08 程度に収める。Bloom の閾値 (画面輝度 0.72) を
          //     超えると滲みに拾われ、円盤の 1/3 を覆う白い靄になる
          float ocean = smoothstep(0.004, 0.03, alb.b - alb.r) * smoothstep(0.004, 0.03, alb.b - alb.g);
          vec3 Hv = normalize(L + V);
          float fWater = 0.02 + 0.98 * pow(1.0 - max(dot(L, Hv), 0.0), 5.0);
          spec = pow(max(dot(N, Hv), 0.0), 240.0) * fWater * ocean * (1.0 - cloud) * 4.0;

          alb = mix(alb, vec3(0.90), cloud);
        }
      } else if (uType < 1.5) {
        // ---- 岩石 (テクスチャ無し小天体) ----
        float m = fbm(p * 5.0);
        float cr = fbm(p * 16.0 + 5.0);
        alb = mix(uColB, uColA, m);
        alb *= 0.82 + 0.36 * smoothstep(0.35, 0.75, cr);
      } else if (uType < 2.5) {
        // ---- 火星 ----
        alb = mix(uColA, uColB, fbm(p * 4.0));
        alb *= 0.8 + 0.4 * fbm(p * 9.0 + 2.0);
        alb = mix(alb, vec3(0.84809, 0.86890, 0.89001),   // sRGB (0.93,0.94,0.95)
                  smoothstep(0.84, 0.92, abs(lat) + 0.05 * fbm(p * 6.0)));
      } else if (uType < 3.5) {
        // ---- 金星 (雲) ----
        float sw = fbm(vec3(p.x * 2.2, p.y * 6.5, p.z * 2.2) + vec3(uTime * 0.02, 0.0, 0.0));
        alb = mix(uColA, uColB, sw);
      } else {
        // ---- ガス惑星 / 氷惑星 ----
        float d = fbm(p * vec3(3.0, 8.0, 3.0)) * uParams.y;
        float band = sin(lat * uParams.x * 3.14159 + d * 4.0) * 0.5 + 0.5;
        alb = mix(uColA, uColB, band);
        alb = mix(alb, uColC, smoothstep(0.62, 0.95, fbm(p * vec3(2.0, 9.0, 2.0) + 7.0)) * 0.4);
        if (uParams.z > 0.5) {
          // 大赤斑
          float sd = distance(p, normalize(vec3(0.78, -0.32, 0.53)));
          alb = mix(vec3(0.46236, 0.07324, 0.02721),      // sRGB (0.71,0.30,0.18)
                    alb, smoothstep(0.07, 0.17, sd));
        }
      }

      // 昼の空では、光が当たっていない側はエアライトに埋もれて見えない。
      // 環境光とリム光の「光が当たっていないぶん」を落として空に溶け込ませる
      float dayFade = 1.0 - 0.92 * uAirDay;
      float fres = pow(1.0 - max(dot(N, V), 0.0), 2.6);
      alb += uRim * fres * (0.25 * dayFade + 0.75 * dif) * 0.55;

      // uAmb = 夜側の明るさ。呼び出し側が見かけの大きさから決める。点にしか
      // 見えない遠くの天体は見失わないよう明るく、円盤として分解できる大きさ

      float direct = mix(1.0, 1.03, uComet) - ambient;
      vec3 c = alb * (ambient + dif * direct + eclLight) + vec3(spec) * dif;

      if (isEarth > 0.5) {

        // 縁ほど大気を長く見通すので青みが強い。太陽が向こう側にあるとき

        float limb = pow(1.0 - max(dot(N, V), 0.0), 3.2);
        float fwd = pow(max(dot(-V, L), 0.0), 6.0);
        vec3 air = mix(vec3(0.052, 0.135, 0.360),    // レイリー (青)
                       vec3(0.420, 0.180, 0.070),    // 前方散乱 (夕焼け色)
                       fwd * 0.75);
        c += air * limb * smoothstep(-0.28, 0.22, ndl) * (1.0 - uAirDay);

        // 昼夜境界の内側だけ。雲の下は遮られ、地上ビューの昼空では見えない
        float night = smoothstep(0.10, -0.12, ndl);

             * night * (1.0 - cloud * 0.85) * 0.55 * (1.0 - uAirDay);

      c += skyDayColor(normalize(vW), uAirSun, uAirDay);

  // ---- 天の川 (全天マップを天球へ貼る。継ぎ目対策で bodyFS と同じ微分拡張を使う) ----
  const skyVS = `
    attribute vec3 aPos;
    uniform mat4 uVP;
    uniform float uRadius;
    varying vec3 vDir;
    void main() {

  const skyFS = EXT_DERIV
    + (hasTexLod ? "#extension GL_EXT_shader_texture_lod : enable\n#define TEXLOD 1\n" : "")
    + PRE + `
    // 天の川 (拡散光だけの全天マップ)。赤道座標の正距円筒を天球へ貼る。
    // 加算合成で背景として重ねるだけなので、画面の色を直に書く
    // (点・尾・コマなどの発光パスと同じ扱い。トーンマップは通さない)
    varying vec3 vDir;
    uniform mat3 uEq;        // 描画フレームの方向 → 赤道座標
    uniform float uBright;   // 明るさ (昼は 0 へ落とす)
    uniform sampler2D uTex;

    void main() {
      vec3 q = normalize(uEq * normalize(vDir));
      // 地図は左端が赤経 0h、上端が赤緯 +90°。赤経は負側へ回っても REPEAT が畳む
      vec2 uv = vec2(atan(q.y, q.x) * 0.15915494,

      vec2 dux = vec2((q.x * dx.y - q.y * dx.x) / (r2 * 6.2831853), -dx.z / sv);
      vec2 duy = vec2((q.x * dy.y - q.y * dy.x) / (r2 * 6.2831853), -dy.z / sv);
      vec3 c = texture2DGradEXT(uTex, uv, dux, duy).rgb;

      vec3 c = texture2D(uTex, uv).rgb;
#endif
      gl_FragColor = vec4(c * uBright, 0.0);   // 乗算済みアルファでの加算
    }
`;

  // ---- 線 (軌道) ----
  const lineVS = `
    attribute vec3 aPos;
    uniform mat4 uVP;
    void main() { gl_Position = uVP * vec4(aPos, 1.0); }`;
  const lineFS = PRE + `
    uniform vec4 uColor;
    void main() { gl_FragColor = uColor; }`;

  // ---- 風景 (地面の質感 / 空の色。地上・月面ビュー用。すべてプロシージャル生成) ----
  const terrainVS = `
    attribute vec3 aPos;
    uniform mat4 uVP;
    varying vec3 vD;
    void main() { vD = aPos; gl_Position = uVP * vec4(aPos, 1.0); }`;

  const terrainFS = PRE + SKY_FN + `
    varying vec3 vD;
    uniform vec3 uSun;      // 太陽方向 (地平フレーム [東, 天頂, -北])
    uniform float uMoon;    // 1 = 月面, 0 = 地上
    uniform float uDay;     // 昼夜係数 (0 = 夜, 1 = 昼)
    uniform float uSky;     // 1 = 空ドーム, 0 = 地面ドーム
    uniform float uOcc;     // 日食で隠されずに残っている太陽面の割合 (1 = 食なし)。

    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 x) {
      vec2 i = floor(x), f = fract(x);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
                 mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
    }
    float fbm(vec2 p) {
      float v = 0.0, a = 0.5;
      for (int k = 0; k < 5; k++) { v += a * noise(p); p *= 2.03; a *= 0.5; }

    }
    // ボロノイ。x = 最近セル中心までの距離, y = そのセルの乱数 (クレーターの大小・有無に使う)
    vec2 vor(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      float best = 8.0, bid = 0.0;
      for (int y = -1; y <= 1; y++) {
        for (int x = -1; x <= 1; x++) {
          vec2 o = vec2(float(x), float(y));
          vec2 cc = i + o;
          vec2 c = o + vec2(hash(cc), hash(cc + vec2(17.3, 31.7)));
          float d = length(f - c);
          if (d < best) { best = d; bid = hash(cc + vec2(5.2, 9.1)); }
        }
      }
      return vec2(best, bid);
    }
    // クレーター1つぶんの陰影。セルごとに直径を変え、一部のセルには作らない
    float crater(vec2 v, float sun) {
      float rad = mix(0.13, 0.34, v.y);                  // セルごとの半径
      float on = smoothstep(0.18, 0.34, v.y);            // 小さすぎるセルは平地のまま
      float d = v.x / max(rad, 0.02);
      float rim = smoothstep(0.78, 1.0, d) * (1.0 - smoothstep(1.0, 1.35, d));
      float bowl = 1.0 - smoothstep(0.0, 0.85, d);
      return on * (0.95 * rim - 1.15 * bowl);
    }

    void main() {
      vec3 d = normalize(vD);

      if (uSky > 0.5) {
        // ---- 大気 (地球のみ)。色は天体のエアライトと共有 (skyDayColor) ----
        vec3 night = vec3(0.0036, 0.0045, 0.0082);   // 画面上の (0.015, 0.02, 0.045)
        gl_FragColor = vec4(tonemap(night * (1.0 - uDay) + skyDayColor(d, uSun, uDay)), 1.0);
        return;
      }

      // ---- 地面。視線を観測者の目線高さの地平面へ投影して遠近感を出す ----
      float dy = max(-d.y, 0.0007);
      float r = 1.7 / dy;                       // 交点までの水平距離 [m 相当]
      vec2 g = d.xz * r;                        // 地面座標
      float fade = 1.0 / (1.0 + r * 0.004);     // 遠いほど細部を潰す (エイリアス防止)

      vec3 col;
      if (uMoon > 0.5) {
        // 月面: レゴリスの粒状感 + 大小のクレーター
        float base = fbm(g * 0.13);
        float grain = fbm(g * 2.2) * fade;
        // 大小2層のクレーター (直径 約8m / 約2m。立った視点で形が分かるスケール)。
        // 遠方ほど fade で弱め、地平線付近のちらつき (エイリアス) を抑える
        float k1 = crater(vor(g * 0.12), uSun.y) * min(1.0, fade * 2.2);
        float k2 = crater(vor(g * 0.5), uSun.y) * fade;
        // 太陽が低いほどクレーターの陰影が強く出る (実際の月面写真と同じ)
        float relief = mix(1.5, 0.75, smoothstep(0.0, 0.5, uSun.y));
        float sh = 0.62 + 0.15 * base + 0.18 * grain + (0.30 * k1 + 0.16 * k2) * relief;
        col = srgbToLinear(vec3(0.56, 0.545, 0.52)) * clamp(sh, 0.04, 1.5);
        // 大気が無いので影は漆黒、日向はコントラストが強い
        float lit = smoothstep(-0.03, 0.06, uSun.y) * uOcc;
        col *= mix(0.04, 1.0, lit);
        col += vec3(0.0061, 0.0090, 0.0152) * (1.0 - lit);   // 地球照のうっすらした青み
      } else {

        float base = fbm(g * 0.05);
        float patch = fbm(g * 0.22 + 13.0);
        float grain = fbm(g * 1.1) * fade;
        vec3 soil = srgbToLinear(vec3(0.20, 0.17, 0.13));
        vec3 gras = srgbToLinear(vec3(0.13, 0.19, 0.11));
        col = mix(soil, gras, smoothstep(0.35, 0.65, patch));
        col *= 0.72 + 0.34 * base + 0.20 * grain;
        col *= mix(0.12, 1.0, uDay);                       // 夜は暗く、昼は明るく
        col = mix(col, col * vec3(1.25, 0.95, 0.78), (1.0 - smoothstep(0.0, 0.3, uSun.y)) * uDay * 0.7);

                        vec3(0.0974, 0.1167, 0.1602),    //           (0.42, 0.47, 0.56)
                        uDay);
        col = mix(col, haze, 1.0 - smoothstep(0.0, 0.030, dy));

    }`;

  const pointVS = `
    attribute vec3 aPos;
    attribute float aSize;
    attribute vec3 aCol;
    uniform mat4 uVP;
    uniform float uScale;
    varying vec3 vCol;
    void main() {

    varying vec3 vCol;
    uniform float uAlpha;
    void main() {

  const billVS = `
    attribute vec2 aCorner;
    uniform mat4 uVP;
    uniform vec3 uCenter, uRight, uUp;
    uniform float uSize;
    varying vec2 vUv;
    void main() {
      vUv = aCorner;
      vec3 w = uCenter + (uRight * aCorner.x + uUp * aCorner.y) * uSize;
      gl_Position = uVP * vec4(w, 1.0);
    }`;

    // 太陽のコロナとグレア (カメラ正対の板、加算合成)。
    // uFall は中心からの落ち方。小さいほど裾が広く残る — コロナは 2.4 で
    // 太陽に貼りつき、グレアの裾は 1 前後にして画面の広い範囲まで届かせる
    varying vec2 vUv;
    uniform vec3 uCol1, uCol2;
    uniform float uFall;

      vec3 c = mix(uCol1, uCol2, a);
      gl_FragColor = vec4(c * a * 0.9, 0.0);

  // ---- 彗星の尾 (曲率を持つカメラ正対リボン, 加算) ----
  const tailVS = `
    attribute vec2 aCorner;
    uniform mat4 uVP;
    uniform vec3 uHead, uAxis, uCurve, uSide;
    uniform vec2 uDim;                  // x: 長さ  y: 半幅
    varying vec2 vUv;
    void main() {
      float x = aCorner.x * 0.5 + 0.5;
      float flow = x;

    varying vec2 vUv;
    uniform vec3 uCol1, uCol2;
    uniform float uAlpha, uKind, uTime, uSeed;
    float hash(float n) {
      return fract(sin(n) * 43758.5453123);

      return mix(hash(i), hash(i + 1.0), f);

      float x = vUv.x, y = vUv.y;

  // ---- 流星の光跡 (放射点から流れる細いリボン, 加算) ----
  const meteorVS = `

    attribute vec3 aCol;
    attribute float aY;          // 光跡の断面座標 (-1..1)
    uniform mat4 uVP;

    attribute vec2 aCorner;
    uniform mat4 uVP;
    uniform vec3 uHead, uAxis, uSide;

  // ---- 土星の環 ----
  const ringVS = `
    attribute vec3 aPos;
    attribute float aR;

    varying vec3 vW;

    varying float vR;      // 土星の平均半径を 1 とした環上の半径
    varying vec3 vW;
    uniform vec3 uAxis;    // 環面の法線 (= 土星の極方向)
    uniform vec3 uSun;     // 太陽の位置
    uniform vec3 uCam;     // カメラの位置
    uniform vec3 uCenter;  // 土星の中心
    uniform vec2 uRadii;   // 土星の赤道半径・極半径 (ワールド単位)
    uniform vec2 uRingR;   // プロファイルの参照範囲 (内径, 1/(外径-内径))

    void main() {

      vec4 prof = texture2D(uProfile, vec2((vR - uRingR.x) * uRingR.y, 0.5));
      float tau = -log(max(prof.a, 0.0015));      // 透過率 → 光学的厚さ
      if (tau < 0.004) discard;                   // 間隙は完全に素通し

      vec3 L = normalize(uSun - vW);
      vec3 V = normalize(uCam - vW);
      float ca = dot(uAxis, L), cv = dot(uAxis, V);
      float mu0 = max(abs(ca), 0.02);             // 太陽と環面のなす角
      float mu = max(abs(cv), 0.02);              // 視線と環面のなす角

      // ---- 土星本体が環へ落とす影 ----
      // 環の点から太陽へ伸ばした線が回転楕円体と交わるかを解く。極方向と
      // 赤道方向をそれぞれの半径で割ると単位球になるので、あとは球との交差判定
      float shadow = 1.0;
      {
        vec3 o = vW - uCenter;
        float oa = dot(o, uAxis), da = dot(L, uAxis);
        vec3 O = (o - uAxis * oa) / uRadii.x + uAxis * (oa / uRadii.y);
        vec3 D = (L - uAxis * da) / uRadii.x + uAxis * (da / uRadii.y);
        float b = dot(O, D);
        if (b < 0.0) {                            // 太陽の方へ近づいていく場合だけ
          float miss = dot(O, O) - b * b / dot(D, D);   // 最接近距離² (球の半径 = 1)
          // 実際はほぼ真っ黒になるが、それだと環の構造が読めなくなる。
          // 影と分かる程度に落として、3割の明るさを残す (見やすさを優先)
          shadow = mix(0.30, 1.0, smoothstep(0.90, 1.10, miss));
        }
      }

      // ---- 単散乱 ----
      // 明るい側から見ているか、影の側から透かして見ているかで式が変わる。
      // 透かすと濃いB環が暗く、薄いC環やカッシーニの間隙が明るくなる
      // (実際の逆光の写真と同じ反転が起きる)
      float I;
      if (ca * cv > 0.0) {
        I = mu0 / (mu + mu0) * (1.0 - exp(-tau * (1.0 / mu + 1.0 / mu0)));
      } else {
        float dm = mu0 - mu;
        I = abs(dm) < 0.002
          ? (tau / mu) * exp(-tau / mu)
          : mu0 / dm * (exp(-tau / mu0) - exp(-tau / mu));
      }
      I = max(I, 0.0) * shadow;

      float alpha = 1.0 - exp(-tau / mu);         // 背景をどれだけ隠すか
      // 影の中でも真っ黒にはならない (土星本体からの照り返し)。
      // プロファイルの色だけ sRGB なのでリニアへ戻す (a の透過率はリニア値)
      vec3 c = srgbToLinear(prof.rgb) * (I * 1.3 + 0.010 * alpha);
      gl_FragColor = vec4(tonemap(c), alpha);
    }
`;

  // ---- 探査機のメッシュ (法線は持たず面の微分から求めるので拡張が要る) ----
  const meshVS = `
    attribute vec3 aPos;
    uniform mat4 uMVP, uModel;
    varying vec3 vW;
    varying vec3 vL;
    void main() {
      vW = (uModel * vec4(aPos, 1.0)).xyz;
      vL = aPos;
      gl_Position = uMVP * vec4(aPos, 1.0);
    }
`;
  const meshFS = EXT_DERIV
    + PRE + `
    varying vec3 vW;
    varying vec3 vL;
    uniform vec3 uSun, uCol;
    // 機体の塗り分け。モデル座標を uAxis に射影した値で3色に分ける
    // (皿・機体・その他)。テクスチャも頂点色も持たないモデルなので、
    // 部位の色はこの区切りだけで与える
    uniform vec3 uAxis, uC1, uC2;
    uniform vec2 uCut;
    uniform float uFlat;   // 1 = 面の微分で法線を出せる (拡張が使える)
    void main() {
      // 法線は頂点に持たせず、面の微分から求める。機械物は面ごとの平坦
      // シェーディングの方が形が読め、データも小さくなる
      vec3 n = uFlat > 0.5
        ? normalize(cross(dFdx(vW), dFdy(vW)))
        : vec3(0.0, 0.0, 1.0);
      vec3 l = normalize(uSun - vW);
      // 裏返っても暗くならないよう、法線の向きは絶対値で扱う
      float d = uFlat > 0.5 ? abs(dot(n, l)) : 1.0;
      float t = dot(vL, uAxis);
      float hi = smoothstep(uCut.y - 0.02, uCut.y + 0.02, t);
      vec3 mat = mix(uCol, uC1, smoothstep(uCut.x - 0.02, uCut.x + 0.02, t));
      mat = mix(mat, uC2, hi);
      // 皿より下で軸から離れたところ (ブームの先の機器・電源) は暗い側へ寄せる。
      // ここを金色のままにすると、機体が金一色に見えてしまう
      mat = mix(mat, uCol, smoothstep(0.26, 0.34, length(vL - uAxis * t)) * (1.0 - hi));
      gl_FragColor = vec4(tonemap(srgbToLinear(mat) * (0.28 + 0.85 * d)), 1.0);
    }
`;

  // ---- ポストエフェクト (Bloom)。画面全体を覆う三角形へ描く ----
  const postVS = `
    // 画面全体を覆う三角形1枚 (2枚の四角より速く、継ぎ目も出ない)。
    // はみ出した部分はラスタライザが切るので、実際に塗られるのは画面内だけ
    attribute vec2 aPos;
    varying vec2 vUv;
    void main() {
      vUv = aPos * 0.5 + 0.5;
      gl_Position = vec4(aPos, 0.0, 1.0);
    }
`;
  const threshFS = PRE + `
    // 明るいところだけを抜き出しながら 1/4 に縮小する。
    // 4点をまとめて取るのは、縮小でこぼれた明点がちらつかないようにするため
    varying vec2 vUv;
    uniform sampler2D uTex;
    uniform vec2 uTexel;     // 元画像の 1テクセル
    uniform float uThresh;   // これ以下の明るさは光らせない

    void main() {
      vec3 c = texture2D(uTex, vUv + uTexel * vec2(-1.0, -1.0)).rgb
             + texture2D(uTex, vUv + uTexel * vec2( 1.0, -1.0)).rgb
             + texture2D(uTex, vUv + uTexel * vec2(-1.0,  1.0)).rgb
             + texture2D(uTex, vUv + uTexel * vec2( 1.0,  1.0)).rgb;
      c *= 0.25;
      // 明るさは最大成分で見る。輝度で見ると、青い大気の縁のように
      // 「特定の色だけが強い」ところを取りこぼす
      float l = max(max(c.r, c.g), c.b);
      // しきい値の前後を滑らかに立ち上げる (硬く切ると滲みの縁が階段状になる)
      gl_FragColor = vec4(c * smoothstep(uThresh, min(uThresh + 0.25, 1.0), l), 1.0);
    }
`;
  const blurFS = PRE + `
    // ガウシアンぼかし。横と縦に分けて2回かける。
    // 補間を使って 9タップぶんを 5回の取得で済ませる (係数と位置は既知の組)
    varying vec2 vUv;
    uniform sampler2D uTex;
    uniform vec2 uDir;       // (1/幅, 0) か (0, 1/高さ)

    void main() {
      vec3 c = texture2D(uTex, vUv).rgb * 0.2270270270;
      c += (texture2D(uTex, vUv + uDir * 1.3846153846).rgb
          + texture2D(uTex, vUv - uDir * 1.3846153846).rgb) * 0.3162162162;
      c += (texture2D(uTex, vUv + uDir * 3.2307692308).rgb
          + texture2D(uTex, vUv - uDir * 3.2307692308).rgb) * 0.0702702703;
      gl_FragColor = vec4(c, 1.0);
    }
`;
  const addFS = PRE + `
    // ぼかした光を画面へ加算で戻す。アルファ 0 は、このアプリの合成規約
    // (乗算済みアルファ) で「背景をそのまま残して足すだけ」を意味する
    varying vec2 vUv;
    uniform sampler2D uTex;
    uniform float uAmount;

    void main() {
      gl_FragColor = vec4(texture2D(uTex, vUv).rgb * uAmount, 0.0);
    }
`;

  // 天体用プログラムは変数に持たず、レンダラのクロージャへ閉じ込める。
  // これにより uniform をここ以外から直接触れなくなり、設定漏れが起きない
  let bodyRenderer;
  let lineP, pointP, billP, ringP, tailP, comaP, terrainP, meshP, meteorP, skyP;
  let threshP, blurP, addP;
  try {
    bodyRenderer = createBodyRenderer(program(bodyVS, bodyFS));
    skyP = program(skyVS, skyFS);
    lineP = program(lineVS, lineFS);
    pointP = program(pointVS, pointFS);
    billP = program(billVS, billFS);
    ringP = program(ringVS, ringFS);
    tailP = program(tailVS, tailFS);
    comaP = program(comaVS, comaFS);
    meteorP = program(meteorVS, meteorFS);
    terrainP = program(terrainVS, terrainFS);
    meshP = program(meshVS, meshFS);
    threshP = program(postVS, threshFS);
    blurP = program(postVS, blurFS);
    addP = program(postVS, addFS);
  } catch (err) {
    console.error(err);
    document.getElementById("noGL").style.display = "grid";
    return;
  }

  // ---------- ジオメトリ ----------
  function makeSphere(segs, rings) {
    const pos = [], idx = [];
    for (let y = 0; y <= rings; y++) {
      const th = y / rings * Math.PI;
      for (let x = 0; x <= segs; x++) {
        const ph = x / segs * 2 * Math.PI;
        pos.push(Math.sin(th) * Math.cos(ph), Math.cos(th), Math.sin(th) * Math.sin(ph));
      }
    }
    for (let y = 0; y < rings; y++) for (let x = 0; x < segs; x++) {
      const a = y * (segs + 1) + x, b = a + segs + 1;
      idx.push(a, b, a + 1, a + 1, b, b + 1);
    }
    return { pos: new Float32Array(pos), idx: new Uint16Array(idx) };
  }
  // 弦と弧のずれは (半角)² で効くので、56分割でも半径の 0.16%。惑星が
  // 画面いっぱいでも 1080p なら 0.6px で見えない。4K で画面いっぱいにすると
  // 1.7px になるので、そこだけ余裕を持たせて 96分割にしてある
  const sphere = makeSphere(96, 60);
  const sphereVB = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, sphereVB);
  gl.bufferData(gl.ARRAY_BUFFER, sphere.pos, gl.STATIC_DRAW);
  const sphereIB = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, sphereIB);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, sphere.idx, gl.STATIC_DRAW);

  // 環 (単位半径の平円環, aR = 半径)。内外径は実測 (C環の内側 〜 F環の外側) を
  // 土星の平均半径で割ったもの。半径ごとの濃さと色は RING_KNOTS から焼いた
  // 1次元テクスチャで引く
  const RING_SEG = 160;
  const RING_RM = PLANETS.find((p) => p.key === "saturn").rkm;
  const RING_IN = RING_R0 / RING_RM, RING_OUT = RING_R1 / RING_RM;
  {
    var ringData = new Float32Array((RING_SEG + 1) * 2 * 4);
    let o = 0;
    for (let s = 0; s <= RING_SEG; s++) {
      const a = s / RING_SEG * 2 * Math.PI, c = Math.cos(a), sn = Math.sin(a);
      ringData[o++] = c * RING_IN; ringData[o++] = 0; ringData[o++] = sn * RING_IN; ringData[o++] = RING_IN;
      ringData[o++] = c * RING_OUT; ringData[o++] = 0; ringData[o++] = sn * RING_OUT; ringData[o++] = RING_OUT;
    }
  }
  const ringVB = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, ringVB);
  gl.bufferData(gl.ARRAY_BUFFER, ringData, gl.STATIC_DRAW);

  // ビルボード四隅
  const billVB = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, billVB);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

  // 彗星の尾は根元の開きと湾曲を滑らかにするため、長さ方向を細分化する
  const TAIL_SEG = 96, TAIL_VERTS = (TAIL_SEG + 1) * 2;
  const tailData = new Float32Array(TAIL_VERTS * 2);
  for (let i = 0, o = 0; i <= TAIL_SEG; i++) {
    const x = i / TAIL_SEG * 2 - 1;
    tailData[o++] = x; tailData[o++] = -1;
    tailData[o++] = x; tailData[o++] = 1;
  }
  const tailVB = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, tailVB);
  gl.bufferData(gl.ARRAY_BUFFER, tailData, gl.STATIC_DRAW);

  //#region src/data/textures.js
  // ---------- 天体テクスチャ (パブリックドメインの実全球マップ) ----------
  //   出典: 水星 MESSENGER (USGS) / 金星 Magellan レーダー地形 (NASA) / 地球 Blue Marble (NASA) /
  //         月 LRO (NASA SVS) / 火星 Viking (USGS) / 木星 Cassini PIA07782 (NASA/JPL) /
  //         イオ・ガニメデ Voyager + Galileo SSI 合成 (USGS) /
  //         エウロパ・カリスト 同 (USGS。輝度のみの製品なので色は天体色を掛けた) /
  //         冥王星 New Horizons (NASA) / ケレス・ベスタ Dawn (NASA/JPL)
  //   土星・天王星・海王星・パラス・ジュノーは実測の全球マップが存在しないためプロシージャル描画
  //
  //   画像は index.html と同じ場所の tex/ に置く外部ファイル。data URI で埋め込むと
  //   (1) HTML を1文字直すたびに画像ぜんぶを再ダウンロードさせることになり、
  //   (2) base64 のぶん 4/3 に膨らんだうえ HTML の解析完了まで描画が始まらない。
  //   解像度を上げるほど不利になるので分離した。読み込みに失敗した天体は
  //   仮色のまま描かれる (src/gl/resources.js)
  const TEX_DIR = "tex/";
  const TEXTURES = {
    mercury: "mercury.jpg",
    venus:   "venus.jpg",
    earth:   "earth.jpg",
    moon:    "moon.jpg",
    mars:    "mars.jpg",
    jupiter: "jupiter.jpg",
    io:      "io.jpg",
    europa:   "europa.jpg",
    ganymede: "ganymede.jpg",
    callisto: "callisto.jpg",
    pluto:   "pluto.jpg",
    ceres:   "ceres.jpg",
    vesta:   "vesta.jpg",
  };
  // 輝度だけの製品しか無く、色は天体色 (colA) を掛けて与えたもの。
  // クレジットに「色は再現」と添えるために持つ
  const MONO_TEX = new Set(["europa", "callisto"]);
  // 地表以外に地球だけが持つ2枚。天体のキーではないので TEXTURES とは分ける
  //   雲   Blue Marble: Clouds (NASA Earth Observatory) — 被覆率としてグレースケールで持つ
  //   夜景 Black Marble 2016 (NASA Earth Observatory) — 下地の海陸を落として街灯りだけ残した
  //   天の川 Deep Star Maps 2020 の拡散光版 (NASA/Goddard SVS) — 明るい恒星を
  //        抜いた拡散光だけの全天マップ。赤道座標の正距円筒
  const TEXTURES_EXTRA = {
    cloud: "earth-clouds.jpg",
    night: "earth-night.jpg",
    milkyway: "milkyway.jpg",
  };
  // 実測の標高から起こした接空間の法線図。アルベド図は一定の照明で正規化されて
  // いて起伏が焼き込まれているため、これが無いと太陽が動いても陰影が変わらない。
  //   月   LOLA (NASA SVS) / 火星 MOLA (PDS) / 水星 MESSENGER DEM (USGS)
  // 起伏は実寸の 3倍で焼いてある (8bit に収めるため。強さは uNrmAmt で調整)
  const NORMALS = {
    moon:    "moon-nrm.jpg",
    mars:    "mars-nrm.jpg",
    mercury: "mercury-nrm.jpg",
  };
  // 解像度は2組を同名で持つ。2K が tex/ 直下、4K が tex/4k/。
  //
  // 既定は端末によらず 2K。4K は 1枚あたり 4096×2048×4バイト×1.33 (ミップ込み) =
  // 約 45MB で、常駐する 14枚ぶんでは 625MB になる。通る端末でも初回の転送量が
  // 数倍になるので、選んだ人にだけ渡す。
  //
  // 端末で出し分けていた時期もあったが、PC でも GPU は千差万別で、
  // 「既定で有効 → 最初の読み込みで落ちる → メニューに辿り着けないので直せない」
  // という詰み方をする。既定を軽い側に倒しておけば、その袋小路が無くなる
  let texHiRes = (() => {
    try { return localStorage.getItem("ssHiRes") === "1"; }
    catch (e) { return false; }          // プライベートモード等
  })();

  // (月・火星・水星) の地表テクスチャが法線図に化ける
  const texURL = (key) => {
    if (key.indexOf("nrm:") === 0) return TEX_DIR + (texHiRes ? "4k/" : "") + NORMALS[key.slice(4)];
    return TEX_DIR + (texHiRes ? "4k/" : "") + (TEXTURES[key] || TEXTURES_EXTRA[key]);
  };

  const texByKey = new Map();
  const noTex = gl.createTexture();

  // 満たさない画像は従来どおり LINEAR のまま扱う (REPEAT も使えないので本来 NG)。
