        let sumx = 0, sumy = 0, cnt = 0;
        const v = c.verts;   // ワールド単位方向 [wx,wy,wz]×頂点
        for (let i = 0; i + 2 < v.length; i += 3) {
          const wx = v[i], wy = v[i+1], wz = v[i+2];
          const up = wx*obsU[0]+wy*obsU[1]+wz*obsU[2];
          if (up < 0.03) continue;
          const east = wx*obsE[0]+wy*obsE[1]+wz*obsE[2], north = wx*obsN[0]+wy*obsN[1]+wz*obsN[2];
          const s = projGround([east * SKYR, up * SKYR, -north * SKYR]);
          if (!s || s.x < 0 || s.x > W || s.y < 0 || s.y > H) continue;
          sumx += s.x; sumy += s.y; cnt++;
        }
        if (cnt >= 2) octx.fillText(lang === "ja" ? c.ja : c.en, sumx / cnt, sumy / cnt);
      }
      // 黄道ラベル: 画面中央に最も近い可視点に1つ
      const ER = 1895;
      let bx = 0, by = 0, bd = Infinity;
      for (let i = 0; i + 2 < ECL_WORLD.length; i += 3) {
        const wx = ECL_WORLD[i]/ER, wy = ECL_WORLD[i+1]/ER, wz = ECL_WORLD[i+2]/ER;
        const up = wx*obsU[0]+wy*obsU[1]+wz*obsU[2];
        if (up < 0.03) continue;
        const east = wx*obsE[0]+wy*obsE[1]+wz*obsE[2], north = wx*obsN[0]+wy*obsN[1]+wz*obsN[2];
        const s = projGround([east * SKYR, up * SKYR, -north * SKYR]);
        if (!s || s.x < 0 || s.x > W || s.y < 0 || s.y > H) continue;
        const d = (s.x - W / 2) ** 2 + (s.y - H / 2) ** 2;
        if (d < bd) { bd = d; bx = s.x; by = s.y; }
      }
      if (bd < Infinity) {
        octx.fillStyle = "rgba(226,178,110," + (0.75 * starVis).toFixed(3) + ")";
        octx.fillText(lang === "ja" ? "黄道" : "Ecliptic", bx, by - 6);
      }
    }
    drawRadiants();   // 放射点 (降っている流星群があるときだけ)
    octx.font = '11px "Avenir Next","Hiragino Sans",sans-serif';
    // 名前は天体リストの「名前」に従う (宇宙ビューと同じ)。名前を消すと選択天体の
    // 目印が無くなってしまうので、選択マークは名前とは別に出す
    const marked = showSelMark ? selected : null;
    const spotB = tourSpot ? BODY_BY_KEY.get(tourSpot) : null;
    for (const v of groundVis) {
      const s = projGround([v.px, v.py, v.pz]);
      if (!s || s.x < -30 || s.x > W + 30) continue;
      const hit = marked === v.b || spotB === v.b;
      // 円盤が画面を覆うほど近い天体 (月面から見た地球など) にリングは要らない
      if (hit && v.rpx < H * 0.3) {
        octx.beginPath();
        octx.arc(s.x, s.y, Math.max(v.rpx, 3) + 6, 0, 2 * Math.PI);
        octx.strokeStyle = "rgba(242,178,62,0.9)";

      if (!v.b.showLabel) continue;
      octx.fillStyle = hit ? "rgba(242,178,62,0.95)" : "rgba(201,213,234,0.82)";
      octx.fillText(bName(v.b), s.x, s.y - Math.max(v.rpx, 3) - 8);

  const moonMapCv = document.getElementById("moonMap");
  const MOON_MAP_CSS = 150;
  let moonDisc = null;                 // 生成済みディスク (使い回す)
  function buildMoonDisc(img) {
    const sw = img.naturalWidth, sh = img.naturalHeight;
    if (!sw || !sh) return;
    const src = document.createElement("canvas");
    src.width = sw; src.height = sh;
    src.getContext("2d").drawImage(img, 0, 0);
    let sd;
    try { sd = src.getContext("2d").getImageData(0, 0, sw, sh).data; }
    catch (e) { return; }              // 取得できない環境ではマップ無しで続行
    const N = 300;
    const out = document.createElement("canvas");
    out.width = N; out.height = N;
    const oc = out.getContext("2d");
    const id = oc.createImageData(N, N), d = id.data;
    for (let py = 0; py < N; py++) {
      const ny = 1 - (py + 0.5) / N * 2;
      for (let px = 0; px < N; px++) {
        const nx = (px + 0.5) / N * 2 - 1;
        const r2 = nx * nx + ny * ny, o = (py * N + px) * 4;
        if (r2 > 1) { d[o + 3] = 0; continue; }
        const z = Math.sqrt(1 - r2);                       // 手前向き成分
        const lat = Math.asin(Math.max(-1, Math.min(1, ny)));
        const lon = Math.atan2(nx, z);                     // 東経が右
        const u = (lon / DEG + 180) / 360, v = (90 - lat / DEG) / 180;
        const sx = Math.min(sw - 1, Math.max(0, Math.round(u * sw)));
        const sy = Math.min(sh - 1, Math.max(0, Math.round(v * sh)));
        const so = (sy * sw + sx) * 4;
        const k = 0.5 + 0.5 * z;                           // 縁を暗くして球らしく
        d[o] = sd[so] * k; d[o + 1] = sd[so + 1] * k; d[o + 2] = sd[so + 2] * k; d[o + 3] = 255;

    // 軌道線アンカー: カメラが離れすぎると頂点の f32 誤差が画面に出るため焼き直す
    {
      const dx = eye[0] - ORB_ANCHOR[0], dy = eye[1] - ORB_ANCHOR[1], dz = eye[2] - ORB_ANCHOR[2];
      const lim = cam.dist * 1000;
      if (dx * dx + dy * dy + dz * dz > lim * lim) {
        rebuildOrbits(fx, fy, fz);
      }
    }

    skyDayF = 0;   // 宇宙ビューに明るい空は無い (Bloom のしきい値を戻す)
    gl.clearColor(0.016, 0.023, 0.055, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.disable(gl.BLEND);

    // --- 天の川 (いちばん奥。深度は見ないし書かない) ---
    gl.depthMask(false);
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    drawMilkyWay(VP, mwEqSpace(), MW_R, MW_SPACE_BRIGHT);
    gl.enable(gl.DEPTH_TEST);

    // --- 星空 (カメラ位置中心, 深度書き込みなし) ---
    gl.useProgram(pointP.pr);
    // 星空はカメラ中心の球 = カメラ相対座標そのもの
    gl.uniformMatrix4fv(pointP.u.uVP, false, VP);
    gl.uniform1f(pointP.u.uScale, DPR);
    gl.uniform1f(pointP.u.uAlpha, 1);
    gl.bindBuffer(gl.ARRAY_BUFFER, starVB);
    gl.enableVertexAttribArray(pointP.a.aPos);
    gl.enableVertexAttribArray(pointP.a.aSize);
    gl.enableVertexAttribArray(pointP.a.aCol);
    gl.vertexAttribPointer(pointP.a.aPos, 3, gl.FLOAT, false, 28, 0);
    gl.vertexAttribPointer(pointP.a.aSize, 1, gl.FLOAT, false, 28, 12);
    gl.vertexAttribPointer(pointP.a.aCol, 3, gl.FLOAT, false, 28, 16);
    gl.drawArrays(gl.POINTS, 0, N_STAR);

    // --- 星座線 + 黄道 (背景の天球上。恒星と同じ固定ワールド座標) ---
    if (showConst && constN) {
      gl.useProgram(lineP.pr);
      gl.uniformMatrix4fv(lineP.u.uVP, false, VP);
      gl.enableVertexAttribArray(lineP.a.aPos);
      gl.uniform4f(lineP.u.uColor, 0.17, 0.23, 0.36, 0.5);
      gl.bindBuffer(gl.ARRAY_BUFFER, constVB);
      gl.vertexAttribPointer(lineP.a.aPos, 3, gl.FLOAT, false, 0, 0);
      gl.drawArrays(gl.LINES, 0, constN);
      // 黄道 (金色の閉ループ)
      gl.uniform4f(lineP.u.uColor, 0.42, 0.33, 0.13, 0.6);
      gl.bindBuffer(gl.ARRAY_BUFFER, eclVB);
      gl.vertexAttribPointer(lineP.a.aPos, 3, gl.FLOAT, false, 0, 0);
      gl.drawArrays(gl.LINE_LOOP, 0, ECL_N);
    }

    // --- 天球の経緯線 (赤道座標。星座線とは別の切替) ---
    if (showGrid && gridN) {
      gl.useProgram(lineP.pr);
      gl.uniformMatrix4fv(lineP.u.uVP, false, VP);
      gl.enableVertexAttribArray(lineP.a.aPos);
      gl.uniform4f(lineP.u.uColor, 0.10, 0.19, 0.21, 0.42);
      gl.bindBuffer(gl.ARRAY_BUFFER, gridVB);
      gl.vertexAttribPointer(lineP.a.aPos, 3, gl.FLOAT, false, 0, 0);
      gl.drawArrays(gl.LINES, 0, gridN);
    }

    // --- 軌道線 (天体ごとの表示フラグ) ---
    {
      gl.useProgram(lineP.pr);
      // 中心天体は現在位置 ± 粗い8分割ぶんを高精細パッチで引き直すため、
      // 粗い折れ線側はその区間をスキップする (二重線防止)。解除後も lastCenter を
      // 対象にして、離心軌道 (ハレー彗星等) で天体が軌道からずれないようにする。
      const centerB = selected || lastCenter;
      const selP = centerB && !centerB.parent && centerB !== SUN && centerB.showOrbit ? centerB : null;
      let selI0 = 0, selI1 = 0;
      if (selP) {
        const idx = keplerE(selP, simDays) / (2 * Math.PI / selP.orbN);
        selI0 = Math.floor(idx) - 8;
        selI1 = Math.ceil(idx) + 8;
      }
      // アンカー相対の頂点 → カメラ相対へ (平行移動は f64 で計算してから f32 行列に)
      SCR.t[0] = ORB_ANCHOR[0] - eye[0];
      SCR.t[1] = ORB_ANCHOR[1] - eye[1];
      SCR.t[2] = ORB_ANCHOR[2] - eye[2];
      mTRS(SCR.t, null, 1, SCR.A);
      gl.uniformMatrix4fv(lineP.u.uVP, false, mMul(VP, SCR.A, SCR.mvp));
      PLANETS.forEach((p, pi) => {
        if (!p.showOrbit) return;
        const sel = selected === p;
        gl.uniform4f(lineP.u.uColor, sel ? 0.95 : 0.42, sel ? 0.70 : 0.50, sel ? 0.24 : 0.63, sel ? 0.55 : 0.16);
        gl.bindBuffer(gl.ARRAY_BUFFER, orbitVBs[pi]);
        gl.enableVertexAttribArray(lineP.a.aPos);
        gl.vertexAttribPointer(lineP.a.aPos, 3, gl.FLOAT, false, 0, 0);
        if (p !== selP) {
          gl.drawArrays(gl.LINE_STRIP, 0, p.orbN + 1);
        } else if (selI0 >= 0 && selI1 <= p.orbN) {
          gl.drawArrays(gl.LINE_STRIP, 0, selI0 + 1);
          gl.drawArrays(gl.LINE_STRIP, selI1, p.orbN - selI1 + 1);
        } else if (selI0 < 0) {
          gl.drawArrays(gl.LINE_STRIP, selI1, selI0 + p.orbN - selI1 + 1);
        } else {
          gl.drawArrays(gl.LINE_STRIP, selI1 - p.orbN, selI0 - (selI1 - p.orbN) + 1);
        }
      });
      // 高精細パッチ (f64 でカメラ相対に計算するため接近しても正確)
      if (selP) {
        const dE = 2 * Math.PI / selP.orbN;
        const m = selP.m, be = selP.a * Math.sqrt(1 - selP.e * selP.e);
        const v = SCR.v, w = SCR.v2;
        for (let i = 0; i <= PATCH_N; i++) {
          const E = (selI0 + (selI1 - selI0) * i / PATCH_N) * dE;
          const xo = selP.a * (Math.cos(E) - selP.e);
          const yo = be * Math.sin(E);
          v[0] = m[0] * xo + m[1] * yo;
          v[1] = m[2] * xo + m[3] * yo;
          v[2] = m[4] * xo + m[5] * yo;
          toWorld(v, w);
          patchArr[i*3] = w[0] - eye[0]; patchArr[i*3+1] = w[1] - eye[1]; patchArr[i*3+2] = w[2] - eye[2];
        }
        gl.uniformMatrix4fv(lineP.u.uVP, false, VP);
        // パッチの色は粗い折れ線と合わせる (選択中は明るく、解除後は淡く)
        const pb = selected === selP;
        gl.uniform4f(lineP.u.uColor, pb ? 0.95 : 0.42, pb ? 0.70 : 0.50, pb ? 0.24 : 0.63, pb ? 0.55 : 0.16);
        gl.bindBuffer(gl.ARRAY_BUFFER, patchVB);
        gl.bufferData(gl.ARRAY_BUFFER, patchArr, gl.DYNAMIC_DRAW);
        gl.enableVertexAttribArray(lineP.a.aPos);
        gl.vertexAttribPointer(lineP.a.aPos, 3, gl.FLOAT, false, 0, 0);
        gl.drawArrays(gl.LINE_STRIP, 0, PATCH_N + 1);
      }
      // 衛星の軌道 (母天体に追従)
      gl.enableVertexAttribArray(lineP.a.aPos);
      for (const s of SATELLITES) {
        if (!s.showOrbit) continue;
        const par = posW.get(s.parent);
        const sel = selected === s;
        gl.uniform4f(lineP.u.uColor, sel ? 0.95 : 0.42, sel ? 0.70 : 0.50, sel ? 0.24 : 0.63, sel ? 0.55 : 0.16);
        if (s === MOON) {
          // ELP 理論で現在時刻±半周期をサンプリング (実位置と一致する軌道線)
          const tmp = SCR.v2, T = 27.321661;
          for (let i = 0; i <= MOON_ORB_N; i++) {
            moonGeoEclKm(simDays + (i / MOON_ORB_N - 0.5) * T, tmp);
            moonOrbBuf[i*3] = tmp[0] * KM2W; moonOrbBuf[i*3+1] = tmp[2] * KM2W; moonOrbBuf[i*3+2] = -tmp[1] * KM2W;
          }
          if (!moonOrbVB) moonOrbVB = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, moonOrbVB);
          gl.bufferData(gl.ARRAY_BUFFER, moonOrbBuf, gl.DYNAMIC_DRAW);
          SCR.t[0] = par[0] - eye[0]; SCR.t[1] = par[1] - eye[1]; SCR.t[2] = par[2] - eye[2];
          mTRS(SCR.t, null, 1, SCR.model);
          gl.uniformMatrix4fv(lineP.u.uVP, false, mMul(VP, SCR.model, SCR.mvp));
          gl.vertexAttribPointer(lineP.a.aPos, 3, gl.FLOAT, false, 0, 0);
          gl.drawArrays(gl.LINE_STRIP, 0, MOON_ORB_N + 1);
        } else {
          gl.bindBuffer(gl.ARRAY_BUFFER, satOrbVB);
          SCR.t[0] = par[0] - eye[0]; SCR.t[1] = par[1] - eye[1]; SCR.t[2] = par[2] - eye[2];
          mTRS(SCR.t, s.M, s.aKm * KM2W, SCR.model);
          gl.uniformMatrix4fv(lineP.u.uVP, false, mMul(VP, SCR.model, SCR.mvp));
          gl.vertexAttribPointer(lineP.a.aPos, 3, gl.FLOAT, false, 0, 0);
          gl.drawArrays(gl.LINE_STRIP, 0, SAT_ORB_N + 1);
        }
      }
    }

    // --- 小惑星帯 ---
    {
      for (let i = 0; i < N_AST; i++) {
        const A = asts[i];
        const th = A.th + 2 * Math.PI * simDays / A.T;
        const r = mapRadius(A.a);
        const x = r * Math.cos(th), z = -r * Math.sin(th);
        const y = r * Math.sin(A.inc) * Math.sin(th + A.node);
        const o = i * 7;
        // カメラ相対 (毎フレーム f64 で再計算しているので引き算はここで済ませる)
        astArr[o] = x - eye[0]; astArr[o+1] = y - eye[1]; astArr[o+2] = z - eye[2];
        astArr[o+3] = 1.4;
        astArr[o+4] = 0.62; astArr[o+5] = 0.65; astArr[o+6] = 0.72;
      }
      gl.useProgram(pointP.pr);
      gl.uniformMatrix4fv(pointP.u.uVP, false, VP);
      gl.uniform1f(pointP.u.uScale, DPR);
      gl.uniform1f(pointP.u.uAlpha, 0.5);
      gl.bindBuffer(gl.ARRAY_BUFFER, astVB);
      gl.bufferData(gl.ARRAY_BUFFER, astArr, gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(pointP.a.aPos);
      gl.enableVertexAttribArray(pointP.a.aSize);
      gl.enableVertexAttribArray(pointP.a.aCol);
      gl.vertexAttribPointer(pointP.a.aPos, 3, gl.FLOAT, false, 28, 0);
      gl.vertexAttribPointer(pointP.a.aSize, 1, gl.FLOAT, false, 28, 12);
      gl.vertexAttribPointer(pointP.a.aCol, 3, gl.FLOAT, false, 28, 16);
      gl.drawArrays(gl.POINTS, 0, N_AST);
    }
    gl.depthMask(true);
    gl.disable(gl.BLEND);

    // --- 天体 ---
    // 座標はカメラ相対なので、カメラは原点・太陽の位置は -eye になる。
    // 光源はワールドの原点にある太陽1つなので全天体で同じ値を渡す
    bodyRenderer.beginPass({ time: nowSec, cameraPosition: ZERO3, depthTest: true, depthWrite: true });
    SCR.sun[0] = -eye[0]; SCR.sun[1] = -eye[1]; SCR.sun[2] = -eye[2];
    drawBody(SUN, SCR.sun);
    for (const p of PLANETS) drawBody(p, SCR.sun);
    for (const s of SATELLITES) drawBody(s, SCR.sun);
    // 大気は加算で重ねるので、本体をすべて描き終えてから最後に足す
    for (const p of PLANETS) if (p.air) drawBodyAtmos(p, SCR.sun);
    bodyRenderer.endPass();

    // --- 探査機の軌跡 ---
    // 頂点は絶対ワールド座標なので、カメラ相対にするため -eye だけ平行移動する
    if (tourPath) {
      gl.useProgram(lineP.pr);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.depthMask(false);
      gl.enableVertexAttribArray(lineP.a.aPos);
      SCR.t[0] = -eye[0]; SCR.t[1] = -eye[1]; SCR.t[2] = -eye[2];
      mTRS(SCR.t, null, 1, SCR.model);
      gl.uniformMatrix4fv(lineP.u.uVP, false, mMul(VP, SCR.model, SCR.mvp));
      for (const pr of PROBES) {
        if (tourProbes && tourProbes.indexOf(pr.key) < 0) continue;
        if (!pr.pathVB) {
          pr.pathVB = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, pr.pathVB);
          gl.bufferData(gl.ARRAY_BUFFER, pr.path, gl.STATIC_DRAW);
        } else {
          gl.bindBuffer(gl.ARRAY_BUFFER, pr.pathVB);
        }
        gl.vertexAttribPointer(lineP.a.aPos, 3, gl.FLOAT, false, 0, 0);
        // 通過済みの区間だけを引く (これから通る先は「まだ無い道」なので描かない)
        const n = pr.pathT.length;
        let i = 0;
        while (i < n - 1 && pr.pathT[i + 1] <= simDays) i++;
        if (i > 0) {
          gl.uniform4f(lineP.u.uColor, 0.95, 0.70, 0.30, 0.90);
          gl.drawArrays(gl.LINE_STRIP, 0, i + 1);
        }
      }
      gl.depthMask(true);
      gl.disable(gl.BLEND);
    }

    // --- 探査機 (NASA のモデル) ---
    // 実寸比だと 3m の機体は常に不可視なので、画面上の見かけの大きさを固定した
    // 記号として描く。位置と日時は正確、大きさだけが実寸比から外れる
    // (探査機視点のステップでは、乗っている機体自体はカメラ位置なので描かない)
    // PROBE_NEAR より遠ざかったら、画面上の大きさを固定するのをやめてワールド
    // サイズ固定に切り替える。引きの画で機体が惑星より大きく描かれるのを防ぐ。
    // 3px を切ったらメッシュはやめ、下のマーカーの節で点として描く
    {
      const mfpx = (H / 2) / Math.tan(eFov() / 2);
      const near = PROBE_NEAR * KM2W;
      let any = false;
      for (const pr of PROBES) {
        pr.px = 0;
        if (!probeVisible(pr) || tourProbeDot) continue;   // dot の回は下の点で描く
        const t = posW.get(pr.key);
        const dx = t[0] - eye[0], dy = t[1] - eye[1], dz = t[2] - eye[2];
        // camZoom を掛けるので見かけの角度が一定になる = 拡大すれば大きく見える
        // 探査機視点で乗っている機体だけ、近づくほど大きく描く (tourRideMag)
        const rideMag = tourRide && pr.key === tourRideOn ? tourRideMag : 1;
        const px = PROBE_PX * camZoom * rideMag *
                   Math.min(1, near / (Math.hypot(dx, dy, dz) || 1));
        if (px < 3) continue;
        pr.px = px;
        any = true;
      }
      if (any) {
        gl.useProgram(meshP.pr);
        gl.enable(gl.DEPTH_TEST);
        gl.depthMask(true);
        gl.disable(gl.BLEND);
        gl.enableVertexAttribArray(meshP.a.aPos);
        gl.uniform1f(meshP.u.uFlat, hasDeriv ? 1 : 0);
        for (const pr of PROBES) {
          if (!pr.px) continue;
          const me = meshByKey.get(pr.mesh);
          if (!me) continue;
          const t = posW.get(pr.key);
          SCR.t[0] = t[0] - eye[0]; SCR.t[1] = t[1] - eye[1]; SCR.t[2] = t[2] - eye[2];
          const d = Math.hypot(SCR.t[0], SCR.t[1], SCR.t[2]) || 1;
          const r = d * pr.px / mfpx;
          mRotY(probeSpin + pr.ph0, SCR.ry);      // ゆっくり回して立体だと分かるように
          mTRS(SCR.t, SCR.ry, r, SCR.model);
          gl.uniformMatrix4fv(meshP.u.uMVP, false, mMul(VP, SCR.model, SCR.mvp));
          gl.uniformMatrix4fv(meshP.u.uModel, false, SCR.model);
          gl.uniform3f(meshP.u.uSun, -eye[0], -eye[1], -eye[2]);
          // 塗り分け (無ければ全体を col 一色)
          const pt = pr.paint;
          gl.uniform3fv(meshP.u.uCol, pt ? pt.c0 : pr.col);
          gl.uniform3fv(meshP.u.uC1, pt ? pt.c1 : pr.col);
          gl.uniform3fv(meshP.u.uC2, pt ? pt.c2 : pr.col);
          gl.uniform3fv(meshP.u.uAxis, pt ? pt.axis : ZERO3);
          gl.uniform2f(meshP.u.uCut, pt ? pt.cut[0] : 9, pt ? pt.cut[1] : 9);
          gl.bindBuffer(gl.ARRAY_BUFFER, me.vb);
          gl.vertexAttribPointer(meshP.a.aPos, 3, gl.FLOAT, false, 0, 0);
          gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, me.ib);
          gl.drawElements(gl.TRIANGLES, me.n, gl.UNSIGNED_SHORT, 0);
        }
      }
    }

    // --- 自転軸 (各天体の軌道表示に連動。深度テストで天体の裏側は隠れる) ---
    if (ALL_BODIES.some((b) => b.showOrbit)) {
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.depthMask(false);
      gl.useProgram(lineP.pr);
      gl.bindBuffer(gl.ARRAY_BUFFER, axisVB);
      gl.enableVertexAttribArray(lineP.a.aPos);
      gl.vertexAttribPointer(lineP.a.aPos, 3, gl.FLOAT, false, 0, 0);
      for (const b of [SUN, ...PLANETS, ...SATELLITES]) {
        if (!b.showOrbit) continue;
        const t = posW.get(b.key);
        SCR.t[0] = t[0] - eye[0]; SCR.t[1] = t[1] - eye[1]; SCR.t[2] = t[2] - eye[2];
        mRotX(-(b.tilt || 0) * DEG, SCR.rx);
        mTRS(SCR.t, SCR.rx, bodyR(b), SCR.model);
        gl.uniformMatrix4fv(lineP.u.uVP, false, mMul(VP, SCR.model, SCR.mvp));
        const sel = selected === b;
        gl.uniform4f(lineP.u.uColor, sel ? 0.95 : 0.55, sel ? 0.70 : 0.65, sel ? 0.24 : 0.85, sel ? 0.6 : 0.35);
        gl.drawArrays(gl.LINES, 0, 2);
      }
      gl.depthMask(true);
      gl.disable(gl.BLEND);
    }


    // --- スクリーン座標 & マーカー ---
    screenPos.clear();
    const fpx = (H / 2) / Math.tan(eFov() / 2);
    let nMark = 0;
    const marked = [SUN, ...PLANETS, ...SATELLITES, ...PROBES.filter(probeVisible)];
    const INSIDE_TEST = [SUN, ...PLANETS, ...SATELLITES];
    for (const b of marked) {
      const pr = project(posW.get(b.key));
      if (!pr) continue;
      // 扁平な天体は赤道がいちばん外側なので、印やリングはそちらに合わせる
      const rpx = bodyR(b) * (b.obl ? b.obl[0] : 1) * fpx / pr.w;
      screenPos.set(b.key, { x: pr.x, y: pr.y, r: rpx, w: pr.w });
    }
    // 天体の中に入った探査機 (最後の突入・着地) は、印も名前も出さない。
    // 球に隠れて機体は見えないのに名前だけが浮いて残るため
    for (const pr of PROBES) {
      const sp = screenPos.get(pr.key);
      if (!sp) continue;
      const w = posW.get(pr.key);
      for (const b of INSIDE_TEST) {
        const c = posW.get(b.key), r = bodyR(b);
        const dx = w[0] - c[0], dy = w[1] - c[1], dz = w[2] - c[2];
        if (dx * dx + dy * dy + dz * dz < r * r) { sp.hidden = true; break; }
      }
    }
    // 手前の大きな天体の円盤に隠れる位置にあるものは、印も名前も出さない
    // (接近して見せる場面で、遠くの惑星の名前が円盤の上に載ってしまうため)
    for (const b of marked) {
      const sp = screenPos.get(b.key);
      if (!sp) continue;
      for (const f of marked) {
        if (f === b) continue;
        const fp = screenPos.get(f.key);
        if (!fp || fp.r < 3 || fp.w >= sp.w) continue;
        if (Math.hypot(sp.x - fp.x, sp.y - fp.y) < fp.r) { sp.hidden = true; break; }
      }
    }
    for (const b of marked) {
      const pr = screenPos.get(b.key);
      if (!pr || pr.hidden) continue;
      const rpx = pr.r;
      if (b.mesh && b.px) continue;   // メッシュで描いた探査機にマーカーは要らない
      if (rpx < 2.2) {
        // 衛星は画面上で母天体と重なっている間はマーカーを出さない
        if (b.parent) {
          const pp = screenPos.get(b.parent);
          if (!pp || Math.hypot(pr.x - pp.x, pr.y - pp.y) < 14) continue;
        }
        const o = nMark * 7;
        const wp = posW.get(b.key);
        const c = b.colA || b.col;      // 探査機は colA を持たない (col が機体色)
        markArr[o] = wp[0] - eye[0]; markArr[o+1] = wp[1] - eye[1]; markArr[o+2] = wp[2] - eye[2];
        markArr[o+3] = b.mesh ? 5.0 : 4.0;
        markArr[o+4] = c[0]; markArr[o+5] = c[1]; markArr[o+6] = c[2];
        nMark++;
      }
    }
    if (nMark) {
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.depthMask(false);
      gl.useProgram(pointP.pr);
      gl.uniformMatrix4fv(pointP.u.uVP, false, VP);
      gl.uniform1f(pointP.u.uScale, DPR);
      gl.uniform1f(pointP.u.uAlpha, 0.95);
      gl.bindBuffer(gl.ARRAY_BUFFER, markVB);
      gl.bufferData(gl.ARRAY_BUFFER, markArr, gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(pointP.a.aPos);
      gl.enableVertexAttribArray(pointP.a.aSize);
      gl.enableVertexAttribArray(pointP.a.aCol);
      gl.vertexAttribPointer(pointP.a.aPos, 3, gl.FLOAT, false, 28, 0);
      gl.vertexAttribPointer(pointP.a.aSize, 1, gl.FLOAT, false, 28, 12);
      gl.vertexAttribPointer(pointP.a.aCol, 3, gl.FLOAT, false, 28, 16);
      gl.drawArrays(gl.POINTS, 0, nMark);
      gl.depthMask(true);
      gl.disable(gl.BLEND);
    }

    // --- 土星の環 ---
    {
      const sat = PLANETS[5];
      const r = bodyR(sat);
      const sp = posW.get(sat.key);
      SCR.t[0] = sp[0] - eye[0]; SCR.t[1] = sp[1] - eye[1]; SCR.t[2] = sp[2] - eye[2];
      const model = mTRS(SCR.t, SAT_ROT, r, SCR.model);   // 実際の極方向で環を配置
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.depthMask(false);
      gl.useProgram(ringP.pr);
      gl.uniformMatrix4fv(ringP.u.uMVP, false, mMul(VP, model, SCR.mvp));
      gl.uniformMatrix4fv(ringP.u.uModel, false, model);
      gl.uniform3f(ringP.u.uAxis, SATURN_POLE_W[0], SATURN_POLE_W[1], SATURN_POLE_W[2]);
      gl.uniform3f(ringP.u.uSun, -eye[0], -eye[1], -eye[2]);
      gl.uniform3f(ringP.u.uCam, 0.0, 0.0, 0.0);            // カメラ相対座標なので原点
      gl.uniform3f(ringP.u.uCenter, SCR.t[0], SCR.t[1], SCR.t[2]);
      gl.uniform2f(ringP.u.uRadii, sat.rEq * KM2W, sat.rPol * KM2W);
      gl.uniform2f(ringP.u.uRingR, RING_IN, 1.0 / (RING_OUT - RING_IN));
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, ringTex);
      gl.uniform1i(ringP.u.uProfile, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, ringVB);
      gl.enableVertexAttribArray(ringP.a.aPos);
      gl.enableVertexAttribArray(ringP.a.aR);
      gl.vertexAttribPointer(ringP.a.aPos, 3, gl.FLOAT, false, 16, 0);
      gl.vertexAttribPointer(ringP.a.aR, 1, gl.FLOAT, false, 16, 12);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, (RING_SEG + 1) * 2);
    }

    // --- 太陽コロナ (加算) ---
    {
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.useProgram(billP.pr);
      gl.uniformMatrix4fv(billP.u.uVP, false, VP);
      gl.uniform3f(billP.u.uCenter, -eye[0], -eye[1], -eye[2]);   // 太陽 (カメラ相対)
      gl.uniform3f(billP.u.uRight, Vm[0], Vm[4], Vm[8]);
      gl.uniform3f(billP.u.uUp, Vm[1], Vm[5], Vm[9]);
      gl.bindBuffer(gl.ARRAY_BUFFER, billVB);
      gl.enableVertexAttribArray(billP.a.aCorner);
      gl.vertexAttribPointer(billP.a.aCorner, 2, gl.FLOAT, false, 0, 0);
      // 本物のコロナ。太陽半径基準なので、離れれば太陽と同じ割合で小さくなる
      gl.uniform1f(billP.u.uFall, 2.4);
      gl.uniform1f(billP.u.uSize, bodyR(SUN) * 5.5);
      gl.uniform3f(billP.u.uCol1, 1.0, 0.45, 0.1);
      gl.uniform3f(billP.u.uCol2, 1.0, 0.85, 0.5);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      // 眩しさ (グレア)。Bloom を入れているときだけ足す。
      //
      // Bloom はトーンマップ済みの画面を取り込むので、太陽の円盤は「日向の雲」と
      // 同じ 1.0 に潰れている。実際の太陽は雲より 5桁ほど明るいのに、その差は
      // 取り込む時点で失われていて、Bloom だけでは太陽を特別扱いできない。
      // グレアの広がりは光源の見かけの大きさでは決まらないので、円盤とは別に
      // 角度で足し戻す。ただし「距離によらない」ではない — 決めているのは
      // 受ける光の量で、これは距離の2乗で落ちる。裾が r^-4 で落ちるとすると
      // 見える半径は照度の 1/4 乗、つまり距離の -1/2 乗になる。
      // 距離で絞らないと、太陽系全体を引きで見たときに 9° の塊が内惑星を軌道
      // ごと飲み込んでしまう (海王星軌道の外から見ても木星軌道まで真っ白)。
      // (Bloom = カメラ・目のグレアの模擬なので、切っているときは素の絵に戻す)
      if (bloomOn) {
        const dSun = Math.hypot(eye[0], eye[1], eye[2]);
        // 基準は 1 au で 9°。近づく側は 2.5倍 (22°) で頭打ちにする —
        // 光球のすぐ上まで寄れるので、伸ばしきると画面が白一色になる。
        //
        // 最後に camZoom で割る。グレアはレンズや目の中の散乱なので、決まるのは
        // 画面上の広がりであって空の角度ではない。望遠にしても滲みは同じ大きさの
        // まま、覆う角度のほうが狭くなる。角度を固定にすると拡大するほど画面上で
        // 大きくなり、実寸 0.06° の太陽が画面の半分を覆う塊に見えていた
        const glareTan = GLARE_TAN / camZoom *
          Math.min(2.5, Math.sqrt(K_REAL / Math.max(dSun, K_REAL * 0.16)));
        // 板は太陽の中心に置かれるので、深度テストで太陽自身の円盤に芯を
        // 削られてしまう (コロナが輪にしか見えないのはこのため)。グレアは
        // 円盤の上にも乗ってほしいので、表面のすぐ手前へ出す。深度テストは
        // 効いたままなので、太陽が惑星の裏に回れば正しく消える
        const k = Math.max(0.02, (dSun - bodyR(SUN) * 1.02) / (dSun || 1));
        gl.uniform3f(billP.u.uCenter, -eye[0] * k, -eye[1] * k, -eye[2] * k);
        // 広く薄い裾。落ち方を緩くして画面の広い範囲まで届かせ、周りの星を
        // 飲み込ませる。「そちらを見ていられない」感じはこの裾が作る
        gl.uniform1f(billP.u.uFall, 1.6);
        gl.uniform1f(billP.u.uSize, Math.max(bodyR(SUN) * 5.5, dSun * glareTan) * k);
        gl.uniform3f(billP.u.uCol1, 0.55, 0.32, 0.12);
        gl.uniform3f(billP.u.uCol2, 1.00, 0.86, 0.66);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        // 白熱した芯。Bloom のしきい値 (0.72) を大きく超えさせて滲ませる。
        // 太陽の色ではなく白に寄せる — 眩しさは色が飛ぶことで伝わる。
        //
        // 落ち方を平らにしない (以前 0.6 にしていた)。加算で 1.0 に張り付いた
        // 領域が広がると、その縁が輪郭として読めてしまい、眩しさではなく
        // 「太陽が大きくなった」に見える。飛ぶ範囲は狭く、外へは滑らかに
        gl.uniform1f(billP.u.uFall, 1.5);
        gl.uniform1f(billP.u.uSize, Math.max(bodyR(SUN) * 2.4, dSun * glareTan * 0.09) * k);
        gl.uniform3f(billP.u.uCol1, 1.0, 0.80, 0.45);
        gl.uniform3f(billP.u.uCol2, 1.0, 1.0, 1.0);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }
    }

    // --- 彗星の尾・コマ (太陽接近時のみ, 加算) ---
    // 直前の太陽コロナが blendFunc を ONE,ONE にしたままなので明示的に指定し直す。
    // コマ・尾のシェーダは alpha=0 を出すので現状は両者の結果が一致するが、
    // 状態を引き継いだままにすると地上ビュー (ONE,ONE_MINUS_SRC_ALPHA) と
    // 食い違ったまま気づけない
    {
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      for (const c of COMETS) {
        const act = cometAct(c);
        if (act < 0.02) continue;
        const w = posW.get(c.key);
        // 反太陽方向 (イオンテイルの軸)
        const wl = Math.hypot(w[0], w[1], w[2]) || 1;
        const ax = w[0] / wl, ay = w[1] / wl, az = w[2] / wl;
        // 軌道速度方向 (ダストテイルの湾曲用)
        keplerAU(c, simDays + 2, SCR.v);
        toWorld(SCR.v, SCR.v2);
        let vx = SCR.v2[0] - w[0], vy = SCR.v2[1] - w[1], vz = SCR.v2[2] - w[2];
        const vl = Math.hypot(vx, vy, vz) || 1;
        vx /= vl; vy /= vl; vz /= vl;
        drawCometFX(c, act, VP, nowSec, w[0] - eye[0], w[1] - eye[1], w[2] - eye[2],
                    ax, ay, az, vx, vy, vz, fpx, Vm[0], Vm[4], Vm[8], 1);
      }

      gl.depthMask(true);
      gl.disable(gl.BLEND);
    }

    drawOverlay();
  }

  //#endregion
  //#region src/render/comet.js
  // 彗星のコマ・尾 (加算合成)。宇宙ビューと地上/月面ビューで共用するため、
  // 視点フレームへ変換済みのベクトルを受け取る。
  //   h*: カメラ(原点)から核へのベクトル  a*: 反太陽方向  v*: 進行方向
  //   rgt*: 画面右方向 (尾を正面から見て軸が縮退したときの予備軸)
  //   scl: ジオメトリを原点まわりに一様縮小した倍率。地上ビューでは天球ドーム上に
  //        置くため 1 未満になる。一様縮小は方向を変えないので見た目の角度は不変
  function drawCometFX(c, act, VPm, tSec, hx, hy, hz, ax, ay, az, vx, vy, vz,
                       fpxV, rgtx, rgty, rgtz, scl) {
    {
      {
        // 遠方では写真のような未解像の頭部と尾、接近時は暗い核と局所ジェットへ遷移
        const camCometDist = Math.hypot(hx, hy, hz) || 1;
        const nucleusPx = bodyR(c) * scl * fpxV / camCometDist;
        const nearT = Math.min(1, Math.max(0, (nucleusPx - 0.7) / 3.3));
        const pixelLod = nearT * nearT * (3 - 2 * nearT);
        const camCometKm = camCometDist / scl / KM2W;   // 実距離に戻して判定
        const distT = Math.min(1, Math.max(0,
          (Math.log(1000000) - Math.log(Math.max(1, camCometKm))) / Math.log(100)));
        const distLod = distT * distT * (3 - 2 * distT);
        const nearLod = Math.max(pixelLod, distLod);
        // 尾を正面・背面から見るとリボンの投影が破綻するため、軸の画面投影量で減衰
        const viewX = hx / camCometDist, viewY = hy / camCometDist, viewZ = hz / camCometDist;
        const axisViewDot = ax * viewX + ay * viewY + az * viewZ;
        const tailFacing = Math.sqrt(Math.max(0, 1 - axisViewDot * axisViewDot));
        const angleT = Math.min(1, Math.max(0, (tailFacing - 0.05) / 0.20));
        const angleVis = angleT * angleT * (3 - 2 * angleT);
        const tailVis = (1 - nearLod) * (1 - nearLod) * angleVis;
        // 核が未解像なら位置を見失わない程度の小さなコマを残し、核が見えたら消す
        const comaVis = (1 - pixelLod) * (1 - distLod * 0.55) + 0.12 * nearLod;
        const jetT = Math.min(1, Math.max(0, (nucleusPx - 1.0) / 3.0));
        const jetVis = Math.max(jetT * jetT * (3 - 2 * jetT), distLod);
        // 尾の幅方向 = 軸×視線 (カメラに正対する帯)
        const sideOf = (bx, by, bz) => {
          let sx = by * hz - bz * hy, sy = bz * hx - bx * hz, sz = bx * hy - by * hx;
          const sl = Math.hypot(sx, sy, sz);
          if (sl < 1e-9) { sx = 0; sy = 1; sz = 0; } else { sx /= sl; sy /= sl; sz /= sl; }
          return [sx, sy, sz];
        };
        // 尾の基準長。実際の彗星の尾は 10^7〜10^8 km (0.07〜0.67 au) で、
        // 大彗星でも 0.5 au 程度が上限。1910年の「尾が空を100〜150°横切った」
        // という記録は、地球が尾のほぼ内部にいたための遠近効果によるもので、
        // 物理長がそれほど必要なわけではない
        const L = act * act * 0.45 * K_REAL * scl;               // 近日点で約 0.45au
        // ダストの湾曲方向 (尾とジェットの両方で使うのでここで求めておく)
        const av = ax * vx + ay * vy + az * vz;
        let cvx = vx - ax * av, cvy = vy - ay * av, cvz = vz - az * av;
        const cvl = Math.hypot(cvx, cvy, cvz) || 1;
        cvx /= cvl; cvy /= cvl; cvz /= cvl;
        let s;
        gl.useProgram(tailP.pr);
        gl.uniformMatrix4fv(tailP.u.uVP, false, VPm);
        gl.uniform3f(tailP.u.uHead, hx, hy, hz);
        gl.uniform1f(tailP.u.uTime, tSec);
        gl.bindBuffer(gl.ARRAY_BUFFER, tailVB);
        gl.enableVertexAttribArray(tailP.a.aCorner);
        gl.vertexAttribPointer(tailP.a.aCorner, 2, gl.FLOAT, false, 0, 0);
        // 尾がほぼ見えない向き・距離なら4層ぶんの描画をまとめて省く
        if (tailVis > 0.004) {
          // ダストテイル。反太陽方向から徐々に進行方向の後方へ曲がる。
          // 太陽光の反射なので先端まで黄白のまま、薄くなるだけ (青くはならない)
          const curve = 0.16;
          s = sideOf(ax - cvx * curve, ay - cvy * curve, az - cvz * curve);
          gl.uniform3f(tailP.u.uAxis, ax, ay, az);
          gl.uniform3f(tailP.u.uCurve, -cvx * curve, -cvy * curve, -cvz * curve);
          gl.uniform3f(tailP.u.uSide, s[0], s[1], s[2]);
          // ダストは放出速度が遅く広い角度に散るため扇状に広がる (全開角 約32°)。
          // 細い直線状なのはイオンテイルの方
          gl.uniform2f(tailP.u.uDim, L * 0.74, L * 0.21);
          gl.uniform3f(tailP.u.uCol1, 1.0, 0.95, 0.86);
          gl.uniform3f(tailP.u.uCol2, 0.74, 0.66, 0.54);
          gl.uniform1f(tailP.u.uKind, 1);
          gl.uniform1f(tailP.u.uSeed, 2.7);
          gl.uniform1f(tailP.u.uAlpha, 0.46 * act * tailVis);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, TAIL_VERTS);
          // ダストの内層を重ね、コマから続く明るい流れを作る
          gl.uniform2f(tailP.u.uDim, L * 0.68, L * 0.15);
          gl.uniform3f(tailP.u.uCol1, 1.0, 0.99, 0.94);
          gl.uniform3f(tailP.u.uCol2, 0.84, 0.78, 0.66);
          gl.uniform1f(tailP.u.uSeed, 7.1);
          gl.uniform1f(tailP.u.uAlpha, 0.34 * act * tailVis);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, TAIL_VERTS);
          // イオンテイルの外層 (青白, 反太陽方向にほぼ直線)
          s = sideOf(ax, ay, az);
          gl.uniform3f(tailP.u.uAxis, ax, ay, az);
          gl.uniform3f(tailP.u.uCurve, 0, 0, 0);
          gl.uniform3f(tailP.u.uSide, s[0], s[1], s[2]);
          gl.uniform2f(tailP.u.uDim, L * 1.18, L * 0.042);
          gl.uniform3f(tailP.u.uCol1, 0.68, 0.90, 1.0);
          gl.uniform3f(tailP.u.uCol2, 0.18, 0.38, 1.0);
          gl.uniform1f(tailP.u.uKind, 0);
          gl.uniform1f(tailP.u.uSeed, 4.3);
          gl.uniform1f(tailP.u.uAlpha, 0.30 * act * tailVis);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, TAIL_VERTS);
          // イオンテイルの細い発光芯
          gl.uniform2f(tailP.u.uDim, L * 1.08, L * 0.024);
          gl.uniform3f(tailP.u.uCol1, 0.88, 0.98, 1.0);
          gl.uniform3f(tailP.u.uCol2, 0.28, 0.52, 1.0);
          gl.uniform1f(tailP.u.uSeed, 9.4);
          gl.uniform1f(tailP.u.uAlpha, 0.22 * act * tailVis);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, TAIL_VERTS);
        }
        // 接近時: 太陽に熱せられた核表面から噴き、反太陽方向へ曲げられる局所ジェット
        if (jetVis > 0.01) {
          let qx = ay * cvz - az * cvy, qy = az * cvx - ax * cvz, qz = ax * cvy - ay * cvx;
          const ql = Math.hypot(qx, qy, qz) || 1;
          qx /= ql; qy /= ql; qz /= ql;
          const jetLen = bodyR(c) * scl * (28 + 12 * act);
          const drawJet = (jx0, jy0, jz0, spread, seed, alpha) => {
            const jl = Math.hypot(jx0, jy0, jz0) || 1;
            const jx = jx0 / jl, jy = jy0 / jl, jz = jz0 / jl;
            const js = sideOf(jx, jy, jz);
            gl.uniform3f(tailP.u.uAxis, jx, jy, jz);
            gl.uniform3f(tailP.u.uCurve, ax * 0.42, ay * 0.42, az * 0.42);
            gl.uniform3f(tailP.u.uSide, js[0], js[1], js[2]);
            gl.uniform2f(tailP.u.uDim, jetLen, bodyR(c) * scl * spread);
            gl.uniform3f(tailP.u.uCol1, 0.92, 0.90, 0.82);
            gl.uniform3f(tailP.u.uCol2, 0.36, 0.43, 0.52);
            gl.uniform1f(tailP.u.uKind, 1);
            gl.uniform1f(tailP.u.uSeed, seed);
            gl.uniform1f(tailP.u.uAlpha, alpha * act * jetVis);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, TAIL_VERTS);
          };
          drawJet(-ax + cvx * 0.28 + qx * 0.10,
                  -ay + cvy * 0.28 + qy * 0.10,
                  -az + cvz * 0.28 + qz * 0.10, 3.0, 3.2, 0.34);
          drawJet(-ax - cvx * 0.18 - qx * 0.22,
                  -ay - cvy * 0.18 - qy * 0.22,
                  -az - cvz * 0.18 - qz * 0.22, 2.2, 8.6, 0.24);
        }
        // コマ (太陽側が圧縮された涙滴型。反太陽側はそのまま尾に連続する)
        gl.useProgram(comaP.pr);
        gl.uniformMatrix4fv(comaP.u.uVP, false, VPm);
        gl.uniform3f(comaP.u.uHead, hx, hy, hz);
        gl.uniform1f(comaP.u.uCore, 1 - pixelLod);
        // コマは投影した尾方向を使う。正面視ではカメラ正対の円形へ滑らかに移行
        const comaT = Math.min(1, Math.max(0, (tailFacing - 0.03) / 0.30));
        const comaFacing = comaT * comaT * (3 - 2 * comaT);
        let pax = ax - viewX * axisViewDot;
        let pay = ay - viewY * axisViewDot;
        let paz = az - viewZ * axisViewDot;
        const pal = Math.hypot(pax, pay, paz);
        if (pal < 1e-5) {
          pax = rgtx; pay = rgty; paz = rgtz;
        } else {
          pax /= pal; pay /= pal; paz /= pal;
        }
        s = sideOf(pax, pay, paz);
        gl.uniform3f(comaP.u.uAxis, pax, pay, paz);
        gl.uniform3f(comaP.u.uSide, s[0], s[1], s[2]);
        gl.uniform1f(comaP.u.uFacing, comaFacing);
        const comaFar = (1 - distLod) * (1 - distLod);
        const comaCloseXpx = Math.max(8, nucleusPx * 2.2);
        const comaCloseYpx = Math.max(6, nucleusPx * 1.6);
        // 係数は L を短くしたぶんを打ち消してあり、遠方でのコマの見かけの
        // 大きさは尾の長さ変更前と同じになる (0.72*0.014 = 0.45*0.0224)
        const comaX = L * 0.0224 * comaFar + camCometDist / fpxV * comaCloseXpx * (1 - comaFar);
        const comaY = L * 0.0144 * comaFar + camCometDist / fpxV * comaCloseYpx * (1 - comaFar);
        const comaProjX = comaY + (comaX - comaY) * comaFacing;
        gl.uniform2f(comaP.u.uDim, comaProjX, comaY);
        gl.uniform3f(comaP.u.uCol, 0.70, 0.78, 0.86);
        gl.uniform1f(comaP.u.uAlpha, 0.92 * act * comaVis);
        gl.bindBuffer(gl.ARRAY_BUFFER, billVB);
        gl.enableVertexAttribArray(comaP.a.aCorner);
        gl.vertexAttribPointer(comaP.a.aCorner, 2, gl.FLOAT, false, 0, 0);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }
    }
  }

  // 彗星の活動度 (0=不活発, 1=近日点)。氷の昇華は境界で突然始まらないため滑らかに
  function cometAct(c) {
    const pa = posAU.get(c.key);
    const rau = Math.hypot(pa[0], pa[1], pa[2]);
    const t = Math.min(1, Math.max(0, (3 - rau) / 2.4));
    return t * t * (3 - 2 * t);
  }

  //#endregion
  //#region src/render/meteor.js
  // ---------- 流星 (地上ビューのみ) ----------
  // 出現数はシム時間に比例させる。再生速度がそのまま「眺める速さ」になり、
  // 3分/秒 (180倍) で流せば ZHR 100 の群が毎秒1個ほど流れる。ただし1本1本が流れる
  // 速さは実時間 — 探査機の自転と同じ扱いで、早送りしても線が一瞬で消える
  // ことはない。停止中は 1秒=1秒 で流す。
  //
  // 見かけの速さ・長さは決め打ちではなく、対地速度から出している。高度 95km
  // を秒速 v [km/s] で飛ぶと、放射点から角距離 ψ の位置での角速度は
  // (v/95)·sin ψ [rad/s]。しし座の 71km/s は 40°/秒 を超えて一瞬で走り、
  // りゅう座の 20km/s はその 1/3 の速さでゆっくり流れる。放射点のそばほど
  // 短く見える (真正面から向かってくるため) のもこの sin ψ による。
  const MET_MAX = 96;          // 同時に描く上限 (突発出現でも頭打ちにする)
  const MET_K = 8;             // 光跡の分割点数
  const MET_H = 95;            // 発光する高さ [km]
  const MET_R = 2.3;           // 個数比 (1等級暗くなるごとに何倍増えるか)
  const MET_MLIM = 6.0;        // ここまで暗いものを出す (ZHR の定義は 6.5等)
  const MET_ZSCALE = Math.pow(MET_R, MET_MLIM - 6.5);   // 暗い側を切ったぶんの補正
  const meteors = [];
  const MET_ALL = SHOWERS.concat(SPORADIC);
  const metArr = new Float32Array(MET_MAX * (MET_K - 1) * 6 * 7);
  let metVB = null;
  // リボン1枚ぶんの頂点並び: 0=前の分割点 / 1=今の分割点、side は幅方向の符号
  const MET_TRI = [0, 0, 1, 0, 1, 1], MET_SIDE = [-1, 1, -1, 1, 1, -1];
  let metPrevSec = -1, metPrevSim = 0;
  const metActive = [];        // いま降っている群 [{ s, zhr, alt, dir }]
  const _rad = [0, 0, 0], _mf = [0, 0, 0], _me1 = [0, 0, 0], _me2 = [0, 0, 0];
  let showMeteor = localStorage.getItem("ssMeteor") !== "0";   // 既定 ON

  // 放射点 (ワールド固定方向) → 地平フレーム [東, 天頂, -北]
  function metRadiantG(s, out) { return worldDirToGround(s.dirW, out); }
  // 放射点の方位・高度 [度] (ツアーの照準・追尾用)
  function radiantAltAz(key) {
    const s = SHOWER_BY_KEY.get(key);
    if (!s) return null;
    metRadiantG(s, _rad);
    return { az: (Math.atan2(_rad[0], -_rad[2]) / DEG + 360) % 360,
             alt: Math.asin(Math.max(-1, Math.min(1, _rad[1]))) / DEG };
  }
  // ツアー用: 放射点へ照準を合わせ、そのまま日周運動を追尾する。天体と違って
  // 選択の対象にならないので、追尾は gRadTrack (群のキー) で持つ
  let gRadTrack = "";
  function aimGroundAtRadiant(key, instant) {
    const c = radiantAltAz(key);
    if (!c) return false;
    gTrack = true;
    gRadTrack = key;
    let d = (c.az * DEG - gAz) % (2 * Math.PI);
    if (d > Math.PI) d -= 2 * Math.PI;
    if (d < -Math.PI) d += 2 * Math.PI;
    gAzTgt = gAz + d;
    gAltTgt = Math.max(-1.3, Math.min(GALT_MAX, c.alt * DEG));
    if (instant) { gAz = gAzTgt; gAlt = gAltTgt; gTrkKey = ""; }
    return true;
  }
  // 視野の円錐 (対角) の半角。流星はこの中だけに出し、そのぶん出現数も
  // 立体角比 (1 - cos θ) で減らす — 空全体に出して捨てるより無駄がない
  function metConeHalf() {
    return Math.min(1.47, Math.atan(Math.tan(Math.min(MAX_FOV, gFov) * 0.5) * Math.hypot(1, W / H)));
  }
  // 昼は流星が見えない。風景 (showTerrain) を切っていると空は昼でも暗いままで
  // 星も出したままにしてあるが、それに合わせて真昼に流星を降らせるのはさすがに
  // 誤解を招く。ここだけは風景の設定と関係なく太陽高度で決める
  function metNightF() {
    const a = Math.asin(Math.max(-1, Math.min(1, _sunG[1]))) / DEG;
    return Math.max(0, Math.min(1, (-a - 4) / 8));   // −4° で 0、−12° で 1
  }
  // 月明かり。満月が高いと暗い流星が空に埋もれる (概算)
  function metMoonF() {
    const c = computeObs(MOON);
    if (c.alt <= 0) return 1;
    return 1 - 0.62 * c.illum * Math.sqrt(Math.sin(c.alt * DEG));
  }

  // 1本ぶんの発生。radG = 放射点方向 (散在流星は null)
  function metSpawn(radG, v, nowSec) {
    // 視野円錐内へ立体角一様に開始点を取る
    const th = metConeHalf();
    const cu = 1 - (1 - Math.cos(th)) * Math.random();
    const su = Math.sqrt(Math.max(0, 1 - cu * cu));
    const ph = Math.random() * 2 * Math.PI;
    const ca = Math.cos(gAlt);
    _mf[0] = ca * Math.sin(gAz); _mf[1] = Math.sin(gAlt); _mf[2] = -ca * Math.cos(gAz);
    // _mf 周りの正規直交基底 (天頂と平行になる場合は東を使う)
    let ax = 0, ay = 1, az = 0;
    if (Math.abs(_mf[1]) > 0.98) { ax = 1; ay = 0; }
    _me1[0] = ay * _mf[2] - az * _mf[1];
    _me1[1] = az * _mf[0] - ax * _mf[2];
    _me1[2] = ax * _mf[1] - ay * _mf[0];
    const e1l = Math.hypot(_me1[0], _me1[1], _me1[2]) || 1;
    _me1[0] /= e1l; _me1[1] /= e1l; _me1[2] /= e1l;
    _me2[0] = _mf[1] * _me1[2] - _mf[2] * _me1[1];
    _me2[1] = _mf[2] * _me1[0] - _mf[0] * _me1[2];
    _me2[2] = _mf[0] * _me1[1] - _mf[1] * _me1[0];
    const cp = Math.cos(ph) * su, sp = Math.sin(ph) * su;
    const px = _mf[0] * cu + _me1[0] * cp + _me2[0] * sp;
    const py = _mf[1] * cu + _me1[1] * cp + _me2[1] * sp;
    const pz = _mf[2] * cu + _me1[2] * cp + _me2[2] * sp;
    if (py < 0.015) return;                     // 地平線下からは出さない
    // 進む向き: 放射点と開始点を通る大円を、放射点と反対側へ
    let tx, ty, tz, sinPsi;
    if (radG) {
      const c = px * radG[0] + py * radG[1] + pz * radG[2];
      sinPsi = Math.sqrt(Math.max(0, 1 - c * c));
      if (sinPsi < 0.035) return;               // 放射点のごく近くは点にしかならない
      tx = (px * c - radG[0]) / sinPsi;
      ty = (py * c - radG[1]) / sinPsi;
      tz = (pz * c - radG[2]) / sinPsi;
    } else {
      // 散在流星は放射点を持たない。適当な大円へ流す
      const rx = Math.random() - 0.5, ry = Math.random() - 0.5, rz = Math.random() - 0.5;
      const d = rx * px + ry * py + rz * pz;
      tx = rx - d * px; ty = ry - d * py; tz = rz - d * pz;
      const tl = Math.hypot(tx, ty, tz) || 1;
      tx /= tl; ty /= tl; tz /= tl;
      sinPsi = 0.45 + 0.55 * Math.random();
    }
    // 明るさ: 1等級暗くなるごとに MET_R 倍に増える分布から引く
    const m = Math.max(-4, MET_MLIM + Math.log(Math.random() || 1e-6) / Math.log(MET_R));
    const bri = Math.pow(2.512, 3.0 - m);       // 3等を1とした明るさ
    const dur = 0.16 + 0.85 * Math.pow(Math.random(), 1.6) * (1 + Math.min(1.2, bri * 0.1));
    const len = Math.min(1.5, (v / MET_H) * sinPsi * dur);
    // 光跡の残り方 [s]。飛んだ長さに対する見かけの長さを決めるので、飛行時間に
    // 比例させる (固定値だと、短命な流星は尾が伸びきる前に消えて点に見える)。
    // 痕: 速い群の明るい流星は、通り過ぎたあとしばらく光の筋が残る
    const tau = 0.34 * dur + (v > 55 && m < 1 ? 0.25 + Math.random() * 0.6 : 0);
    // 色は対地速度で決まる (遅い = 黄橙、速い = 青白)。明るいものほど白く飛ぶ
    const w = Math.min(1, Math.max(0, (v - 30) / 40));
    const wh = Math.min(0.65, Math.max(0, bri * 0.1));
    const r = (1.00 + (0.70 - 1.00) * w), g = (0.72 + (0.80 - 0.72) * w), b = (0.36 + (1.00 - 0.36) * w);
    meteors.push({
      t0: nowSec, dur, len, tau,
      px, py, pz, tx, ty, tz,
      // 画面での明るさは等級から直に引く。放射エネルギー比 (2.512^Δm) をそのまま
      // 使うと6等がほぼ見えず、実際の空の見え方 (6等星は見える) と合わない。
      // 恒星の描き方 (sky の brK/brA) と同じ傾きに揃えてある
      // 画面での明るさは等級から直に引く。放射エネルギー比 (2.512^Δm) をそのまま
      // 使うと6等がほとんど見えず、実際の空の見え方 (6等星は見える) と合わない。
      // 恒星の描き方 (sky.js の brK/brA) と同じ傾きに揃えてある
      a: Math.max(0.55, Math.min(2.2, 1.75 - 0.18 * m)),
      wpx: 1.8 + 0.5 * Math.max(0, 3 - m),   // 明るいものほど太い (火球は5px)
      r: r + (1 - r) * wh, g: g + (1 - g) * wh, b: b + (1 - b) * wh,
    });
  }

  function updateMeteors(nowSec) {
    const dtReal = metPrevSec < 0 ? 0 : Math.min(0.25, Math.max(0, nowSec - metPrevSec));
    metPrevSec = nowSec;
    const dSim = Math.abs(simDays - metPrevSim);
    metPrevSim = simDays;
    metActive.length = 0;
    // 月面には大気が無いので流星は光らない
    if (!showMeteor || !groundView || surfaceBody !== "earth") { meteors.length = 0; return; }
    // 寿命の尽きたものを落とす
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      if (nowSec - m.t0 > m.dur + m.tau * 3) meteors.splice(i, 1);
    }
    // 1フレームで進める時間。日時をジャンプしたときに一気に湧かないよう頭打ちにする
    const dtH = playing ? Math.min(dSim * 24, 1.0) : dtReal / 3600;
    if (dtH <= 0) return;
    const coneF = 1 - Math.cos(metConeHalf());
    const nightF = metNightF();
    // 昼でも放射点の印は出す (「空にはあるが見えない」を示すため)。出現数だけ 0 になる
    const moonF = nightF > 0 ? metMoonF() : 1;
    const sl = sunLonDeg();
    for (const s of MET_ALL) {
      const spor = s === SPORADIC;
      let sinAlt = 0.5, zhr = s.zhr;
      if (!spor) {
        zhr = showerZhr(s, simDays, sl);
        if (zhr < 1.2) { s.acc = 0; continue; }
        metRadiantG(s, _rad);
        sinAlt = _rad[1];
        metActive.push({ s, zhr, alt: Math.asin(Math.max(-1, Math.min(1, sinAlt))) / DEG,
                         dir: [_rad[0], _rad[1], _rad[2]] });
        if (sinAlt < 0.03) { s.acc = 0; continue; }
      }
      // 実際の出現数 = ZHR × sin(放射点高度) × 月明かり × 夜か
      const hr = zhr * sinAlt * moonF * nightF * MET_ZSCALE * coneF;
      s.acc = Math.min(4, s.acc + hr * dtH);
      while (s.acc >= 1 && meteors.length < MET_MAX) {
        s.acc -= 1;
        // 発生時刻はフレーム内へばらけさせる。全部を今フレームの頭から始めると
        // 「まとめて出てまとめて消える」拍が見えるし、フレーム間隔が空く端末
        // (低 fps・タブ復帰直後) では出た瞬間に寿命が尽きて1本も見えなくなる
        const t0 = nowSec - Math.random() * Math.min(0.4, Math.max(dtReal, 0.016));
        if (spor) metSpawn(null, 15 + Math.random() * 55, t0);
        else metSpawn(_rad, s.v, t0);
      }
    }
  }

  // 光跡を1本のリボンとして描く。加算合成なので、後ろの星が透けて見える
  function drawMeteors(nowSec) {
    if (!meteors.length) return;
    let n = 0;
    const pxW = gFov / H * SKYR;                // 画面1px ぶんの world 幅
    for (const m of meteors) {
      const age = nowSec - m.t0;
      const span = m.tau * 3;                   // 先端から後ろへ引く時間
      const endF = age <= m.dur ? 1 : Math.max(0, 1 - (age - m.dur) / span);
      if (endF <= 0) continue;
      const fadeIn = Math.min(1, age / 0.05);
      const headA = Math.min(age, m.dur) / m.dur * m.len;
      const rate = m.len / m.dur;               // 弧長の進み [rad/s]
      const half = Math.max(0.6, m.wpx * 0.5) * pxW;
      // 頂点は前の分割点との間に張るので、1点ぶんだけ持ち越す
      let has = 0, ox = 0, oy = 0, oz = 0, ohx = 0, ohy = 0, ohz = 0, orr = 0, og = 0, ob = 0;
      for (let k = 0; k < MET_K; k++) {
        const ageK = k / (MET_K - 1) * span;
        const arc = headA - ageK * rate;
        const t = Math.max(0, arc);
        const ct = Math.cos(t), st = Math.sin(t);
        const x = m.px * ct + m.tx * st, y = m.py * ct + m.ty * st, z = m.pz * ct + m.tz * st;
        const dx = -m.px * st + m.tx * ct, dy = -m.py * st + m.ty * ct, dz = -m.pz * st + m.tz * ct;
        // 位置と進行方向はどちらも単位で直交するので、外積がそのまま横方向の単位になる
        const hx = (y * dz - z * dy) * half, hy = (z * dx - x * dz) * half, hz = (x * dy - y * dx) * half;
        const a = (arc < 0 ? 0 : Math.exp(-ageK / m.tau)) * endF * fadeIn * m.a;
        const cx = x * SKYR, cy = y * SKYR, cz = z * SKYR;
        const cr = m.r * a, cg = m.g * a, cb = m.b * a;
        if (has) {
          // 前の点 (o*) と今の点 (c*) で四角形 1枚 = 三角形 2枚
          for (let i = 0; i < 6; i++) {
            const cur = MET_TRI[i], sgn = MET_SIDE[i], oo = (n + i) * 7;
            const bx = cur ? cx : ox, by = cur ? cy : oy, bz = cur ? cz : oz;
            metArr[oo]     = bx + (cur ? hx : ohx) * sgn;
            metArr[oo + 1] = by + (cur ? hy : ohy) * sgn;
            metArr[oo + 2] = bz + (cur ? hz : ohz) * sgn;
            metArr[oo + 3] = cur ? cr : orr;
            metArr[oo + 4] = cur ? cg : og;
            metArr[oo + 5] = cur ? cb : ob;
            metArr[oo + 6] = sgn;
          }
          n += 6;
        }
        has = 1;
        ox = cx; oy = cy; oz = cz; ohx = hx; ohy = hy; ohz = hz; orr = cr; og = cg; ob = cb;
      }
    }
    if (!n) return;
    if (!metVB) metVB = gl.createBuffer();
    // 状態は暗黙で引き継がせない (直前が球の描画なら深度とカリングが立っている)
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.CULL_FACE);
    gl.depthMask(false);
    gl.useProgram(meteorP.pr);
    gl.uniformMatrix4fv(meteorP.u.uVP, false, gVP32);
    gl.bindBuffer(gl.ARRAY_BUFFER, metVB);
    gl.bufferData(gl.ARRAY_BUFFER, metArr.subarray(0, n * 7), gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(meteorP.a.aPos);
    gl.enableVertexAttribArray(meteorP.a.aCol);
    gl.enableVertexAttribArray(meteorP.a.aY);
    gl.vertexAttribPointer(meteorP.a.aPos, 3, gl.FLOAT, false, 28, 0);
    gl.vertexAttribPointer(meteorP.a.aCol, 3, gl.FLOAT, false, 28, 12);
    gl.vertexAttribPointer(meteorP.a.aY, 1, gl.FLOAT, false, 28, 24);
    gl.drawArrays(gl.TRIANGLES, 0, n);
    gl.disable(gl.BLEND);
  }

  // 放射点の印と群名 (オーバーレイ)。降っている群だけ、地平線より上にあるとき
  function drawRadiants() {
    if (!metActive.length) return;
    octx.textAlign = "center";
    octx.font = '11px "Avenir Next","Hiragino Sans",sans-serif';
    for (const a of metActive) {
      if (a.dir[1] < 0.02) continue;
      const s = projGround([a.dir[0] * SKYR, a.dir[1] * SKYR, a.dir[2] * SKYR]);
      if (!s || s.x < 0 || s.x > W || s.y < 0 || s.y > H) continue;
      // 濃さは出現数で。平年の極大 (ZHR 100 前後) で最も濃くなる
      const v = Math.min(0.85, 0.22 + Math.log10(1 + a.zhr) * 0.26) * starVis;
      octx.strokeStyle = "rgba(150,196,236," + v.toFixed(3) + ")";
      octx.lineWidth = 1.1;
      octx.beginPath();
      octx.arc(s.x, s.y, 7, 0, 2 * Math.PI);
      octx.stroke();
      octx.beginPath();
      octx.moveTo(s.x - 12, s.y); octx.lineTo(s.x - 9, s.y);
      octx.moveTo(s.x + 9, s.y); octx.lineTo(s.x + 12, s.y);
      octx.moveTo(s.x, s.y - 12); octx.lineTo(s.x, s.y - 9);
      octx.moveTo(s.x, s.y + 9); octx.lineTo(s.x, s.y + 12);
      octx.stroke();
      octx.fillStyle = "rgba(178,214,246," + v.toFixed(3) + ")";
      octx.fillText(lang === "ja" ? a.s.ja : a.s.en, s.x, s.y - 17);
    }
  }
  //#endregion
  //#region src/runtime/frame.js
  // ---------- オーバーレイ (ラベル・選択リング) ----------
  function drawOverlay() {
    octx.setTransform(DPR, 0, 0, DPR, 0, 0);
    octx.clearRect(0, 0, W, H);
    octx.textAlign = "center";
    octx.font = '10.5px "Avenir Next","Hiragino Sans",sans-serif';
    // 注視しているだけの天体 (ツアー) には選択マークを付けない。
    // ツアーの注目天体 (spot) は選択とは別に、同じ見た目で強調する
    const marked = showSelMark ? selected : null;
    const spotB = tourSpot ? BODY_BY_KEY.get(tourSpot) : null;

    for (const b of [SUN, ...PLANETS]) {
      const s = screenPos.get(b.key);
      if (!s || s.hidden) continue;   // 手前の天体の円盤に隠れている
      if (s.x < -40 || s.x > W + 40 || s.y < -40 || s.y > H + 40) continue;
      if (s.r > H * 0.6) continue;
      if (marked === b || spotB === b) {
        octx.beginPath();
        octx.arc(s.x, s.y, Math.max(s.r, 3) + 6, 0, 2 * Math.PI);
        octx.strokeStyle = "rgba(242,178,62,0.9)";
        octx.lineWidth = 1.2;
        octx.stroke();
      }
      if (b.showLabel) {
        octx.fillStyle = (marked === b || spotB === b) ? "rgba(242,178,62,0.95)" : "rgba(201,213,234,0.75)";
        octx.fillText(bName(b), s.x, s.y - Math.max(s.r, 3) - 9);
      }
    }

    // 衛星ラベル (母天体から画面上で離れている、または十分拡大している時のみ)
    for (const s of SATELLITES) {
      const sp = screenPos.get(s.key);
      if (!sp || sp.hidden || sp.r >= H * 0.6) continue;
      if (sp.x < -40 || sp.x > W + 40 || sp.y < -40 || sp.y > H + 40) continue;
      const pp = screenPos.get(s.parent);
      const away = pp ? Math.hypot(sp.x - pp.x, sp.y - pp.y) > 16 : true;
      if (s.showLabel && (sp.r > 2 || away)) {
        octx.fillStyle = (marked === s || spotB === s) ? "rgba(242,178,62,0.95)" : "rgba(201,213,234,0.6)";
        octx.fillText(bName(s), sp.x, sp.y - Math.max(sp.r, 3) - 8);
      }
      if (marked === s || spotB === s) {
        octx.beginPath();
        octx.arc(sp.x, sp.y, Math.max(sp.r, 3) + 6, 0, 2 * Math.PI);
        octx.strokeStyle = "rgba(242,178,62,0.9)";
        octx.lineWidth = 1.2;
        octx.stroke();
      }
    }

    // 探査機 (実寸比では点にもならないので、常に名前を出す)
    for (const pr of PROBES) {
      if (!pr.live || (tourProbes && tourProbes.indexOf(pr.key) < 0)) continue;
      const sp = screenPos.get(pr.key);
      if (!sp || sp.hidden) continue;
      if (sp.x < -40 || sp.x > W + 40 || sp.y < -40 || sp.y > H + 40) continue;
      octx.fillStyle = (marked === pr || spotB === pr)
        ? "rgba(242,178,62,0.95)" : "rgba(180,205,240,0.85)";
      octx.fillText(bName(pr), sp.x, sp.y - (pr.px ? pr.px * 0.5 : 4) - 8);
    }

    // ツアーの視線ガイド。注視している天体から、指定した天体の方向へ破線を引く。
    // 実寸比では相手がほぼ必ず画面外なので、枠の内側で止めて名前と矢じりを出す
    if (tourSight && !groundView && selected) {
      const from = screenPos.get(selected.key);
      const tb = BODY_BY_KEY.get(tourSight);
      if (from && tb) {
        // 相手はカメラの真横や後方にいることが多く、投影では位置が出ない。
        // ワールドの方向ベクトルをカメラの右/上ベクトルへ射影して画面の向きを得る
        const fw = posW.get(selected.key), tw = posW.get(tourSight);
        const vx = tw[0] - fw[0], vy = tw[1] - fw[1], vz = tw[2] - fw[2];
        let dx = vx * Vm[0] + vy * Vm[4] + vz * Vm[8];
        let dy = -(vx * Vm[1] + vy * Vm[5] + vz * Vm[9]);   // 画面の y は下向き
        const len = Math.hypot(dx, dy);
        if (len > 1e-9) {
          dx /= len; dy /= len;
          // 枠の内側まで伸ばす (長さは画面のピクセル。方向だけを上で求めている)
          const m = 52;                       // 枠からの余白 (名前を置く分)
          let t = Math.max(W, H);
          if (dx > 1e-6) t = Math.min(t, (W - m - from.x) / dx);
          else if (dx < -1e-6) t = Math.min(t, (m - from.x) / dx);
          if (dy > 1e-6) t = Math.min(t, (H - m - from.y) / dy);
          else if (dy < -1e-6) t = Math.min(t, (m - from.y) / dy);
          const t0 = Math.max(from.r, 3) + 10;
          if (t > t0 + 24) {
          const sx = from.x + dx * t0, sy = from.y + dy * t0;
          const ex = from.x + dx * t, ey = from.y + dy * t;
          octx.save();
          octx.setLineDash([7, 5]);
          octx.strokeStyle = "rgba(242,178,62,0.7)";
          octx.lineWidth = 1.2;
          octx.beginPath();
          octx.moveTo(sx, sy);
          octx.lineTo(ex, ey);
          octx.stroke();
          octx.restore();
          octx.fillStyle = "rgba(242,178,62,0.95)";
          octx.beginPath();                   // 矢じり
          octx.moveTo(ex, ey);
          octx.lineTo(ex - dx * 10 - dy * 5, ey - dy * 10 + dx * 5);
          octx.lineTo(ex - dx * 10 + dy * 5, ey - dy * 10 - dx * 5);
          octx.closePath();
          octx.fill();
          octx.fillText(bName(tb), ex - dx * 22, ey - dy * 22 - 4);
          }
        }
      }
    }

    // 星座名 (背景天球上のラベル)
    if (showConst) {
      octx.fillStyle = "rgba(150,178,224,0.5)";
      octx.font = '11px "Avenir Next","Hiragino Sans",sans-serif';
      for (const c of CONST_LABELS) {
        const w = VP[3] * c.wx + VP[7] * c.wy + VP[11] * c.wz + VP[15];
        if (w <= 0.001) continue;
        const x = (VP[0] * c.wx + VP[4] * c.wy + VP[8] * c.wz + VP[12]) / w;
        const y = (VP[1] * c.wx + VP[5] * c.wy + VP[9] * c.wz + VP[13]) / w;
        const px = (x * 0.5 + 0.5) * W, py = (1 - (y * 0.5 + 0.5)) * H;
        if (px < 0 || px > W || py < 0 || py > H) continue;
        octx.fillText(lang === "ja" ? c.ja : c.en, px, py);
      }
      // 黄道ラベル: 画面中央に最も近い可視点に1つ
      let bx = 0, by = 0, bd = Infinity;
      for (let i = 0; i + 2 < ECL_WORLD.length; i += 3) {
        const X = ECL_WORLD[i], Y = ECL_WORLD[i + 1], Z = ECL_WORLD[i + 2];
        const w = VP[3] * X + VP[7] * Y + VP[11] * Z + VP[15];
        if (w <= 0.001) continue;
        const px = ((VP[0] * X + VP[4] * Y + VP[8] * Z + VP[12]) / w * 0.5 + 0.5) * W;
        const py = (1 - ((VP[1] * X + VP[5] * Y + VP[9] * Z + VP[13]) / w * 0.5 + 0.5)) * H;
        if (px < 0 || px > W || py < 0 || py > H) continue;
        const d = (px - W / 2) ** 2 + (py - H / 2) ** 2;
        if (d < bd) { bd = d; bx = px; by = py; }
      }
      if (bd < Infinity) {
        octx.fillStyle = "rgba(226,178,110,0.75)";
        octx.fillText(lang === "ja" ? "黄道" : "Ecliptic", bx, by - 6);
      }
    }
  }

  // ---------- 日時の表示 & 入力 (表示はローカル時刻) ----------
  const dateInput = document.getElementById("dateInput");
  const timeInput = document.getElementById("timeInput");
  const tzText = document.getElementById("tzText");
  const pad2 = (n) => String(n).padStart(2, "0");
  // タイムゾーン略称 (JST / GMT / BST など)。日付・言語ごとにキャッシュ (夏時間対応)
  let tzKey = "", tzVal = "";
  function tzAbbr(d) {
    const key = lang + "|" + d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
    if (key !== tzKey) {
      tzKey = key;
      try {
        tzVal = new Intl.DateTimeFormat(lang === "ja" ? "ja-JP" : "en", { timeZoneName: "short" })
          .formatToParts(d).find((p) => p.type === "timeZoneName").value || "";
      } catch (e) {
        tzVal = "";
      }
    }
    return tzVal;
  }
  // DOM への書き込みは値が変わった時だけ行う (毎フレームのレイアウト誘発を防ぐ)
  let lastDateStr = "", lastTimeStr = "", lastTzStr = "";
  function updateClock() {
    const d = new Date(J2000 + simDays * DAY_MS);
    const ds = String(d.getFullYear()).padStart(4, "0") +
      "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
    // 編集中は上書きしない
    if (document.activeElement !== dateInput && ds !== lastDateStr) {
      dateInput.value = ds;
      lastDateStr = ds;
    }
    const ts = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
    if (document.activeElement !== timeInput && ts !== lastTimeStr) {
      timeInput.value = ts;
      lastTimeStr = ts;
    }
    const tz = tzAbbr(d);
    if (tz !== lastTzStr) {
      tzText.textContent = tz;
      lastTzStr = tz;
    }
  }
  // 入力欄の min/max はローカル日付なので、範囲もローカル時刻で揃える
  const MIN_T = new Date(1900, 0, 1).getTime();
  const MAX_T = new Date(2199, 11, 31, 23, 59, 59, 999).getTime();
  function setSimTime(t) {
    simDays = (Math.min(Math.max(t, MIN_T), MAX_T) - J2000) / DAY_MS;
  }
  // ガイドツアーの「できました」判定用。simDays は再生でも勝手に動くので
  // スナップショットでは操作を見分けられない。日時が変わる経路はこの3つ
  // (日付欄・時刻欄・現在時刻ボタン) だけなので、ここで数える
  let clockEdits = 0;
  // 年を4桁打ち終える前にも change は発火する ("1" の時点で 0001 年として発火)。
  // そこで確定・補正すると入力途中の年が勝手に書き換わってしまうため、
  // 4桁揃うまでは何もしない。フォーカスも奪わない (奪うと続きが打てない)
  dateInput.addEventListener("change", () => {
    const v = dateInput.value;                // "YYYY-MM-DD"
    if (!v) return;
    const [y, mo, dd] = v.split("-").map(Number);
    if (!(y >= 1000)) return;                 // 入力途中 (年が4桁未満)
    // 日付だけを差し替え、時刻は今の値をそのまま持ち越す
    const c = new Date(J2000 + simDays * DAY_MS);
    setSimTime(new Date(y, mo - 1, dd,
      c.getHours(), c.getMinutes(), c.getSeconds(), c.getMilliseconds()).getTime());
    clockEdits++;
  });
  timeInput.addEventListener("change", () => {
    const v = timeInput.value;                // "HH:MM"
    if (!v) return;
    const [hh, mi] = v.split(":").map(Number);
    if (!Number.isFinite(hh) || !Number.isFinite(mi)) return;
    // 時刻だけを差し替え。入力欄に秒が無いので秒以下は 0 に揃える
    const c = new Date(J2000 + simDays * DAY_MS);
    setSimTime(new Date(c.getFullYear(), c.getMonth(), c.getDate(), hh, mi, 0, 0).getTime());
    clockEdits++;
  });
  // Enter で入力を終える
  dateInput.addEventListener("keydown", (e) => { if (e.key === "Enter") dateInput.blur(); });
  timeInput.addEventListener("keydown", (e) => { if (e.key === "Enter") timeInput.blur(); });
  // 入力欄を離れたら、実際の日時を必ず書き戻す (範囲外や打ちかけの表示を正す)
  dateInput.addEventListener("blur", () => { lastDateStr = ""; });
  timeInput.addEventListener("blur", () => { lastTimeStr = ""; });
  document.getElementById("nowBtn").addEventListener("click", () => {
    simDays = (Date.now() - J2000) / DAY_MS;
    clockEdits++;
  });
  function fmtDays(v) {
    const u = T().u;
    if (v >= 365.25) return (v / 365.25).toFixed(1) + u.yr;
    if (v >= 10) return Math.round(v) + u.d;
    if (v >= 1) return v.toFixed(1) + u.d;
    if (v >= 1 / 24) return (v * 24).toFixed(1) + u.h;
    if (v >= 1 / 1440) return Math.round(v * 1440) + u.min;
    return Math.round(v * 86400) + u.s;
  }
  // 再生速度の表示。最低速だけは「1秒/秒」になってしまい、割り算の形では
  // 意味が取りにくい (1秒で1秒進む = 等倍) ので、そこだけ言葉にする
  function fmtRate(v) {
    if (Math.abs(v * 86400 - 1) < 0.01) return T().rateReal;
    return fmtDays(v) + T().rateSuffix;
  }

  // ---------- メインループ ----------
  let last = performance.now();
  let lastSettingsSave = 0;
  let followKey = null;                   // 前フレームで追従していた天体
  const followPrev = [0, 0, 0];
  function frame(now) {
    const raw = (now - last) / 1000;
    last = now;
    const dtc = Math.min(0.5, raw);       // カメラ緩和用 (低 fps でも追従)
    // シミュレーション時刻は「実経過時間 × 再生速度」の連続関数にする。
    // タブ非表示中は rAF が止まるが、復帰フレームで隠れていた時間ぶんを
    // 一括で進める (クランプすると 1秒=1秒 でも時計が現実から遅れていく)
    if (playing) {
      let adv = daysPerSec * raw;
      // ツアーの早送りは、指定日時でいきなり止めずに手前から落として着地させる。
      // 残り時間が窓 (今の速さで 1.2秒ぶん) を切ったら √ で減速 — 減速度が一定に
      // なるので、止まる瞬間だけが急にならない
      if (tourUntil !== null) {
        const win = daysPerSec * 1.2, rem = tourUntil - simDays;
        if (rem > 0 && rem < win) adv *= Math.max(0.02, Math.sqrt(rem / win));
      }
      simDays += adv;
    }
    // 探査機のモデルはゆっくり回して立体だと分かるようにしているが、回し続けると
    // 時計を止めた場面でも機体だけが動いてしまう。再生中だけ進める
    if (playing) probeSpin += dtc * 0.10;

    if (selected && followKey === selected.key) {
      const t = posW.get(selected.key);
      followPrev[0] = t[0]; followPrev[1] = t[1]; followPrev[2] = t[2];
    }

    updatePositions();
    updateEclipses();   // 太陽面を隠している天体を、今の位置から選び直す

    // 注視点追従 & ズーム・角度の緩和
    if (selected) {
      const t = posW.get(selected.key);
      if (followKey === selected.key) {
        // 天体の公転移動分は即時追従 (緩和すると実サイズ時に遅れで見失う)
        cam.focus[0] += t[0] - followPrev[0];
        cam.focus[1] += t[1] - followPrev[1];
        cam.focus[2] += t[2] - followPrev[2];
      }
      followKey = selected.key;
      lastCenter = selected;
      cam.focusTgt[0] = t[0]; cam.focusTgt[1] = t[1]; cam.focusTgt[2] = t[2];
    } else {
      followKey = null;
    }
    const k = 1 - Math.exp(-dtc * 5.5);
    cam.focus[0] += (cam.focusTgt[0] - cam.focus[0]) * k;
    cam.focus[1] += (cam.focusTgt[1] - cam.focus[1]) * k;
    cam.focus[2] += (cam.focusTgt[2] - cam.focus[2]) * k;
    cam.panOff[0] += (cam.panOffTgt[0] - cam.panOff[0]) * k;
    cam.panOff[1] += (cam.panOffTgt[1] - cam.panOff[1]) * k;
    cam.panOff[2] += (cam.panOffTgt[2] - cam.panOff[2]) * k;
    cam.distTgt = Math.max(minDist(), Math.min(1400, cam.distTgt));
    cam.dist += (cam.distTgt - cam.dist) * k;
    camZoomTgt = Math.max(1, Math.min(MAG_MAX, camZoomTgt));
    camZoom += (camZoomTgt - camZoom) * k;
    let dyaw = (cam.yawTgt - cam.yaw) % (2 * Math.PI);
    if (dyaw > Math.PI) dyaw -= 2 * Math.PI;
    if (dyaw < -Math.PI) dyaw += 2 * Math.PI;
    cam.yaw += dyaw * k;
    cam.pitch += (cam.pitchTgt - cam.pitch) * k;
    // 地上ビューのカメラ緩和 (目標方位は aimGroundAt で現在値の近傍に正規化済み)
    if (groundView) {
      buildObsFrame();   // 追尾計算 (surfaceAltAz) が現在フレームの観測者基底を使えるように
      // 選択が変わって天体別の画角下限が上がった場合は目標を追従させる
      const mf = gMinFov();
      if (gFovTgt < mf) gFovTgt = mf;
      // 自動追尾: 日周運動での移動分は即時反映し、残差のみ緩和で追従
      // (緩和だけだと定常遅れが高倍率の視野幅を超え、天体が視野外に留まるため)
      if (gTrack) {
        // 追う先は天体か、流星群の放射点 (ツアーで放射点を画面中央に留める)
        const b = gRadTrack ? null : (selected || lastCenter);
        const c = gRadTrack ? radiantAltAz(gRadTrack)
                            : (b && b.key !== surfaceBody ? surfaceAltAz(b) : null);
        const trk = gRadTrack ? "@" + gRadTrack : (b ? b.key : "");
        if (c) {
          const az = c.az * DEG, alt = c.alt * DEG;
          if (gTrkKey === trk) {
            // 前フレームからの移動分は即時追従
            let dm = (az - gTrkAz) % (2 * Math.PI);
            if (dm > Math.PI) dm -= 2 * Math.PI;
            if (dm < -Math.PI) dm += 2 * Math.PI;
            gAz += dm;
            gAlt += alt - gTrkAlt;
          }
          // 残差 (追尾開始前に生じたずれ等) は目標へ寄せて緩和で収束させる
          let dr = (az - gAz) % (2 * Math.PI);
          if (dr > Math.PI) dr -= 2 * Math.PI;
          if (dr < -Math.PI) dr += 2 * Math.PI;
          gAzTgt = gAz + dr;
          gAltTgt = Math.max(-1.4, Math.min(GALT_MAX, alt));
          gTrkKey = trk; gTrkAz = az; gTrkAlt = alt;
        }
      } else {
        gTrkKey = "";
        gRadTrack = "";
      }
    }
    gAz += (gAzTgt - gAz) * k;
    gAlt += (gAltTgt - gAlt) * k;
    gFov += (gFovTgt - gFov) * k;

    tourRideCam();     // ガイドツアー: 探査機視点のステップはカメラを直接置く
    render(now / 1000);
    bloomPass();          // 明るいところの滲み (シーンを描き終えてから)
    updateClock();
    tourWatch();          // ガイドツアー: 促した操作をされたら次のステップへ
    updateZoomUI();
    updateMagUI();
    updateAngleUI();
    updateObs();
    updateGroundUI();
    if (now - lastSettingsSave > 2000) {
      lastSettingsSave = now;
      saveSettings();
    }
    requestAnimationFrame(frame);
  }

  //#endregion
  //#region src/ui/observe.js
  // ---------- 選択 ----------
  const infoPanel = document.getElementById("info");
  const navEl = document.getElementById("nav");

  // 選択中の天体をもう一度押したとき。注視先はそのままに、選択の飾り
  // (オレンジの枠と説明パネル) だけを出し入れする。寄って眺めるときに、
  // 見たい面へ枠と文字が重なるのを避けるため。解除は何もない所を押す
  function toggleSelChrome(body) {
    showSelMark = !showSelMark;
    if (showSelMark) openInfo(body);
    else infoPanel.classList.remove("open");
  }
  function select(body, fly) {
    selected = body;
    updateNavSel();
    if (!body) {
      infoPanel.classList.remove("open");
      return;
    }
    openInfo(body);
    // 子天体を直接選択したときは親グループを展開し、リスト内に見えるようスクロール
    EXPAND_BY_CHILD.get(body.key)?.();
    const navBtn = navEl.querySelector('button.body[data-key="' + body.key + '"]');
    if (navBtn) navBtn.scrollIntoView({ block: "nearest", inline: "nearest" });
    if (fly && groundView) {
      // 地上ビュー中はカメラ飛行の代わりに、その天体の方向へ視点を向ける
      aimGroundAt(body);
    } else if (fly) {
      // 天体からの接近距離 (km)。サイズに応じて調整、未指定は10万km
      const zoomKm = {
        mercury: 50000, moon: 30000, mars: 50000,
        phobos: 300, deimos: 300,
        jupiter: 700000, io: 30000, europa: 30000, ganymede: 50000, callisto: 50000,
        saturn: 700000, titan: 50000,
        uranus: 500000, titania: 20000,
        neptune: 500000, triton: 30000,
        pluto: 30000, charon: 20000,
        ceres: 10000, vesta: 10000, pallas: 10000, juno: 10000,
        halley: 300,
      };
      cam.distTgt = body === SUN
        ? bodyR(SUN) * 4.2
        : Math.max(bodyR(body) * 2.2, (zoomKm[body.key] || 100000) * KM2W);
      if (body !== SUN) {
        // 太陽光の当たる側 (太陽と天体の間) へ回り込む
        const w = posW.get(body.key);
        const l = Math.hypot(w[0], w[1], w[2]) || 1;
        const d = [-w[0] / l, -w[1] / l, -w[2] / l];
        cam.yawTgt = Math.atan2(d[2], d[0]) + 0.5;
        cam.pitchTgt = Math.asin(Math.max(-1, Math.min(1, d[1]))) + 0.22;
      }
    }
    if (body === SUN) { cam.focusTgt[0] = 0; cam.focusTgt[1] = 0; cam.focusTgt[2] = 0; }
    resetPan();   // 天体を選んだら平行移動をリセットして中心に据える
    hideHint();
  }

  // モバイル: 情報パネルを操作パネルのすぐ上に配置 (実高さを測って追従)。
  // 横持ちは右側の情報パネルが中央寄せの操作パネルと重ならないよう高さを制限
  function positionInfoPanel() {
    const ctrlHidden = document.getElementById("app").classList.contains("ctrlHidden");
    if (window.matchMedia("(max-width: 720px)").matches) {
      infoPanel.style.maxHeight = "";
      if (ctrlHidden) {
        infoPanel.style.bottom = "12px";   // パネル格納中は画面下端まで使う
        return;
      }
      const top = document.getElementById("controls").getBoundingClientRect().top;
      infoPanel.style.bottom = Math.round(window.innerHeight - top + 8) + "px";
    } else if (window.matchMedia("(max-height: 480px)").matches) {
      infoPanel.style.bottom = "";
      if (ctrlHidden) { infoPanel.style.maxHeight = ""; return; }
      const ctlTop = document.getElementById("controls").getBoundingClientRect().top;
      const infoTop = infoPanel.getBoundingClientRect().top;
      infoPanel.style.maxHeight = Math.max(120, Math.round(ctlTop - infoTop - 8)) + "px";
    } else {
      infoPanel.style.bottom = "";
      infoPanel.style.maxHeight = "";
    }
  }
  window.addEventListener("resize", positionInfoPanel);

  // 操作パネルの折りたたみ (⌄ で画面下へ格納、⌃ で復帰)
  const ctrlCollapseBtn = document.getElementById("ctrlCollapse");
  const ctrlExpandBtn = document.getElementById("ctrlExpand");
  function setCtrlVisible(v) {
    document.getElementById("app").classList.toggle("ctrlHidden", !v);
    positionInfoPanel();
    setTimeout(positionInfoPanel, 300);   // スライドアニメーション後に再計測
  }
  ctrlCollapseBtn.addEventListener("click", () => setCtrlVisible(false));
  ctrlExpandBtn.addEventListener("click", () => setCtrlVisible(true));

  // ---------- 地球からの観測モード (クライアント計算, 近似) ----------
  const ECL = 23.4393 * DEG, RS_RATE = 15.041;   // 黄道傾斜, 時角の進み (度/時)
  // 土星の自転軸 (環の法線) の実方向: 赤経40.589°・赤緯83.537° (ICRF)。
  // 環の見かけの開閉 (約15年周期で真横⇄最大±27°) を正しく再現するために使う
  const SATURN_POLE_W = (() => {
    const ra = 40.589 * DEG, dec = 83.537 * DEG;
    const xq = Math.cos(dec) * Math.cos(ra), yq = Math.cos(dec) * Math.sin(ra), zq = Math.sin(dec);
    const ye = yq * Math.cos(ECL) + zq * Math.sin(ECL);    // 赤道 → 黄道
    const ze = -yq * Math.sin(ECL) + zq * Math.cos(ECL);
    return [xq, ze, -ye];                                   // 黄道 → ワールド (toWorld と同じ軸対応)
  })();
  // 極方向を y 軸とする回転行列 (土星の本体・環のモデル用。x/z は軸対称なので任意)
  const SAT_ROT = (() => {
    const A = SATURN_POLE_W;
    let xx = -A[2], xz = A[0];
    const xl = Math.hypot(xx, xz) || 1; xx /= xl; xz /= xl;
    const o = new Float32Array(16);
    o[0] = xx; o[1] = 0; o[2] = xz;
    o[4] = A[0]; o[5] = A[1]; o[6] = A[2];
    o[8] = -xz * A[1]; o[9] = xz * A[0] - xx * A[2]; o[10] = xx * A[1];
    o[15] = 1;
    return o;
  })();
  let obsLat = parseFloat(localStorage.getItem("ssLat"));
  let obsLon = parseFloat(localStorage.getItem("ssLon"));
  if (!isFinite(obsLat) || !isFinite(obsLon)) { obsLat = 35.68; obsLon = 139.69; }   // 既定: 東京
  const CITIES = [
    { ja: "東京", en: "Tokyo", lat: 35.68, lon: 139.69 },
    { ja: "ニューヨーク", en: "New York", lat: 40.71, lon: -74.01 },
    { ja: "ロンドン", en: "London", lat: 51.51, lon: -0.13 },
    { ja: "パリ", en: "Paris", lat: 48.85, lon: 2.35 },
    { ja: "北京", en: "Beijing", lat: 39.90, lon: 116.41 },
    { ja: "シンガポール", en: "Singapore", lat: 1.35, lon: 103.82 },
    { ja: "ロサンゼルス", en: "Los Angeles", lat: 34.05, lon: -118.24 },
    { ja: "ホノルル", en: "Honolulu", lat: 21.31, lon: -157.86 },
    { ja: "シドニー", en: "Sydney", lat: -33.87, lon: 151.21 },
    { ja: "リオデジャネイロ", en: "Rio de Janeiro", lat: -22.91, lon: -43.17 },
    { ja: "ケープタウン", en: "Cape Town", lat: -33.92, lon: 18.42 },
    { ja: "レイキャビク", en: "Reykjavík", lat: 64.15, lon: -21.94 },
  ];
  // 視等級モデル (V = 基準 + 5log10(rΔ) + 位相項, i = 位相角[度]) — 主要天体のみ
  const MAG = {
    mercury: (r, D, i) => -0.42 + 5*Math.log10(r*D) + 0.038*i - 0.000273*i*i + 2e-6*i*i*i,
    venus:   (r, D, i) => -4.40 + 5*Math.log10(r*D) + 0.0009*i + 0.000239*i*i - 6.5e-7*i*i*i,
    mars:    (r, D, i) => -1.52 + 5*Math.log10(r*D) + 0.016*i,
    jupiter: (r, D, i) => -9.40 + 5*Math.log10(r*D) + 0.005*i,
    saturn:  (r, D, i) => -8.88 + 5*Math.log10(r*D) + 0.044*Math.abs(i),   // 環は無視した近似
    uranus:  (r, D)    => -7.19 + 5*Math.log10(r*D),
    neptune: (r, D)    => -6.87 + 5*Math.log10(r*D),
    moon:    (r, D, i) => 0.23 + 5*Math.log10(r*D) + 0.026*Math.abs(i) + 4e-9*i*i*i*i,
  };
  // world 座標 → 黄道 AU (toWorld の逆)
  const _he = [0,0,0], _ge = [0,0,0], _ea = [0,0,0], _gw = [0,0,0];
  function wEcl(w, out) { out[0] = w[0]/K_REAL; out[1] = -w[2]/K_REAL; out[2] = w[1]/K_REAL; return out; }
  const gmstDeg = (days) => (((280.46061837 + 360.98564736629*days) % 360) + 360) % 360;
  function computeObs(body) {
    const b = posW.get(body.key), e = posW.get("earth");
    _gw[0] = b[0]-e[0]; _gw[1] = b[1]-e[1]; _gw[2] = b[2]-e[2];
    wEcl(_gw, _ge);                                         // 地心黄道
    // 測心視差補正: 観測者は地心ではなく地表にいる (月では最大約1°の差)。
    // 観測者の地心位置 (赤道座標) を黄道へ回して引く
    const lst = (gmstDeg(simDays) + obsLon) * DEG, latR = obsLat * DEG;
    {
      const RE = 6378.14 / AU_KM;
      const ox = Math.cos(latR) * Math.cos(lst), oy = Math.cos(latR) * Math.sin(lst), oz = Math.sin(latR);
      _ge[0] -= RE * ox;
      _ge[1] -= RE * (oy * Math.cos(ECL) + oz * Math.sin(ECL));    // 赤道 → 黄道
      _ge[2] -= RE * (-oy * Math.sin(ECL) + oz * Math.cos(ECL));
    }
    const D = Math.hypot(_ge[0], _ge[1], _ge[2]);
    // 黄道 → 赤道 → 赤経・赤緯
    const xe = _ge[0], ye = _ge[1]*Math.cos(ECL) - _ge[2]*Math.sin(ECL), ze = _ge[1]*Math.sin(ECL) + _ge[2]*Math.cos(ECL);
    const ra = Math.atan2(ye, xe), dec = Math.asin(ze / Math.hypot(xe, ye, ze));
    const lat = obsLat * DEG, H = lst - ra;
    const alt = Math.asin(Math.max(-1, Math.min(1, Math.sin(dec)*Math.sin(lat) + Math.cos(dec)*Math.cos(lat)*Math.cos(H))));
    const A = Math.atan2(Math.sin(H), Math.cos(H)*Math.sin(lat) - Math.tan(dec)*Math.cos(lat));
    let az = (A/DEG + 180) % 360; if (az < 0) az += 360;
    // 日心距離・位相・視等級
    wEcl(b, _he); const r = Math.hypot(_he[0], _he[1], _he[2]);
    wEcl(e, _ea); const R = Math.hypot(_ea[0], _ea[1], _ea[2]);
    let phaseAng = 0;
    if (r > 1e-6 && D > 1e-6) phaseAng = Math.acos(Math.max(-1, Math.min(1, (r*r + D*D - R*R)/(2*r*D))));
    const illum = (1 + Math.cos(phaseAng)) / 2;
    let mag = body === SUN ? -26.7 : (MAG[body.key] ? MAG[body.key](r, D, phaseAng/DEG) : null);
    const sizeAS = 2 * body.rkm / (D * AU_KM) / DEG * 3600;
    let elong = 0;
    if (body !== SUN) {
      const dp = -(_ge[0]*_ea[0] + _ge[1]*_ea[1] + _ge[2]*_ea[2]);   // 太陽の地心方向 = -地球日心
      elong = Math.acos(Math.max(-1, Math.min(1, dp/(D*R)))) / DEG;
    }
    // 出没・南中 (瞬時の赤経赤緯で近似)
    const Hn = ((H/DEG + 180) % 360 + 360) % 360 - 180;
    const transitMs = J2000 + simDays*DAY_MS - (Hn / RS_RATE) * 3600e3;
    const h0 = body === SUN ? -0.833 : (body.key === "moon" ? 0.125 : -0.567);
    const cosH0 = (Math.sin(h0*DEG) - Math.sin(lat)*Math.sin(dec)) / (Math.cos(lat)*Math.cos(dec));
    let rise = 0, set = 0, circ = 0;
    if (cosH0 < -1) circ = 1; else if (cosH0 > 1) circ = -1;
    else { const H0 = Math.acos(cosH0)/DEG; rise = transitMs - H0/RS_RATE*3600e3; set = transitMs + H0/RS_RATE*3600e3; }
    return { alt: alt/DEG, az, distAU: D, illum, mag, sizeAS, elong, transitMs, rise, set, circ };
  }
  const fmtHM = (ms) => { const d = new Date(ms); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); };
  function fmtGeoDist(au) {
    const km = au * AU_KM;
    const kmStr = distUnit === "mi" ? Math.round(km/KM_PER_MI).toLocaleString("en-US") + " mi"
                                    : Math.round(km).toLocaleString("en-US") + " km";
    return au.toFixed(3) + " au (" + kmStr + ")";
  }
  function obsContent(body) {
    const o = T().obs;
    if (body.key === "earth") return { rows: "", fact: o.earth };
    const c = computeObs(body);
    const dir = o.dirs[Math.round(c.az/45) % 8];
    const rows = [[o.loc, siteLabel()]];               // 観測地 (変更は地上ビューのチップから)
    rows.push([o.az, c.az.toFixed(0) + "° (" + dir + ")"]);
    rows.push([o.alt, c.alt.toFixed(1) + "°" + (c.alt < 0 ? " (" + o.below + ")" : "")]);
    const rs = (t, other) => c.circ === 1 ? o.noSet : c.circ === -1 ? o.noRise : fmtHM(t);
    rows.push([o.rise, rs(c.rise)]);
    rows.push([o.transit, fmtHM(c.transitMs)]);
    rows.push([o.set, rs(c.set)]);
    if (c.mag != null) rows.push([o.mag, (c.mag >= 0 ? "+" : "") + c.mag.toFixed(1)]);
    rows.push([o.phase, Math.round(c.illum*100) + "%"]);
    rows.push([o.size, c.sizeAS >= 120 ? (c.sizeAS/60).toFixed(1) + "′" : c.sizeAS.toFixed(1) + "″"]);
    if (body !== SUN) rows.push([o.elong, c.elong.toFixed(0) + "°"]);
    rows.push([o.dist, fmtGeoDist(c.distAU)]);
    return {
      rows: rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join(""),
      fact: c.alt >= 0 ? o.seenIn(dir, c.alt.toFixed(0)) : o.seenBelow,

  }

  const NAV_CATS = [
