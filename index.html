  const anisoExt = gl.getExtension("EXT_texture_filter_anisotropic") ||
                   gl.getExtension("WEBKIT_EXT_texture_filter_anisotropic") ||
                   gl.getExtension("MOZ_EXT_texture_filter_anisotropic");
  const anisoMax = anisoExt
    ? Math.min(8, gl.getParameter(anisoExt.MAX_TEXTURE_MAX_ANISOTROPY_EXT)) : 0;
  // 失敗の理由は端末によって違う (ファイルが無い / file:// のオリジン制限) ので、
  // 天体ごとに1回だけ理由を添えて出す
  const texWarn = (key, why) =>
    console.warn(`テクスチャ ${texURL(key)} を使えませんでした: ${why}` +
      (location.protocol === "file:" ? " — file:// では画像を読み込めません。HTTP で配信してください" : ""));
  // 既存のテクスチャオブジェクトへ読み直す。解像度を切り替えても GL の
  // ハンドルは変えないので、これを持っている描画側に手を入れる必要がない
  function loadTexInto(tex, key) {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    // ミップ付きのまま differing サイズを入れると、生成し直すまでの間だけ
    // 不完全なテクスチャ (真っ黒) になる。生成後に付け直すので一旦 LINEAR へ
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    const img = new Image();
    img.onload = () => {
      // file:// で開くと画像自体は読めても不透明オリジン扱いになり、ここが
      // SecurityError で落ちる。取り込めなかったぶんは仮色のまま描く
      try {
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
      } catch (e) {
        texWarn(key, e.message);
        return;
      }
      // MIN_FILTER をミップマップ付きにするのは生成した後 (先に変えると不完全な
      // テクスチャ扱いになり、真っ黒で描かれる)
      if (useMipmap && isPOT(img.width) && isPOT(img.height)) {
        gl.generateMipmap(gl.TEXTURE_2D);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        if (anisoMax > 1) gl.texParameterf(gl.TEXTURE_2D, anisoExt.TEXTURE_MAX_ANISOTROPY_EXT, anisoMax);
      }
    };
    // tex/ を index.html と一緒に置き忘れた場合にここへ来る
    img.onerror = () => texWarn(key, "取得できませんでした");
    img.src = texURL(key);
    return tex;
  }
  function loadTex(key) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    // 読み込み完了までの仮色
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, 1, 1, 0, gl.RGB, gl.UNSIGNED_BYTE, new Uint8Array([70, 70, 74]));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return loadTexInto(tex, key);
  }
  for (const key in TEXTURES) texByKey.set(key, loadTex(key));
  // 地球の雲と夜景。天体テクスチャとは別のユニットに常駐させる
  const cloudTex = loadTex("cloud");
  const nightTex = loadTex("night");
  // 天の川。読み込み前・失敗時は真っ黒にしておく — 加算合成なので何も足されない。
  // loadTex の仮色 (灰色) のままだと、空全体がうっすら明るくなってしまう
  const mwTex = loadTex("milkyway");
  gl.bindTexture(gl.TEXTURE_2D, mwTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, 1, 1, 0, gl.RGB, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0]));
  // 法線図。天体ごとに差し替わるので、地表テクスチャと同じくキーで引く
  const nrmByKey = new Map();
  for (const key in NORMALS) nrmByKey.set(key, loadTex("nrm:" + key));
  // サンプラーとテクスチャユニットの指定は bodyRenderer.beginPass が毎回行う

  // 解像度を切り替えたときの読み直し。差し替わるまでは前の解像度で描き続ける
  // (仮色へ戻すと、切り替えのたびに全天体が一瞬グレーになる)
  function reloadTextures() {
    for (const [key, tex] of texByKey) loadTexInto(tex, key);
    loadTexInto(cloudTex, "cloud");
    loadTexInto(nightTex, "night");
    loadTexInto(mwTex, "milkyway");
    for (const [key, tex] of nrmByKey) loadTexInto(tex, "nrm:" + key);
  }

  // ---------- 土星の環の半径プロファイル ----------
  // RING_KNOTS (実測の半径・光学的厚さ・色) を線形に繋いで 1次元テクスチャへ。
  // アルファには τ ではなく透過率 exp(-τ) を入れる。τ をそのまま 8bit に
  // 入れると、エンケの間隙 (τ=0.02) のような薄いところが 1段階で潰れるため
  const RING_TEX_W = 2048;
  const ringTex = gl.createTexture();
  {
    const px = new Uint8Array(RING_TEX_W * 4);
    let k = 0;
    for (let i = 0; i < RING_TEX_W; i++) {
      const r = RING_R0 + (RING_R1 - RING_R0) * (i + 0.5) / RING_TEX_W;
      while (k < RING_KNOTS.length - 2 && r > RING_KNOTS[k + 1][0]) k++;
      const a0 = RING_KNOTS[k], a1 = RING_KNOTS[k + 1];
      const t = Math.max(0, Math.min(1, (r - a0[0]) / ((a1[0] - a0[0]) || 1)));
      const o = i * 4;
      for (let c = 0; c < 3; c++) {
        px[o + c] = Math.round(255 * (a0[c + 2] + (a1[c + 2] - a0[c + 2]) * t));
      }
      px[o + 3] = Math.round(255 * Math.exp(-(a0[1] + (a1[1] - a0[1]) * t)));
    }
    gl.bindTexture(gl.TEXTURE_2D, ringTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, RING_TEX_W, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, px);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }

  // ---------- 星空 ----------
  // 宇宙ビューの背景恒星。以前は乱数配置の装飾だったが、現在はヨール輝星
  // 星表の実位置を使う (バッファ生成は恒星カタログ定義の直後で行う)
  let seed = 7;
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  let N_STAR = 0;
  let starVB = null;
  let STAR_W = null;   // 恒星のワールド単位方向 (観測者フレーム投影用, N_STAR×3)

  // ---------- 小惑星帯 ----------
  const N_AST = 1600;
  const asts = [];
  for (let i = 0; i < N_AST; i++) {
    asts.push({
      a: 2.15 + rnd() * 1.15,
      th: rnd() * 2 * Math.PI,
      inc: (rnd() - 0.5) * 0.30,
      node: rnd() * 2 * Math.PI,
      T: 0,
    });
    asts[i].T = 365.256 * Math.pow(asts[i].a, 1.5);
  }
  const astArr = new Float32Array(N_AST * 7);
  const astVB = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, astVB);
  gl.bufferData(gl.ARRAY_BUFFER, astArr.byteLength, gl.DYNAMIC_DRAW);

  // 惑星マーカー (遠距離でも見える点)
  const markArr = new Float32Array((PLANETS.length + 1 + SATELLITES.length) * 7);
  const markVB = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, markVB);
  gl.bufferData(gl.ARRAY_BUFFER, markArr.byteLength, gl.DYNAMIC_DRAW);

  // ---------- 軌道線 ----------
  //   折れ線近似の矢高 (弦と真の楕円の距離 ≈ R(2π/N)²/8) が天体半径の3割以下に
  //   なるよう軌道ごとに分割数を決める。サンプルは離心近点角の等分 (幾何的に均等)。
  //   頂点はアンカー (基準点) 相対で焼き込む。太陽中心の生座標のままだと f32 の
  //   量子化誤差が「太陽からの距離 × 1e-7」(外縁部で数百km) になり、外縁天体に
  //   接近した際に線がぶれるため。カメラがアンカーから離れすぎたら焼き直す。
  const orbitVBs = PLANETS.map(() => gl.createBuffer());
  const ORB_ANCHOR = [0, 0, 0];
  function rebuildOrbits(ax, ay, az) {
    ORB_ANCHOR[0] = ax; ORB_ANCHOR[1] = ay; ORB_ANCHOR[2] = az;
    const v = [0, 0, 0];
    const w = [0, 0, 0];
    PLANETS.forEach((p, pi) => {
      const R = mapRadius(p.a * (1 + p.e));
      const n = Math.min(12288, Math.max(512,
        Math.ceil(2 * Math.PI * Math.sqrt(R / (8 * 0.3 * bodyR(p))))));
      p.orbN = n;
      const arr = p.orbArr || (p.orbArr = new Float32Array((n + 1) * 3));
      const be = p.a * Math.sqrt(1 - p.e * p.e);
      for (let i = 0; i <= n; i++) {
        const E = 2 * Math.PI * i / n;
        const xo = p.a * (Math.cos(E) - p.e);
        const yo = be * Math.sin(E);
        v[0] = p.m[0] * xo + p.m[1] * yo;
        v[1] = p.m[2] * xo + p.m[3] * yo;
        v[2] = p.m[4] * xo + p.m[5] * yo;
        toWorld(v, w);
        arr[i*3] = w[0] - ax; arr[i*3+1] = w[1] - ay; arr[i*3+2] = w[2] - az;
      }
      gl.bindBuffer(gl.ARRAY_BUFFER, orbitVBs[pi]);
      gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW);
    });
  }
  rebuildOrbits(0, 0, 0);

  // 選択天体の軌道の高精細パッチ (接近時、粗い折れ線の矢高で軌道から
  // 天体がずれて見えるのを、現在位置の近傍だけ毎フレーム引き直して補正)
  const PATCH_N = 1024;
  const patchArr = new Float32Array((PATCH_N + 1) * 3);
  const patchVB = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, patchVB);
  gl.bufferData(gl.ARRAY_BUFFER, patchArr.byteLength, gl.DYNAMIC_DRAW);

  // 衛星軌道の単位円 (XZ 平面。基底・スケール・平行移動は描画時のモデル行列で適用)
  const SAT_ORB_N = 512;
  const satOrbVB = gl.createBuffer();
  {
    const arr = new Float32Array((SAT_ORB_N + 1) * 3);
    for (let i = 0; i <= SAT_ORB_N; i++) {
      const t = i / SAT_ORB_N * 2 * Math.PI;
      arr[i*3] = Math.cos(t);
      arr[i*3+1] = 0;
      arr[i*3+2] = Math.sin(t);
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, satOrbVB);
    gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW);
  }
  // 月の軌道線は ELP 理論から現在時刻の前後1周期ぶんをサンプリングして描く
  // (単純な円だと ELP による実位置と食い違うため。地心ワールドオフセットで格納)
  const MOON_ORB_N = 160;
  const moonOrbBuf = new Float32Array((MOON_ORB_N + 1) * 3);
  let moonOrbVB = null;

  // 自転軸線 (単位球基準, モデル行列で天体半径にスケール)
  const AXIS_LEN = 1.55;
  const axisVB = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, axisVB);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, -AXIS_LEN, 0, 0, AXIS_LEN, 0]), gl.STATIC_DRAW);



  // ---------- 探査機のメッシュ ----------
  // base64 → 型付き配列。位置は Int16 (最大寸法 32000) なので、シェーダへ渡す前に
  // 単位長へ戻しておく (モデル行列側で実サイズを掛ける)
  function b64ToBytes(s) {
    const bin = atob(s), n = bin.length, out = new Uint8Array(n);
    for (let i = 0; i < n; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  const meshByKey = new Map();
  for (const key in PROBE_MESHES) {
    const m = PROBE_MESHES[key];
    const qb = b64ToBytes(m.v), ib = b64ToBytes(m.i);
    const q = new Int16Array(qb.buffer, qb.byteOffset, qb.byteLength / 2);
    const pos = new Float32Array(q.length);
    for (let i = 0; i < q.length; i++) pos[i] = q[i] / 32000;
    const vb = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vb);
    gl.bufferData(gl.ARRAY_BUFFER, pos, gl.STATIC_DRAW);
    const ib2 = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib2);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,
      new Uint16Array(ib.buffer, ib.byteOffset, ib.byteLength / 2), gl.STATIC_DRAW);
    meshByKey.set(key, { vb: vb, ib: ib2, n: m.t * 3 });
  }
  //#endregion
  //#region src/gl/post.js

  // ---------- Bloom (明るいところの滲み) ----------
  // シーンは既定のフレームバッファへ描いたまま、描き終わってから
  // copyTexSubImage2D で取り込む。オフスクリーンへ描くと MSAA (canvas の
  // antialias) が効かなくなり、軌道線や天体の輪郭がギザギザになるため。
  //
  // 取り込む → しきい値で明るいところだけ抜きつつ 1/4 に縮小 → 横と縦に
  // ぼかす → 画面へ加算。UI と天体名は別のキャンバスなので最初から対象外
  const BLOOM_DIV = 4;
  const BLOOM_THRESH = 0.72;   // これ以下の明るさは滲ませない
  const BLOOM_AMOUNT = 0.45;   // 戻すときの強さ

  let bloomOn = localStorage.getItem("ssBloom") !== "0";   // 既定 ON
  let bloomReady = false;      // 確保に失敗した端末では以後あきらめる
  let bloomFailed = false;
  let bloomSrcW = 0, bloomSrcH = 0, bloomW = 0, bloomH = 0;
  let sceneTex = null;
  const bloomTex = [null, null], bloomFB = [null, null];

  // 画面いっぱいを覆う三角形1枚
  const postVB = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, postVB);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

  // fmt: 画面の取り込み先は RGB でなければならない。canvas を alpha:false で
  // 作っているので既定のフレームバッファにアルファが無く、RGBA へ
  // copyTexSubImage2D すると INVALID_OPERATION になる。
  // ぼかし用はレンダーターゲットなので、確実に描ける RGBA にする
  function postTex(w, h, fmt) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, fmt, w, h, 0, fmt, gl.UNSIGNED_BYTE, null);
    // 2の累乗とは限らないので、ミップマップと REPEAT は使えない
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }

  // 画面寸法が変わったら作り直す。resize() から呼ぶと初期化順に縛られるので、
  // 描く直前に自分で見に行く
  function bloomTargets() {
    if (bloomFailed) return false;
    const w = glc.width, h = glc.height;
    if (w < 8 || h < 8) return false;
    if (bloomReady && w === bloomSrcW && h === bloomSrcH) return true;
    for (const t of [sceneTex, bloomTex[0], bloomTex[1]]) if (t) gl.deleteTexture(t);
    for (const f of bloomFB) if (f) gl.deleteFramebuffer(f);
    bloomSrcW = w; bloomSrcH = h;
    bloomW = Math.max(2, Math.floor(w / BLOOM_DIV));
    bloomH = Math.max(2, Math.floor(h / BLOOM_DIV));
    sceneTex = postTex(w, h, gl.RGB);
    for (let i = 0; i < 2; i++) {
      bloomTex[i] = postTex(bloomW, bloomH, gl.RGBA);
      bloomFB[i] = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFB[i]);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, bloomTex[i], 0);
      if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        bloomFailed = true;
        console.warn("Bloom 用のフレームバッファを作れませんでした。無効にします");
        return false;
      }
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    bloomReady = true;
    return true;
  }

  // 三角形を1枚描く。プログラムごとに aPos の場所が違うので毎回張り直す
  function postDraw(p) {
    gl.enableVertexAttribArray(p.a.aPos);
    gl.vertexAttribPointer(p.a.aPos, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.disableVertexAttribArray(p.a.aPos);
  }

  // シーンを描き終えたあとに呼ぶ
  function bloomPass() {
    if (!bloomOn || !bloomTargets()) return;
    const w = bloomSrcW, h = bloomSrcH;

    gl.disable(gl.DEPTH_TEST);
    gl.depthMask(false);
    gl.disable(gl.BLEND);
    gl.disable(gl.CULL_FACE);
    gl.bindBuffer(gl.ARRAY_BUFFER, postVB);
    gl.activeTexture(gl.TEXTURE0);

    // 1) 画面をテクスチャへ取り込む
    gl.bindTexture(gl.TEXTURE_2D, sceneTex);
    gl.copyTexSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 0, 0, w, h);

    // 2) 明るいところを抜きながら 1/4 へ
    gl.viewport(0, 0, bloomW, bloomH);
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFB[0]);
    gl.useProgram(threshP.pr);
    gl.uniform1i(threshP.u.uTex, 0);
    gl.uniform2f(threshP.u.uTexel, 1 / w, 1 / h);
    // 明るい昼の空では、空そのものが 0.72 を超えて広い範囲が滲みに拾われる。
    // 目は明るい場面では露出を絞るので、空が丸ごと光るのはおかしい。
    // 空の明るさぶんしきい値を持ち上げ、太陽の芯だけを滲ませる
    gl.uniform1f(threshP.u.uThresh, Math.min(0.96, BLOOM_THRESH + skyDayF * 0.24));
    postDraw(threshP);

    // 3) 横 → 縦の順にぼかす (bloomFB[0] → [1] → [0])
    gl.useProgram(blurP.pr);
    gl.uniform1i(blurP.u.uTex, 0);
    for (let i = 0; i < 2; i++) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFB[1 - i]);
      gl.bindTexture(gl.TEXTURE_2D, bloomTex[i]);
      if (i === 0) gl.uniform2f(blurP.u.uDir, 1 / bloomW, 0);
      else gl.uniform2f(blurP.u.uDir, 0, 1 / bloomH);
      postDraw(blurP);
    }

    // 4) 画面へ加算して戻す
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, w, h);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(addP.pr);
    gl.bindTexture(gl.TEXTURE_2D, bloomTex[0]);
    gl.uniform1i(addP.u.uTex, 0);
    gl.uniform1f(addP.u.uAmount, BLOOM_AMOUNT);
    postDraw(addP);

    gl.disable(gl.BLEND);
    gl.enable(gl.DEPTH_TEST);
    gl.depthMask(true);
  }
  //#endregion
  //#region src/core/state.js
  // ---------- 状態 ----------
  let W = 0, H = 0, DPR = 1;
  let simDays = (Date.now() - J2000) / DAY_MS;
  let playing = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let daysPerSec = 8;
  let selected = null;                    // SUN / PLANETS[i] / MOON / null
  let lastCenter = null;                   // 最後に中心にした天体 (解除後のズーム下限に使用)
  // 選択マーク (オレンジのリングとラベル強調) を出すか。ガイドツアーの selected は
  // 「カメラの注視先」であって利用者が選んだわけではないので、既定では出さない
  let showSelMark = true;
  // ガイドツアー実行中。シーンを壊す操作 (天体の選択・再生の切替) を止めるのに使う
  let tourActive = false;
  // ツアーの視線ガイド。注視天体からこの天体へ向かう破線をオーバーレイに描く
  let tourSight = null;
  // ツアーの注目天体。選択とは別に、名前と輪郭を強調して見つけやすくする
  let tourSpot = null;
  // 探査機ツアー中はここに挙げた機体だけを描く (他機が混ざると主役が分からない)。
  // tourProbe はその主役 = 既定で乗る機体、tourRideOn はその回に乗る機体
  let tourProbes = null;
  let tourProbe = null;

    const h00 = 2*u3 - 3*u2 + 1, h10 = u3 - 2*u2 + u, h01 = -2*u3 + 3*u2, h11 = u3 - u2;
    for (let k = 0; k < 3; k++) {
      // 接線は前後の経由点からの差分を時間で正規化する
      const m1 = (p2.au[k] - p0.au[k]) / ((p2.t - p0.t) || 1) * dt;
      const m2 = (p3.au[k] - p1.au[k]) / ((p3.t - p1.t) || 1) * dt;
      out[k] = h00 * p1.au[k] + h10 * m1 + h01 * p2.au[k] + h11 * m2;
    }
    return out;
  }

  // 軌跡の線。経由点は固定なので起動時に一度だけ焼く。区間ごとに等時間で刻む —
  // 全体を通して等時間にすると、32年ある離脱区間に点が集中して、惑星まわりの
  // 折れ曲がり (見せたい部分) が数点に潰れてしまう
  {
    const PATH_SEG = 48;
    const au = [0, 0, 0], w = [0, 0, 0];
    for (const pr of PROBES) {
      const legs = pr.pts.length - 1;
      const n = legs * PATH_SEG + 1;
      pr.path = new Float32Array(n * 3);
      pr.pathT = new Float64Array(n);
      let i = 0;
      for (let g = 0; g < legs; g++) {
        const t0 = pr.pts[g].t, t1 = pr.pts[g + 1].t;
        const last = g === legs - 1 ? PATH_SEG : PATH_SEG - 1;
        for (let s = 0; s <= last; s++) {
          const t = t0 + (t1 - t0) * (s / PATH_SEG);
          toWorld(probeAU(pr, t, au), w);
          pr.path[i * 3] = w[0]; pr.path[i * 3 + 1] = w[1]; pr.path[i * 3 + 2] = w[2];
          pr.pathT[i] = t;
          i++;
        }
      }
    }
  }

  function updatePositions() {
    const tmp = [0, 0, 0];
    for (const p of PLANETS) {
      keplerAU(p, simDays, tmp);
      posAU.get(p.key)[0] = tmp[0]; posAU.get(p.key)[1] = tmp[1]; posAU.get(p.key)[2] = tmp[2];
      toWorld(tmp, posW.get(p.key));
    }
    // 衛星 (母天体中心, 実距離)。月のみ短縮 ELP 理論、他は円軌道近似
    for (const s of SATELLITES) {
      const par = posW.get(s.parent);
      const w = posW.get(s.key);
      if (s === MOON) {
        moonGeoEclKm(simDays, tmp);
        w[0] = par[0] + tmp[0] * KM2W;      // 黄道 → ワールド (toWorld と同じ軸対応)
        w[1] = par[1] + tmp[2] * KM2W;
        w[2] = par[2] - tmp[1] * KM2W;
        continue;
      }
      const r = s.aKm * KM2W;
      const th = s.dir * 2 * Math.PI * simDays / s.T + s.ph;
      const lx = Math.cos(th) * r, lz = Math.sin(th) * r;
      w[0] = par[0] + s.M[0] * lx + s.M[8] * lz;
      w[1] = par[1] + s.M[1] * lx + s.M[9] * lz;
      w[2] = par[2] + s.M[2] * lx + s.M[10] * lz;
    }
    // 探査機
    for (const pr of PROBES) {
      pr.live = !!probeAU(pr, simDays, tmp);
      if (!pr.live) continue;
      const a = posAU.get(pr.key);
      a[0] = tmp[0]; a[1] = tmp[1]; a[2] = tmp[2];
      toWorld(tmp, posW.get(pr.key));
    }
  }

  function minDist() {
    // 解除後も最後に中心だった天体のサイズを下限に使う (解除時に太陽サイズの下限へ
    // 跳ね上がってズームが一気に引かれるのを防ぐ)。中心が太陽/原点のときは太陽サイズ。
    const b = selected || lastCenter;
    return b && b !== SUN ? bodyR(b) * 1.7 : bodyR(SUN) * 2.2;
  }

  //#endregion
  //#region src/core/eclipse.js
  // ============================================================
  // 食 (球の影)
  //   太陽 – 遮蔽体 – 被照射体 が一直線に並ぶと、被照射体の表面から見た太陽面が
  //   遮蔽体に食われる。月食 (地球の影に入る月)・日食 (地球へ落ちる月の影)・
  //   木星面を渡るガリレオ衛星の影は、どれも同じ1つの計算で出る。
  //
  //   遮蔽の量は「その点から見て太陽面の何割が隠れたか」なので、面積の計算は
  //   画素ごとにシェーダ (body.frag) で解く。ここが決めるのは「どの天体を
  //   遮蔽体として渡すか」だけ — 太陽系のどの天体も、影を落としうる相手は
  //   同じ系の中の数個しかない。
  // ============================================================

  // 2円 (太陽面と遮蔽体) の重なり。返すのは太陽面が隠れた割合 0〜1。
  // sep = 中心どうしの離角、rs = 太陽の視半径、ro = 遮蔽体の視半径 [rad]
  function diskCoverage(sep, rs, ro) {
    if (sep >= rs + ro) return 0;              // 触れていない
    if (sep <= ro - rs) return 1;              // 皆既 (太陽が完全に隠れる)
    if (sep <= rs - ro) return (ro * ro) / (rs * rs);   // 金環 (遮蔽体が太陽面の中)
    const ca = Math.max(-1, Math.min(1, (sep*sep + rs*rs - ro*ro) / (2*sep*rs)));
    const cb = Math.max(-1, Math.min(1, (sep*sep + ro*ro - rs*rs) / (2*sep*ro)));
    const area = rs*rs * (Math.acos(ca) - ca * Math.sqrt(Math.max(0, 1 - ca*ca)))
               + ro*ro * (Math.acos(cb) - cb * Math.sqrt(Math.max(0, 1 - cb*cb)));
    return Math.min(1, area / (Math.PI * rs * rs));
  }

  // 皆既月食の赤銅色。本影の中へ届くのは、地球の大気を回り込むあいだに青を
  // 散乱で失った赤い光だけ。実際の明るさは満月の 1万分の1ほどで、そのまま
  // 出すと画面上は真っ黒になる — 同じ画面の中で「満月よりはっきり暗い赤」に
  // 見える値を置いている (リニア。照明の係数なのでトーンマップの前に効く)
  const ECL_REFRACT = [0.85, 0.185, 0.065];
  const ECL_NO_AIR = [0, 0, 0];

  // 遮蔽体になりうる相手。惑星には自分の衛星が、衛星には母惑星と兄弟の衛星が影を落とす
  const ECL_CAND = new Map();
  {
    const byParent = new Map();
    for (const s of SATELLITES) {
      if (!byParent.has(s.parent)) byParent.set(s.parent, []);
      byParent.get(s.parent).push(s);
    }
    for (const p of PLANETS) {
      const kids = byParent.get(p.key);
      if (kids && kids.length) ECL_CAND.set(p, kids);
    }
    for (const s of SATELLITES) {
      const par = PLANETS.find((p) => p.key === s.parent);
      const sib = (byParent.get(s.parent) || []).filter((x) => x !== s);
      const cands = par ? [par].concat(sib) : sib;
      if (cands.length) ECL_CAND.set(s, cands);
    }
  }

  // 天体キー → その天体を照らす太陽面を隠している遮蔽体 (無ければ null)。
  //   cw     遮蔽体の中心 (ワールド。posW の配列をそのまま指す)
  //   r      遮蔽体の半径 (ワールド)
  //   sunAng その天体から見た太陽の視半径 [rad]
  //   col    皆既のとき届く屈折光 (リニア)。大気の無い遮蔽体は 0
  const eclipseByKey = new Map();

  function updateEclipses() {
    const Rsun = bodyR(SUN);
    for (const [b, cands] of ECL_CAND) {
      eclipseByKey.set(b.key, null);
      const w = posW.get(b.key);
      const ds = Math.hypot(w[0], w[1], w[2]);      // 太陽はワールド原点にある
      if (ds < 1e-12) continue;
      const rs = Math.asin(Math.min(1, Rsun / ds));
      const lx = -w[0] / ds, ly = -w[1] / ds, lz = -w[2] / ds;   // 天体 → 太陽
      const rb = bodyR(b);
      let best = null, bestSlack = 0;
      for (const c of cands) {
        const cw = posW.get(c.key);
        const dx = cw[0] - w[0], dy = cw[1] - w[1], dz = cw[2] - w[2];
        const d = Math.hypot(dx, dy, dz);
        if (d < 1e-12 || d >= ds) continue;         // 太陽より遠い側からは影が届かない
        const cos = (dx * lx + dy * ly + dz * lz) / d;
        if (cos <= 0) continue;                     // 太陽と反対側
        const sep = Math.acos(Math.max(-1, Math.min(1, cos)));
        const ro = Math.asin(Math.min(1, bodyR(c) / d));
        // 天体には広がりがあるので、中心では外れていても縁が影に入ることがある。
        // 表面の点で離角がずれる量は最大 rb/d [rad] なので、そのぶん広く採る
        const slack = (rs + ro + rb / d) - sep;
        if (slack <= 0) continue;
        if (slack > bestSlack) { bestSlack = slack; best = c; }
      }
      if (!best) continue;
      eclipseByKey.set(b.key, {
        cw: posW.get(best.key), r: bodyR(best), sunAng: rs,
        col: best.air ? ECL_REFRACT : ECL_NO_AIR,
      });
    }
  }
  const eclipseFor = (b) => eclipseByKey.get(b.key) || null;
  //#endregion
  //#region src/core/events.js
  // ============================================================
  // 天文イベントの探索
  //   位置計算 (keplerAU / moonGeoEclKm) は時刻を引数に取る純粋な関数なので、
  //   表示中の時刻を触らずに未来を先読みできる。ここでは時間方向に粗く走査して
  //   「符号が変わったところ」「極値」を拾い、二分法で詰める。
  //
  //   ここが返すのは日時と種別だけで、絵は既存のビューに任せる (イベントを
  //   選ぶと、その日時・その天体・そのビューへ飛ぶ)。
  //
  //   注意: 観測地 (obsLat/obsLon) と ECL・gmstDeg は ui/observe.js の値を
  //   実行時に借りている。この断片のトップレベルでは触らない
  // ============================================================
  const EV_TWO_PI = 2 * Math.PI;
  const EARTH_B = PLANETS.find((p) => p.key === "earth");
  const EV_RE_KM = 6378.14;                    // 観測地の視差に使う地球半径
  const evWrap = (a) => {                      // 角度差を (-π, π] へ畳む
    a = (a + Math.PI) % EV_TWO_PI;
    return (a < 0 ? a + EV_TWO_PI : a) - Math.PI;
  };
  const evAng = (a, b) => {                    // 2つのベクトルのなす角 [rad]
    const la = Math.hypot(a[0], a[1], a[2]), lb = Math.hypot(b[0], b[1], b[2]);
    if (la < 1e-12 || lb < 1e-12) return 0;
    const c = (a[0]*b[0] + a[1]*b[1] + a[2]*b[2]) / (la * lb);
    return Math.acos(Math.max(-1, Math.min(1, c)));
  };
  const _evA = [0,0,0], _evB = [0,0,0], _evC = [0,0,0], _evD = [0,0,0], _evE = [0,0,0];

  // 地心黄道ベクトル [AU]。out に書いて返す (out へ _evD は渡さないこと)
  function evGeo(b, t, out) {
    if (b === MOON) {
      moonGeoEclKm(t, out);
      out[0] /= AU_KM; out[1] /= AU_KM; out[2] /= AU_KM;
      return out;
    }
    keplerAU(EARTH_B, t, _evD);
    if (b === SUN) {
      out[0] = -_evD[0]; out[1] = -_evD[1]; out[2] = -_evD[2];
      return out;
    }
    keplerAU(b, t, out);
    out[0] -= _evD[0]; out[1] -= _evD[1]; out[2] -= _evD[2];
    return out;
  }
  const evLon = (b, t, tmp) => { evGeo(b, t, tmp); return Math.atan2(tmp[1], tmp[0]); };

  // f(t) = 0 を二分法で詰める (t0 と t1 で符号が違うこと)。返すのは日。
  // 32回で 1日の区間が 2e-8 秒まで縮むので、位置計算の精度より十分細かい
  function evRoot(f, t0, t1) {
    let a = t0, b = t1, fa = f(a);
    for (let i = 0; i < 32; i++) {
      const m = (a + b) / 2, fm = f(m);
      if ((fm < 0) === (fa < 0)) { a = m; fa = fm; } else { b = m; }
    }
    return (a + b) / 2;
  }
  // g(t) の極大を三分探索で詰める (1回で区間が 2/3 になる)
  function evPeak(g, t0, t1) {
    let a = t0, b = t1;
    for (let i = 0; i < 32; i++) {
      const m1 = a + (b - a) / 3, m2 = b - (b - a) / 3;
      if (g(m1) < g(m2)) a = m1; else b = m2;
    }
    return (a + b) / 2;
  }

  // ---------- 観測地からの見え方 ----------
  // 観測地の日心黄道位置 [AU] (地心ではなく地表の点。日食は 1° 近く変わる)
  function evObsHelio(t, out) {
    keplerAU(EARTH_B, t, out);
    const lst = (((280.46061837 + 360.98564736629 * t) % 360 + 360) % 360 + obsLon) * DEG;
    const la = obsLat * DEG, RE = EV_RE_KM / AU_KM;
    const ox = Math.cos(la) * Math.cos(lst), oy = Math.cos(la) * Math.sin(lst), oz = Math.sin(la);
    out[0] += RE * ox;
    out[1] += RE * (oy * Math.cos(ECL) + oz * Math.sin(ECL));   // 赤道 → 黄道
    out[2] += RE * (-oy * Math.sin(ECL) + oz * Math.cos(ECL));
    return out;
  }
  // 観測地から見た天体の高度 [rad]。天頂方向は「地心 → 観測地」そのもの
  function evAlt(b, t) {
    evObsHelio(t, _evA);
    keplerAU(EARTH_B, t, _evC);
    const ux = _evA[0]-_evC[0], uy = _evA[1]-_evC[1], uz = _evA[2]-_evC[2];
    const ul = Math.hypot(ux, uy, uz) || 1;
    evGeo(b, t, _evB);
    const tx = _evB[0]-ux, ty = _evB[1]-uy, tz = _evB[2]-uz;
    const tl = Math.hypot(tx, ty, tz) || 1;
    return Math.asin(Math.max(-1, Math.min(1, (tx*ux + ty*uy + tz*uz) / (tl * ul))));
  }

  // 観測地から見て太陽面が月に隠されている割合 (0〜1) と食分
  function evSolarLocal(t) {
    evObsHelio(t, _evA);                         // 観測地 (日心)
    moonGeoEclKm(t, _evB);
    keplerAU(EARTH_B, t, _evC);
    const mx = _evC[0] + _evB[0]/AU_KM - _evA[0],   // 観測地 → 月
          my = _evC[1] + _evB[1]/AU_KM - _evA[1],
          mz = _evC[2] + _evB[2]/AU_KM - _evA[2];
    const sx = -_evA[0], sy = -_evA[1], sz = -_evA[2];   // 観測地 → 太陽
    const dm = Math.hypot(mx, my, mz), ds = Math.hypot(sx, sy, sz);
    const rs = Math.asin(Math.min(1, SUN.rkm / (ds * AU_KM)));
    const ro = Math.asin(Math.min(1, MOON.rkm / (dm * AU_KM)));
    const sep = Math.acos(Math.max(-1, Math.min(1, (mx*sx + my*sy + mz*sz) / (dm * ds))));
    return {
      cov: diskCoverage(sep, rs, ro),
      // 食分 = 太陽の直径のうち隠れた割合。1 以上で皆既 (金環は 1 に届かない)
      mag: Math.max(0, (rs + ro - sep) / (2 * rs)),
      annular: ro < rs,
    };
  }

  // 月が地球の本影・半影のどこにいるか。covMin/covMax は月面の最も浅い点と
  // 最も深い点で「太陽面が隠れた割合」を見たもの
  function evLunar(t) {
    keplerAU(EARTH_B, t, _evA);
    moonGeoEclKm(t, _evB);
    const mx = _evA[0] + _evB[0]/AU_KM, my = _evA[1] + _evB[1]/AU_KM, mz = _evA[2] + _evB[2]/AU_KM;
    const ds = Math.hypot(mx, my, mz);                       // 月 → 太陽
    const ex = _evA[0]-mx, ey = _evA[1]-my, ez = _evA[2]-mz;  // 月 → 地球
    const de = Math.hypot(ex, ey, ez);
    const rs = Math.asin(Math.min(1, SUN.rkm / (ds * AU_KM)));
    const ro = Math.asin(Math.min(1, EARTH_B.rkm / (de * AU_KM)));
    const sep = Math.acos(Math.max(-1, Math.min(1, (-(ex*mx + ey*my + ez*mz)) / (de * ds))));
    const shift = MOON.rkm / (de * AU_KM);                    // 月の縁での離角のずれ
    return {
      sep,                                                     // 影の軸からの離角
      covMax: diskCoverage(Math.max(0, sep - shift), rs, ro),  // いちばん深く入る点
      covMin: diskCoverage(sep + shift, rs, ro),               // いちばん浅い点
    };
  }

  // ---------- 走査 ----------
  // t0 から days 日ぶんのイベントを日時順に返す。
  //   { t: 日, kind: 種別, key: 天体キー, view: "ground"|"space", data: {…} }
  function findEvents(t0, days) {
    const out = [];
    const t1 = t0 + days;
    const tmp = [0,0,0];
    const lonSun = (t) => evLon(SUN, t, tmp);
    const push = (e) => { if (e.t >= t0 && e.t <= t1) out.push(e); };

    // ---- 朔望 (新月・満月)。同時に食も調べる ----
    {
      const dl = (t) => evWrap(evLon(MOON, t, tmp) - lonSun(t));
      let pa = dl(t0);
      for (let t = t0; t < t1; t += 1) {
        const tb = Math.min(t + 1, t1), pb = dl(tb);
        // 新月: 差が −π 側から +π 側へ 0 をまたぐ (π のまたぎと区別する)。
        // 新月そのものは一覧に出さない (空に見えるものが無い) — 日食の起点にだけ使う
        if (pa < 0 && pb >= 0 && pb - pa < Math.PI) {
          const ec = evSolarSearch(evRoot(dl, t, tb));
          if (ec) push(ec);
        }
        // 満月: 差が π をまたぐ (evWrap の値が +π 付近から −π 付近へ飛ぶ)
        if (pa > 0 && pb < 0 && pa - pb > Math.PI) {
          const g = (t2) => evWrap(evLon(MOON, t2, tmp) - lonSun(t2) - Math.PI);
          const tf = evRoot(g, t, tb);
          push({ t: tf, kind: "fullmoon", key: "moon", view: "ground" });
          const ec = evLunarSearch(tf);
          if (ec) push(ec);
        }
        pa = pb;
      }
    }

    // ---- 衝 (外惑星)。地球を挟んで太陽の反対に来る = 一晩中見える ----
    // 太陽の見かけの動きのほうが速いので、離角は減る向きに 180° を通る。
    // 向きを決め打ちせず、|変化| が π 未満の符号反転だけを拾う (π 未満に
    // 限るのは、evWrap の折り返しを 0 の通過と取り違えないため)
    for (const k of ["mars", "jupiter", "saturn", "uranus", "neptune"]) {
      const b = PLANETS.find((p) => p.key === k);
      const f = (t) => evWrap(evLon(b, t, tmp) - lonSun(t) - Math.PI);
      let pa = f(t0);
      for (let t = t0; t < t1; t += 2) {
        const tb = Math.min(t + 2, t1), pb = f(tb);
        if ((pa < 0) !== (pb < 0) && Math.abs(pb - pa) < Math.PI) {
          push({ t: evRoot(f, t, tb), kind: "opposition", key: k, view: "ground" });
        }
        pa = pb;
      }
    }

    // ---- 最大離角 (水星・金星)。太陽から最も離れる = いちばん見つけやすい ----
    for (const k of ["mercury", "venus"]) {
      const b = PLANETS.find((p) => p.key === k);
      const el = (t) => { evGeo(b, t, _evE); evGeo(SUN, t, tmp); return evAng(_evE, tmp); };
      let e0 = el(t0 - 2), e1 = el(t0);
      for (let t = t0; t < t1; t += 2) {
        const tb = Math.min(t + 2, t1), e2 = el(tb);
        if (e1 > e0 && e1 >= e2) {
          const tp = evPeak(el, t - 2, tb);
          evGeo(b, tp, _evE);
          const east = evWrap(Math.atan2(_evE[1], _evE[0]) - lonSun(tp)) > 0;
          push({ t: tp, kind: "elongation", key: k, view: "ground",
                 data: { deg: el(tp) / DEG, east } });
        }
        e0 = e1; e1 = e2;
      }
    }

    // ---- 惑星どうしの接近 ----
    {
      const keys = ["mercury", "venus", "mars", "jupiter", "saturn"];
      const bs = keys.map((k) => PLANETS.find((p) => p.key === k));
      for (let i = 0; i < bs.length; i++) {
        for (let j = i + 1; j < bs.length; j++) {
          const sep = (t) => { evGeo(bs[i], t, _evE); evGeo(bs[j], t, tmp); return evAng(_evE, tmp); };
          let s0 = sep(t0 - 1), s1 = sep(t0);
          for (let t = t0; t < t1; t += 1) {
            const tb = Math.min(t + 1, t1), s2 = sep(tb);
            if (s1 < s0 && s1 <= s2) {
              const tp = evPeak((t2) => -sep(t2), t - 1, tb);
              const d = sep(tp) / DEG;
              // 太陽に近すぎるものは並んでも見えないので落とす
              evGeo(bs[i], tp, _evE); evGeo(SUN, tp, tmp);
              if (d < 1.5 && evAng(_evE, tmp) / DEG > 15) {
                push({ t: tp, kind: "conjunction", key: keys[i], view: "ground",
                       data: { with: keys[j], deg: d } });
              }
            }
            s0 = s1; s1 = s2;
          }
        }
      }
    }

    // ---- 流星群の極大 (太陽黄経が決まった値になる瞬間) ----
    for (const s of SHOWERS) {
      if (s.key === "sporadic") continue;
      const f = (t) => evWrap(lonSun(t) - s.sl * DEG);
      let pa = f(t0);
      for (let t = t0; t < t1; t += 2) {
        const tb = Math.min(t + 2, t1), pb = f(tb);
        if (pa < 0 && pb >= 0 && pb - pa < Math.PI) {
          push({ t: evRoot(f, t, tb), kind: "shower", key: s.key, view: "ground" });
        }
        pa = pb;
      }
    }

    out.sort((a, b) => a.t - b.t);
    return out;
  }

  // 流星群の放射点の高度 [rad] (赤経赤緯から直接)
  function evRadiantAlt(key, t) {
    const s = SHOWERS.find((x) => x.key === key);
    if (!s) return -1;
    const lst = (((280.46061837 + 360.98564736629 * t) % 360 + 360) % 360 + obsLon) * DEG;
    const H = lst - s.ra * DEG, dec = s.dec * DEG, la = obsLat * DEG;
    return Math.asin(Math.max(-1, Math.min(1,
      Math.sin(dec) * Math.sin(la) + Math.cos(dec) * Math.cos(la) * Math.cos(H))));
  }

  // イベントを「実際に見える時刻」へずらす。衝や最大離角の瞬間は昼に来ることが
  // 多く、その時刻へ飛ぶと地平線の下を向いてしまう。前後半日から「空が暗くて
  // いちばん高い」時刻を選ぶ (食だけは瞬間そのものが見せ場なのでずらさない)
  function evViewTime(ev) {
    if (ev.kind === "solarEclipse" || ev.kind === "lunarEclipse") return ev.t;
    const alt = ev.kind === "shower"
      ? (t) => evRadiantAlt(ev.key, t)
      : (t) => evAlt(BODY_BY_KEY.get(ev.key), t);
    let best = null;
    for (let t = ev.t - 0.75; t <= ev.t + 0.75; t += 1 / 288) {   // 5分刻み
      if (evAlt(SUN, t) > -8 * DEG) continue;      // 薄明が残るうちは見えない
      const a = alt(t);
      if (!best || a > best.a) best = { t, a };
    }
    return best && best.a > 0 ? best.t : ev.t;
  }

  // 新月の前後を細かく見て、観測地での日食の最大の瞬間を探す
  function evSolarSearch(tNew) {
    let best = null;
    for (let t = tNew - 0.25; t <= tNew + 0.25; t += 1 / 720) {   // 2分刻み
      const c = evSolarLocal(t);
      if (!best || c.mag > best.mag) best = { t, mag: c.mag, cov: c.cov, annular: c.annular };
    }
    if (!best || best.mag <= 0) return null;
    // 極大を詰める
    const tp = evPeak((t) => evSolarLocal(t).mag, best.t - 1 / 720, best.t + 1 / 720);
    const c = evSolarLocal(tp);
    if (c.mag <= 0) return null;
    const type = c.cov >= 1 ? "total" : (c.annular && c.mag > 0.98 ? "annular" : "partial");
    return { t: tp, kind: "solarEclipse", key: "sun", view: "ground",
             data: { type, mag: c.mag, up: evAlt(SUN, tp) > 0 } };
  }

  // 満月の前後を細かく見て、月食の最大の瞬間 (影の軸に最も近づく時刻) を探す。
  // 遮蔽率で探すと、皆既のあいだは 1 で頭打ちになって「いつが最大か」が
  // 決まらない。離角そのものを見れば、皆既の最中でも中心が一意に決まる
  function evLunarSearch(tFull) {
    let best = null;
    for (let t = tFull - 0.25; t <= tFull + 0.25; t += 1 / 288) {   // 5分刻み
      const c = evLunar(t);
      if (!best || c.sep < best.c.sep) best = { t, c };
    }
    if (!best || best.c.covMax <= 0) return null;
    const tp = evPeak((t) => -evLunar(t).sep, best.t - 1 / 288, best.t + 1 / 288);
    const c = evLunar(tp);
    if (c.covMax <= 0) return null;
    const type = c.covMin >= 1 ? "total" : (c.covMax >= 1 ? "partial" : "penumbral");
    return { t: tp, kind: "lunarEclipse", key: "moon", view: "ground",
             data: { type, up: evAlt(MOON, tp) > 0 } };
  }
  //#endregion
  //#region src/render/body.js
  // ---------- リサイズ ----------
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const appEl = document.getElementById("app");
    W = appEl.clientWidth || window.innerWidth || 1;
    H = appEl.clientHeight || window.innerHeight || 1;
    glc.width = W * DPR; glc.height = H * DPR;
    ovl.width = W * DPR; ovl.height = H * DPR;
    gl.viewport(0, 0, W * DPR, H * DPR);
  }
  window.addEventListener("resize", resize);
  // iOS の PWA (standalone) は回転時に resize イベントが発火しない (または
  // 寸法確定前に発火する) ことがあり、キャンバスのバッファ寸法と表示寸法が
  // ずれて描画が縦に伸縮する。#app の実寸変化を直接監視して追従させる
  if (window.ResizeObserver) {
    new ResizeObserver(() => { resize(); positionInfoPanel(); })
      .observe(document.getElementById("app"));
  }
  resize();

  // ---------- 描画 ----------
  let VP = mIdent(), Vm = mIdent();
  let EYE = [0, 0, 0];          // カメラ位置 (描画はカメラ相対座標で行う)
  const screenPos = new Map();  // key -> {x, y, r, w}

  // 毎フレームの行列・ベクトルはスクラッチを使い回す (GC 停止対策)
  const ZERO3 = [0, 0, 0], UP3 = [0, 1, 0];
  const NO_OBL = [1, 1, 1];   // 扁平を持たない天体 (真球) 用
  const SCR = {
    P: new Float32Array(16),    // 射影
    A: new Float32Array(16),    // 汎用
    rx: new Float32Array(16), ry: new Float32Array(16), rot: new Float32Array(16),
    model: new Float32Array(16), mvp: new Float32Array(16),
    // 大気シェル用 (本体を全部描いたあとに使うので、本体側と別に持つ)
    airModel: new Float32Array(16), airMvp: new Float32Array(16),
    air64: new Float64Array(16), airSun: [0, 0, 0],
    t: [0, 0, 0], tgt: [0, 0, 0],
    v: [0, 0, 0], v2: [0, 0, 0],
    sun: [0, 0, 0],             // bodyRenderer.draw へ渡す光源位置
    // 食の遮蔽体 (描画中の座標系へ移したもの)。毎フレーム作り直さず使い回す
    ecl: { c: [0, 0, 0], r: 0, sunAng: 0, col: null },
  };

  function bodyModel(b, r) {
    const spin = b.rot ? 2 * Math.PI * simDays / b.rot + (b.spin0 || 0) : 0;
    // 土星は環との整合のため実際の極方向 (SATURN_POLE_W) を使う。他は
    // ワールドX軸まわりの傾斜で近似 (傾斜角のみ正確、軸の方位は簡略)
    if (b.key === "saturn") {
      mRotY(spin, SCR.ry);
      mMul(SAT_ROT, SCR.ry, SCR.rot);
    } else {
      mRotX(-(b.tilt || 0) * DEG, SCR.rx);
      mRotY(spin, SCR.ry);
      mMul(SCR.rx, SCR.ry, SCR.rot);
    }
    // 平行移動はカメラ相対 (float64 で差を取ってから f32 化することで震えを防ぐ)
    const t = posW.get(b.key);
    SCR.t[0] = t[0] - EYE[0]; SCR.t[1] = t[1] - EYE[1]; SCR.t[2] = t[2] - EYE[2];
    return mTRS(SCR.t, SCR.rot, r, SCR.model);
  }

  // ---------- 天体レンダラ ----------
  // 夜側の明るさ。点にしか見えない遠くの天体は、真っ暗にすると細い時期に
  // 見失うので明るく保つ。円盤として分解できる大きさになったら暗くして、
  // 月や金星の満ち欠けがはっきり出るようにする。
  // ただし下限は 0 に落とさない — 探査機視点のように天体が画面いっぱいになる
  // 場面で、影側が真っ黒だと画面ごと沈んでしまう
  // 返す値は「画面上でどれくらいの明るさに見せたいか」なので、シェーダへ渡す
  // 前にリニアへ直す (照明の計算はリニアで行う)
  function nightAmbient(b, radiusPx) {
    const v = b.comet
      ? 0.15                               // 彗星核は宇宙空間らしく常に暗い
      : (() => {
          const t = Math.min(1, Math.max(0, ((radiusPx || 0) - 3) / 14));
          return 0.30 - 0.21 * (t * t * (3 - 2 * t));
        })();
    return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  }

  // WebGL のプログラムと uniform はグローバルな状態なので、設定漏れがあると
  // 直前の描画の値がそのまま残る (実際に uComet の設定漏れで、地上ビューの
  // 全天体が彗星核として描かれうる状態になっていた)。
  //
  // そこで prog をクロージャに閉じ込め、この関数の外から uniform を触れなく
  // する。draw() は呼ばれるたびに天体単位の uniform を「すべて」設定する。
  // どれか1つでも省くと同じ種類のバグが再発するため、条件分岐で飛ばさない。
  //
  // 宇宙ビューと地上ビューでは座標系・モデル行列の作り方・カリング・深度の
  // 扱いが異なるので、パス単位 (beginPass) と天体単位 (draw) を分けている。
  // モデル行列の生成と地上ビューの深度クリアは呼び出し側に残す。
  function createBodyRenderer(prog) {
    const { pr, u, a } = prog;
    let inPass = false;
    // 大気シェルは深度書き込みとカリングを一時的に変えるので、パスの設定を控える
    let passDepthWrite = true, passCull = null;
    return {
      // program・バッファ・頂点属性・テクスチャユニット・depth/cull を確定させる。
      // cullFace は gl.FRONT / gl.BACK、不要なら null
      // airSun / airDay は地上ビューのエアライト用。宇宙ビューは airDay = 0
      beginPass({ time, cameraPosition, cullFace = null, depthTest = true, depthWrite = true,
                  airSun = null, airDay = 0 }) {
        if (inPass) throw new Error("bodyRenderer: beginPass が入れ子になっています");
        inPass = true;
        gl.useProgram(pr);
        gl.uniform1f(u.uAirDay, airDay);
        gl.uniform3f(u.uAirSun, airSun ? airSun[0] : 0, airSun ? airSun[1] : 1, airSun ? airSun[2] : 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, sphereVB);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, sphereIB);
        gl.enableVertexAttribArray(a.aPos);
        gl.vertexAttribPointer(a.aPos, 3, gl.FLOAT, false, 0, 0);
        // 天体テクスチャだけがユニット0で入れ替わる。環のプロファイルと
        // 地球の雲・夜景はパスの間ずっと同じなので 1〜3 に据え置く
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, ringTex);
        gl.uniform1i(u.uRing, 1);
        gl.uniform2f(u.uRingR, RING_IN, 1.0 / (RING_OUT - RING_IN));
        gl.activeTexture(gl.TEXTURE2);
        gl.bindTexture(gl.TEXTURE_2D, cloudTex);
        gl.uniform1i(u.uCloud, 2);
        gl.activeTexture(gl.TEXTURE3);
        gl.bindTexture(gl.TEXTURE_2D, nightTex);
        gl.uniform1i(u.uNight, 3);
        gl.uniform1i(u.uNrm, 4);   // ユニット4 は天体ごとに draw() が差し替える
        // 雲は地表と別に、1日あたり 0.7° ほど東へ流す (偏西風のゆるい見立て)。
        // 実時間ではなく暦の時刻で決めるので、停止中は雲も止まる
        gl.uniform1f(u.uCloudRot, simDays * 0.0019 - Math.floor(simDays * 0.0019));
        // 黒点の世代。f32 で桁が落ちない範囲へ畳んでおく (238日周期で群が一巡)
        gl.uniform1f(u.uSunT, simDays - Math.floor(simDays / 238) * 238);
        gl.activeTexture(gl.TEXTURE0);
        gl.uniform1i(u.uTex, 0);
        gl.uniform1f(u.uTime, time);
        gl.uniform3f(u.uCam, cameraPosition[0], cameraPosition[1], cameraPosition[2]);
        if (depthTest) gl.enable(gl.DEPTH_TEST); else gl.disable(gl.DEPTH_TEST);
        passDepthWrite = !!depthWrite;
        gl.depthMask(passDepthWrite);
        passCull = cullFace;
        if (cullFace !== null) { gl.enable(gl.CULL_FACE); gl.cullFace(cullFace); }
        else gl.disable(gl.CULL_FACE);
      },
      // 大気シェル。本体より一回り大きい球を加算で重ね、円盤の外へはみ出す光の
      // 輪を出す。本体をすべて描き終えてから呼ぶ (深度は書かない)。
      // model は本体の (1 + body.air) 倍にスケールしたもの
      drawAtmos({ body, model, mvp, sunPosition }) {
        if (!inPass) throw new Error("bodyRenderer: beginPass より前に drawAtmos が呼ばれました");
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        gl.depthMask(false);
        // シェルは手前側の半球だけ描く。この球の巻き方向では FRONT を落とすと
        // 観測者側が残る (地上ビューの本体描画と同じ)
        gl.enable(gl.CULL_FACE);
        gl.cullFace(gl.FRONT);
        gl.uniform1f(u.uAtmos, 1);
        gl.uniform1f(u.uAtmosT, body.air);
        gl.uniformMatrix4fv(u.uMVP, false, mvp);
        gl.uniformMatrix4fv(u.uModel, false, model);
        gl.uniform3f(u.uSun, sunPosition[0], sunPosition[1], sunPosition[2]);
        gl.drawElements(gl.TRIANGLES, sphere.idx.length, gl.UNSIGNED_SHORT, 0);
        // パスの状態へ戻す。ここを戻し忘れると後続の天体が透けたり消えたりする
        gl.uniform1f(u.uAtmos, 0);
        gl.disable(gl.BLEND);
        gl.depthMask(passDepthWrite);
        if (passCull !== null) gl.cullFace(passCull); else gl.disable(gl.CULL_FACE);
      },
      // sunPosition は方向ではなく「シェーダが使う座標系での光源位置」。
      // 宇宙ビューは全天体で同一 (カメラ相対の太陽位置)、地上ビューは天体ごとに
      // 「天体 → 実際の太陽」方向を遠方光源の位置として渡す
      // radiusPx = 画面上の見かけの半径。夜側の明るさ (満ち欠けの見え方) を決める
      // eclipse = 太陽面を隠している天体 {c, r, sunAng, col}。無ければ null
      draw({ body, model, mvp, sunPosition, radiusPx, eclipse }) {
        if (!inPass) throw new Error("bodyRenderer: beginPass より前に draw が呼ばれました");
        const tx = texByKey.get(body.key);
        // 法線図を持つ天体だけユニット4を差し替える。持たない天体でも
        // 「持っていない」ことを毎回伝える (前の天体の値を引き継がせない)
        const nx = nrmByKey.get(body.key);
        gl.activeTexture(gl.TEXTURE4);
        gl.bindTexture(gl.TEXTURE_2D, nx || noTex);
        gl.uniform1f(u.uNrmAmt, nx ? body.nrm : 0);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, tx || noTex);
        gl.uniform1f(u.uHasTex, tx ? 1 : 0);
        gl.uniform1f(u.uAmb, nightAmbient(body, radiusPx));
        gl.uniformMatrix4fv(u.uMVP, false, mvp);
        gl.uniformMatrix4fv(u.uModel, false, model);
        gl.uniform3f(u.uSun, sunPosition[0], sunPosition[1], sunPosition[2]);
        gl.uniform1f(u.uComet, body.comet ? 1 : 0);
        // 扁平は天体ごと。真球は 1,1,1 (条件分岐で省くと前の天体の値が残る)
        gl.uniform3fv(u.uOblate, body.obl || NO_OBL);
        gl.uniform1f(u.uRingOn, body.ring ? 1 : 0);
        // 食。遮蔽体が無いフレームでも「無い」ことを毎回伝える (前の天体の
        // 影を引きずると、関係のない天体が暗くなる)
        const ec = eclipse || null;
        gl.uniform3f(u.uEclC, ec ? ec.c[0] : 0, ec ? ec.c[1] : 0, ec ? ec.c[2] : 0);
        gl.uniform2f(u.uEclR, ec ? ec.r : 0, ec ? ec.sunAng : 1);
        gl.uniform3fv(u.uEclCol, ec ? ec.col : ZERO3);
        gl.uniform1f(u.uAtmos, 0);      // 直前が大気シェルでも本体として描く
        gl.uniform1f(u.uType, body.type);
        // 色はリニアに直したもの (bodies.js で一度だけ変換済み) を渡す。
        // シェーダ側で毎画素 pow を回さないため
        gl.uniform3fv(u.uColA, body.colAL);
        gl.uniform3fv(u.uColB, body.colBL);
        gl.uniform3fv(u.uColC, body.colCL);
        gl.uniform3fv(u.uRim, body.rimL);
        gl.uniform4fv(u.uParams, body.params);
        gl.drawElements(gl.TRIANGLES, sphere.idx.length, gl.UNSIGNED_SHORT, 0);
      },
      endPass() {
        inPass = false;
        gl.disable(gl.CULL_FACE);
      },
    };
  }

  // 宇宙ビュー用。モデル行列を作って1天体を描く (パスは呼び出し側で開く)
  function drawBody(b, sunPosition) {
    const r = bodyR(b);
    const model = bodyModel(b, r);              // SCR.t にカメラ相対位置が入る
    const d = Math.hypot(SCR.t[0], SCR.t[1], SCR.t[2]) || 1;
    const radiusPx = r / d * (H / 2) / Math.tan(eFov() / 2);
    // 遮蔽体もカメラ相対へ (f64 で差を取ってから f32 化するのは天体本体と同じ)
    const e = eclipseFor(b);
    let eclipse = null;
    if (e) {
      SCR.ecl.c[0] = e.cw[0] - EYE[0];
      SCR.ecl.c[1] = e.cw[1] - EYE[1];
      SCR.ecl.c[2] = e.cw[2] - EYE[2];
      SCR.ecl.r = e.r; SCR.ecl.sunAng = e.sunAng; SCR.ecl.col = e.col;
      eclipse = SCR.ecl;
    }
    bodyRenderer.draw({ body: b, model, mvp: mMul(VP, model, SCR.mvp), sunPosition, radiusPx, eclipse });
  }

  // 宇宙ビュー用。大気を持つ天体のシェルを1つ描く (本体をすべて描いたあとに呼ぶ)
  function drawBodyAtmos(b, sunPosition) {
    const model = bodyModel(b, bodyR(b) * (1 + b.air));
    bodyRenderer.drawAtmos({ body: b, model, mvp: mMul(VP, model, SCR.mvp), sunPosition });
  }

  function project(w) {
    const wx = w[0] - EYE[0], wy = w[1] - EYE[1], wz = w[2] - EYE[2];
    const x = VP[0]*wx + VP[4]*wy + VP[8]*wz + VP[12];
    const y = VP[1]*wx + VP[5]*wy + VP[9]*wz + VP[13];
    const cw = VP[3]*wx + VP[7]*wy + VP[11]*wz + VP[15];
    // 微小天体への接近時は cw が 0.01 を大きく下回る。背面判定は符号だけで行う
    if (cw <= 1e-9) return null;
    return { x: (x / cw * 0.5 + 0.5) * W, y: (1 - (y / cw * 0.5 + 0.5)) * H, w: cw };
  }

  //#endregion
  //#region src/render/milkyway.js
  // ---------- 天の川 ----------
  // 拡散光だけの全天マップ (NASA SVS Deep Star Maps 2020 の milkyway 版) を
  // 天球へ貼る。明るい恒星 (ヒッパルコス・ティコ) は元データから抜いてあるので、
  // こちらが点で描いている輝星カタログと二重像にならない。
  //
  // 地図は赤道座標の正距円筒。恒星カタログと同じく J2000 のまま扱い、描画
  // フレーム (宇宙 = ワールド / 地上 = [東, 天頂, −北]) の方向を赤道へ回して uv を引く。
  const MW_R = 1938;                       // 宇宙ビューの天球半径 (恒星の 1900 の外側)
  const MW_ECL = 23.4393 * DEG;            // 黄道傾斜 (sky.js の恒星と同じ値)
  const MW_CE = Math.cos(MW_ECL), MW_SE = Math.sin(MW_ECL);
  const _mwEq = new Float32Array(9);       // 列 = 描画フレームの基底を赤道で見たもの
  // 明るさ。元データは実測の輝度なので、そのまま出すと長時間露光の写真になる。
  // 肉眼で見た天の川は「星座線が透けて見える淡い光の帯」なので、そこまで落とす。
  // 宇宙ビューは大気の減光が無いぶん少しだけ強め
  const MW_SPACE_BRIGHT = 0.42, MW_GROUND_BRIGHT = 0.33;

  // ワールドの方向 → 赤道座標。sky.js が恒星に掛けている変換
  // (赤道 → 黄道 → ワールド[x, z, −y]) をそのまま逆に辿る
  function mwEqOfWorld(x, y, z, o) {
    _mwEq[o]     = x;
    _mwEq[o + 1] = -z * MW_CE - y * MW_SE;
    _mwEq[o + 2] = -z * MW_SE + y * MW_CE;
  }
  function mwEqSpace() {                   // 宇宙ビュー: 描画フレーム = ワールド
    mwEqOfWorld(1, 0, 0, 0);
    mwEqOfWorld(0, 1, 0, 3);
    mwEqOfWorld(0, 0, 1, 6);
    return _mwEq;
  }
  function mwEqGround() {                  // 地上・月面ビュー: [東, 天頂, −北]
    mwEqOfWorld(obsE[0], obsE[1], obsE[2], 0);
    mwEqOfWorld(obsU[0], obsU[1], obsU[2], 3);
    mwEqOfWorld(-obsN[0], -obsN[1], -obsN[2], 6);
    return _mwEq;
  }

  // 深度もブレンドも呼び出し側の状態をそのまま使う (背景として最初に描く前提)。
  // 視点は必ず球の中心にあるので、視線は球面と1度しか交わらない = カリング不要
  function drawMilkyWay(vp32, eq9, radius, bright) {
    if (bright <= 0.003) return;
    gl.useProgram(skyP.pr);
    gl.uniformMatrix4fv(skyP.u.uVP, false, vp32);
    gl.uniformMatrix3fv(skyP.u.uEq, false, eq9);
    gl.uniform1f(skyP.u.uRadius, radius);
    gl.uniform1f(skyP.u.uBright, bright);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, mwTex);
    gl.uniform1i(skyP.u.uTex, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, sphereVB);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, sphereIB);
    gl.enableVertexAttribArray(skyP.a.aPos);
    gl.vertexAttribPointer(skyP.a.aPos, 3, gl.FLOAT, false, 0, 0);
    gl.drawElements(gl.TRIANGLES, sphere.idx.length, gl.UNSIGNED_SHORT, 0);
  }

  function bvColor(bv) {
    const t = Math.max(-0.4, Math.min(2.0, bv));

    if (surfaceBody === "moon") {
      const mC = posW.get("moon"), eC = posW.get("earth");
      const px = 0, py = 1, pz = 0;       // 月の極 ≈ 黄道北 (潮汐ロック近似, 傾き1.5°は無視)
      let ex = eC[0]-mC[0], ey = eC[1]-mC[1], ez = eC[2]-mC[2];
      const el = Math.hypot(ex, ey, ez) || 1; ex/=el; ey/=el; ez/=el;   // 地球方向 (sub-Earth)
      const dp = ex*px + ey*py + ez*pz;
      let x0x = ex-dp*px, x0y = ey-dp*py, x0z = ez-dp*pz;               // 赤道面へ射影 = 経度0
      const x0l = Math.hypot(x0x, x0y, x0z) || 1; x0x/=x0l; x0y/=x0l; x0z/=x0l;
      const y0x = py*x0z-pz*x0y, y0y = pz*x0x-px*x0z, y0z = px*x0y-py*x0x;  // p × x0 = 経度+90
      const la = moonLat*DEG, lo = moonLon*DEG, cla = Math.cos(la), sla = Math.sin(la), clo = Math.cos(lo), slo = Math.sin(lo);
      const bx = clo*x0x+slo*y0x, by = clo*x0y+slo*y0y, bz = clo*x0z+slo*y0z;
      obsU[0]=cla*bx+sla*px; obsU[1]=cla*by+sla*py; obsU[2]=cla*bz+sla*pz;
      obsN[0]=-sla*bx+cla*px; obsN[1]=-sla*by+cla*py; obsN[2]=-sla*bz+cla*pz;
      obsE[0]=-slo*x0x+clo*y0x; obsE[1]=-slo*x0y+clo*y0y; obsE[2]=-slo*x0z+clo*y0z;
      const rW = 1737.4 * KM2W;
      obsPosW[0]=mC[0]+rW*obsU[0]; obsPosW[1]=mC[1]+rW*obsU[1]; obsPosW[2]=mC[2]+rW*obsU[2];
    } else {
      const eC = posW.get("earth");
      const lst = (gmstDeg(simDays)+obsLon)*DEG, la = obsLat*DEG;
      const cla = Math.cos(la), sla = Math.sin(la), cst = Math.cos(lst), sst = Math.sin(lst);
      eqToWorld(cla*cst, cla*sst, sla, obsU);      // 天頂
      eqToWorld(-sla*cst, -sla*sst, cla, obsN);    // 北
      eqToWorld(-sst, cst, 0, obsE);               // 東
      const rW = 6378.14 * KM2W;
      obsPosW[0]=eC[0]+rW*obsU[0]; obsPosW[1]=eC[1]+rW*obsU[1]; obsPosW[2]=eC[2]+rW*obsU[2];
    }
  }
  // ワールドの「方向ベクトル」を地平フレーム [東, 天頂, -北] (azAltDir と同じ規約) へ
  function worldDirToGround(d, out) {
    const e = d[0]*obsE[0]+d[1]*obsE[1]+d[2]*obsE[2];
    const u = d[0]*obsU[0]+d[1]*obsU[1]+d[2]*obsU[2];
    const nn = d[0]*obsN[0]+d[1]*obsN[1]+d[2]*obsN[2];
    out[0]=e; out[1]=u; out[2]=-nn; return out;
  }
  // 観測地からの天体方向 (視差込み) → 地平フレーム単位ベクトル + 距離[AU]。az/alt はこれから求める
  function bodySky(body, out) {
    const b = posW.get(body.key);
    let dx = b[0]-obsPosW[0], dy = b[1]-obsPosW[1], dz = b[2]-obsPosW[2];
    const dist = Math.hypot(dx, dy, dz) || 1; dx/=dist; dy/=dist; dz/=dist;
    out[0] = dx*obsE[0]+dy*obsE[1]+dz*obsE[2];
    out[1] = dx*obsU[0]+dy*obsU[1]+dz*obsU[2];
    out[2] = -(dx*obsN[0]+dy*obsN[1]+dz*obsN[2]);
    return dist / K_REAL;                          // AU
  }
  function projGround(p) {
    const w = gVP[3]*p[0] + gVP[7]*p[1] + gVP[11]*p[2] + gVP[15];
    if (w <= 0.01) return null;
    const x = gVP[0]*p[0] + gVP[4]*p[1] + gVP[8]*p[2] + gVP[12];
    const y = gVP[1]*p[0] + gVP[5]*p[1] + gVP[9]*p[2] + gVP[13];
    return { x: (x/w*0.5+0.5)*W, y: (1-(y/w*0.5+0.5))*H };
  }
  const magSize = (m) => Math.max(1.6, Math.min(9, 6 - m * 1.2));
  const SKYR = 100;
  const groundVis = [];
  function renderGround(nowSec) {
    buildObsFrame();   // 観測者フレーム (地球/月) を確定
    if (!groundVB) {
      // 地面 = 下半球ドーム。視点は原点なので y=0 の平面では下半分を塗れない
      // (平面が視点を通ると地平線の線にしかならない)。天頂下の全方向を覆う
      // 半球メッシュにして地平線より下を確実に隠す
      const RA = 200, NAZ = 48, NALT = 6, dome = [];
      const V = (alt, az) => { const ca = Math.cos(alt); return [ca * Math.sin(az) * RA, Math.sin(alt) * RA, -ca * Math.cos(az) * RA]; };
      for (let j = 0; j < NALT; j++) {
        const a0 = -(j / NALT) * Math.PI / 2, a1 = -((j + 1) / NALT) * Math.PI / 2;
        for (let i = 0; i < NAZ; i++) {
          const z0 = i / NAZ * 2 * Math.PI, z1 = (i + 1) / NAZ * 2 * Math.PI;
          const p00 = V(a0, z0), p01 = V(a0, z1), p10 = V(a1, z0), p11 = V(a1, z1);
          dome.push(...p00, ...p10, ...p11, ...p00, ...p11, ...p01);
        }
      }
      groundDomeN = dome.length / 3;
      groundVB = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, groundVB);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(dome), gl.STATIC_DRAW);
      groundPtVB = gl.createBuffer();
      // 水平線リング (alt=0 の大円)
      const HN = 128, hr = [];
      for (let i = 0; i <= HN; i++) { azAltDir(i / HN * 360, 0, _gp); hr.push(_gp[0]*SKYR, _gp[1]*SKYR, _gp[2]*SKYR); }
      horizonVB = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, horizonVB);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(hr), gl.STATIC_DRAW);
      horizonN = HN + 1;

      // 稜線つきドーム: 上端の高度を方位ごとに変えて山並み/クレーター縁のシルエットを作る。
      // 稜線は必ず地平線以上に出す (下げると地平線下の天体が覗いてしまうため)
      const RN = 192;
      const ridgeProfile = (amp) => {
        const p = new Float32Array(RN + 1);
        for (let i = 0; i <= RN; i++) {
          const a = i / RN * 2 * Math.PI;   // 整数倍音のみ = 継ぎ目が滑らかに閉じる
          const v = 0.55 * Math.sin(a * 3 + 0.7) + 0.32 * Math.sin(a * 7 + 2.1)
                  + 0.20 * Math.sin(a * 13 + 4.3) + 0.12 * Math.sin(a * 23 + 1.2)
                  + 0.07 * Math.sin(a * 37 + 5.6);
          p[i] = amp * Math.max(0, Math.min(1, (v + 1.26) / 2.52));
        }
        return p;
      };
      const buildRidgeDome = (prof) => {
        const RA2 = 200, NALT2 = 8, v = [];
        const P = (alt, az) => { const c = Math.cos(alt); return [c*Math.sin(az)*RA2, Math.sin(alt)*RA2, -c*Math.cos(az)*RA2]; };
        for (let i = 0; i < RN; i++) {
          const z0 = i / RN * 2 * Math.PI, z1 = (i + 1) / RN * 2 * Math.PI;
          const t0 = prof[i], t1 = prof[i + 1], bot = -Math.PI / 2;
          for (let j = 0; j < NALT2; j++) {
            const f0 = j / NALT2, f1 = (j + 1) / NALT2;
            const p00 = P(t0 + (bot - t0) * f0, z0), p01 = P(t1 + (bot - t1) * f0, z1);
            const p10 = P(t0 + (bot - t0) * f1, z0), p11 = P(t1 + (bot - t1) * f1, z1);
            v.push(...p00, ...p10, ...p11, ...p00, ...p11, ...p01);
          }
        }
        ridgeN = v.length / 3;
        const b = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, b);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(v), gl.STATIC_DRAW);
        return b;
      };
      ridgeVB.earth = buildRidgeDome(ridgeProfile(0.045));   // 山並み (約2.6°)
      ridgeVB.moon = buildRidgeDome(ridgeProfile(0.016));    // なだらかなクレーター縁 (約0.9°)

      // 空ドーム (上半球。地上の大気表現用。地平線の少し下から天頂まで覆う)
      const SR = 150, SAZ = 48, SALT = 10, sky = [];
      const S = (alt, az) => { const c = Math.cos(alt); return [c*Math.sin(az)*SR, Math.sin(alt)*SR, -c*Math.cos(az)*SR]; };
      for (let j = 0; j < SALT; j++) {
        const a0 = -0.12 + (Math.PI / 2 + 0.12) * (j / SALT), a1 = -0.12 + (Math.PI / 2 + 0.12) * ((j + 1) / SALT);
        for (let i = 0; i < SAZ; i++) {
          const z0 = i / SAZ * 2 * Math.PI, z1 = (i + 1) / SAZ * 2 * Math.PI;
          sky.push(...S(a0, z0), ...S(a1, z0), ...S(a1, z1), ...S(a0, z0), ...S(a1, z1), ...S(a0, z1));
        }
      }
      skyN = sky.length / 3;
      skyVB = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, skyVB);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(sky), gl.STATIC_DRAW);
    }
    const ca = Math.cos(gAlt);
    _fwd[0] = ca*Math.sin(gAz); _fwd[1] = Math.sin(gAlt); _fwd[2] = -ca*Math.cos(gAz);
    mLookAt(ZERO3, _fwd, UP3, gV64);
    // ズーム時は near を引き上げて深度分解能を確保する (天体球と環の相互隠蔽に必要。
    // near 0.05 のままだと距離100での深度精度 ~0.012 が球の奥行きを超えてしまう)
    const gNear = Math.min(50, Math.max(0.05, 0.05 * (60 * DEG) / gFov));
    mPersp(gFov, W / H, gNear, 2000, gP64);
    mMul(gP64, gV64, gVP);
    gVP32.set(gVP);

    // 太陽の方向 (地平フレーム) と昼夜係数。地形の陰影・大気・星の減光に使う
    const sunAU = bodySky(SUN, _sunG);
    const isMoonSurf = surfaceBody === "moon";
    // ---- 日食: 観測地から見て太陽面が何割隠れているか ----
    // 地上では月が、月面では地球が太陽を隠す。皆既に近づくほど空が暗くなり、
    // 昼のうちに星が現れる — 昼夜係数へ畳んでおけば、空・地面・星・天体の
    // エアライト・Bloom のしきい値まで一度に効く
    const eclOcc = isMoonSurf ? BODY_BY_KEY.get("earth") : MOON;
    let sunCov = 0;
    {
      const occAU = bodySky(eclOcc, _gp);
      const rs = Math.asin(Math.min(1, SUN.rkm / (sunAU * AU_KM)));
      const ro = Math.asin(Math.min(1, eclOcc.rkm / (occAU * AU_KM)));
      const cos = _gp[0]*_sunG[0] + _gp[1]*_sunG[1] + _gp[2]*_sunG[2];
      sunCov = diskCoverage(Math.acos(Math.max(-1, Math.min(1, cos))), rs, ro);
    }
    // 隠れた面積をそのまま明るさに使うと、半分欠けただけで夕方になってしまう。
    // 目は明るさの対数に反応するので、実際に暗さを感じるのは残りが1割を切って
    // から — 残光を対数で写して、桁が落ちるほど急に暗くなる形にする。
    // 皆既でも 0 にはしない: 実際の皆既中の空は深い薄明で、地平はぐるりと
    // 夕焼け色に残る
    const sunLeft = Math.max(0.02, Math.min(1, 1 + Math.log10(Math.max(1e-4, 1 - sunCov)) / 3.5));
    // 月面は大気が無いので昼でも空は暗いまま (星も見える)
    const dayF = (showTerrain && !isMoonSurf)
      ? Math.max(0, Math.min(1, (_sunG[1] + 0.12) / 0.22)) * sunLeft : 0;
    starVis = 1 - dayF * 0.98;   // 昼は星をほぼ消す
    skyDayF = dayF;

    gl.clearColor(0.015, 0.02, 0.045, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.disable(gl.DEPTH_TEST); gl.depthMask(false);

    // 大気 (地上ビューのみ)。星より先に、背景として不透明で描く
    if (showTerrain && !isMoonSurf && dayF > 0.001 && skyVB) {
      gl.disable(gl.BLEND);
      gl.useProgram(terrainP.pr);
      gl.uniformMatrix4fv(terrainP.u.uVP, false, gVP32);
      gl.uniform3f(terrainP.u.uSun, _sunG[0], _sunG[1], _sunG[2]);
      gl.uniform1f(terrainP.u.uMoon, 0);
      gl.uniform1f(terrainP.u.uDay, dayF);
      gl.uniform1f(terrainP.u.uOcc, sunLeft);
      gl.uniform1f(terrainP.u.uSky, 1);
      gl.bindBuffer(gl.ARRAY_BUFFER, skyVB);
      gl.enableVertexAttribArray(terrainP.a.aPos);
      gl.vertexAttribPointer(terrainP.a.aPos, 3, gl.FLOAT, false, 0, 0);
      gl.drawArrays(gl.TRIANGLES, 0, skyN);
    }
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

    // 天の川。空ドームの上に加算で重ね、恒星より先に描く (地面ドームは後から
    // 不透明で描かれるので、地平線より下は隠れる)。昼は星と同じだけ薄れる
    drawMilkyWay(gVP32, mwEqGround(), SKYR * 1.4,
                 (isMoonSurf ? MW_SPACE_BRIGHT : MW_GROUND_BRIGHT) * starVis);

    // 星座線 (観測者フレームへ投影。地平線より上のセグメントのみ)。恒星より先に描く
    if (showConst && CONST_SEG.length) {
      let cn = 0;
      for (let i = 0; i + 5 < CONST_SEG.length; i += 6) {
        const e0 = CONST_SEG[i]*obsE[0]+CONST_SEG[i+1]*obsE[1]+CONST_SEG[i+2]*obsE[2];
        const u0 = CONST_SEG[i]*obsU[0]+CONST_SEG[i+1]*obsU[1]+CONST_SEG[i+2]*obsU[2];
        const n0 = CONST_SEG[i]*obsN[0]+CONST_SEG[i+1]*obsN[1]+CONST_SEG[i+2]*obsN[2];
        const e1 = CONST_SEG[i+3]*obsE[0]+CONST_SEG[i+4]*obsE[1]+CONST_SEG[i+5]*obsE[2];
        const u1 = CONST_SEG[i+3]*obsU[0]+CONST_SEG[i+4]*obsU[1]+CONST_SEG[i+5]*obsU[2];
        const n1 = CONST_SEG[i+3]*obsN[0]+CONST_SEG[i+4]*obsN[1]+CONST_SEG[i+5]*obsN[2];
        if (u0 < -0.03 && u1 < -0.03) continue;      // 両端とも地平線下ならスキップ
        constGroundBuf[cn++] = e0 * SKYR; constGroundBuf[cn++] = u0 * SKYR; constGroundBuf[cn++] = -n0 * SKYR;
        constGroundBuf[cn++] = e1 * SKYR; constGroundBuf[cn++] = u1 * SKYR; constGroundBuf[cn++] = -n1 * SKYR;
      }
      if (cn) {
        gl.useProgram(lineP.pr);
        gl.uniformMatrix4fv(lineP.u.uVP, false, gVP32);
        gl.uniform4f(lineP.u.uColor, 0.19 * starVis, 0.25 * starVis, 0.4 * starVis, 0.55 * starVis);
        if (!constGVB) constGVB = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, constGVB);
        gl.bufferData(gl.ARRAY_BUFFER, constGroundBuf.subarray(0, cn), gl.DYNAMIC_DRAW);
        gl.enableVertexAttribArray(lineP.a.aPos);

      // 黄道 (金色。ワールド単位 = ECL_WORLD/1895 を投影)
      {
        const ER = 1895;
        let en = 0;
        for (let k = 0; k < ECL_N; k++) {
          const a = k * 3, b = ((k + 1) % ECL_N) * 3;
          const ax = ECL_WORLD[a]/ER, ay = ECL_WORLD[a+1]/ER, az = ECL_WORLD[a+2]/ER;
          const bx = ECL_WORLD[b]/ER, by = ECL_WORLD[b+1]/ER, bz = ECL_WORLD[b+2]/ER;
          const e0 = ax*obsE[0]+ay*obsE[1]+az*obsE[2], u0 = ax*obsU[0]+ay*obsU[1]+az*obsU[2], n0 = ax*obsN[0]+ay*obsN[1]+az*obsN[2];
          const e1 = bx*obsE[0]+by*obsE[1]+bz*obsE[2], u1 = bx*obsU[0]+by*obsU[1]+bz*obsU[2], n1 = bx*obsN[0]+by*obsN[1]+bz*obsN[2];
          if (u0 < -0.03 && u1 < -0.03) continue;
          eclGroundBuf[en++] = e0 * SKYR; eclGroundBuf[en++] = u0 * SKYR; eclGroundBuf[en++] = -n0 * SKYR;
          eclGroundBuf[en++] = e1 * SKYR; eclGroundBuf[en++] = u1 * SKYR; eclGroundBuf[en++] = -n1 * SKYR;
        }
        if (en) {
          gl.useProgram(lineP.pr);
          gl.uniformMatrix4fv(lineP.u.uVP, false, gVP32);
          gl.uniform4f(lineP.u.uColor, 0.45 * starVis, 0.35 * starVis, 0.14 * starVis, 0.65 * starVis);
          if (!eclGVB) eclGVB = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, eclGVB);
          gl.bufferData(gl.ARRAY_BUFFER, eclGroundBuf.subarray(0, en), gl.DYNAMIC_DRAW);
          gl.enableVertexAttribArray(lineP.a.aPos);
          gl.vertexAttribPointer(lineP.a.aPos, 3, gl.FLOAT, false, 0, 0);
          gl.drawArrays(gl.LINES, 0, en / 3);
        }
      }
    }

    // 天球の経緯線 (赤道座標。星座線と同じ投影・地平線カリング)。
    // 星座線と違い昼でも消さない — 出しているのは目盛りなので、見えないと
    // 切替が効いていないように見える。昼は下限まで落として控えめにする
    if (showGrid && GRID_SEG.length) {
      let gn = 0;
      for (let i = 0; i + 5 < GRID_SEG.length; i += 6) {
        const e0 = GRID_SEG[i]*obsE[0]+GRID_SEG[i+1]*obsE[1]+GRID_SEG[i+2]*obsE[2];
        const u0 = GRID_SEG[i]*obsU[0]+GRID_SEG[i+1]*obsU[1]+GRID_SEG[i+2]*obsU[2];
        const n0 = GRID_SEG[i]*obsN[0]+GRID_SEG[i+1]*obsN[1]+GRID_SEG[i+2]*obsN[2];
        const e1 = GRID_SEG[i+3]*obsE[0]+GRID_SEG[i+4]*obsE[1]+GRID_SEG[i+5]*obsE[2];
        const u1 = GRID_SEG[i+3]*obsU[0]+GRID_SEG[i+4]*obsU[1]+GRID_SEG[i+5]*obsU[2];
        const n1 = GRID_SEG[i+3]*obsN[0]+GRID_SEG[i+4]*obsN[1]+GRID_SEG[i+5]*obsN[2];
        if (u0 < -0.03 && u1 < -0.03) continue;      // 両端とも地平線下ならスキップ
        gridGroundBuf[gn++] = e0 * SKYR; gridGroundBuf[gn++] = u0 * SKYR; gridGroundBuf[gn++] = -n0 * SKYR;
        gridGroundBuf[gn++] = e1 * SKYR; gridGroundBuf[gn++] = u1 * SKYR; gridGroundBuf[gn++] = -n1 * SKYR;
      }
      if (gn) {
        const gv = 0.4 + 0.6 * starVis;
        gl.useProgram(lineP.pr);
        gl.uniformMatrix4fv(lineP.u.uVP, false, gVP32);
        gl.uniform4f(lineP.u.uColor, 0.11 * gv, 0.21 * gv, 0.23 * gv, 0.45 * gv);
        if (!gridGVB) gridGVB = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, gridGVB);
        gl.bufferData(gl.ARRAY_BUFFER, gridGroundBuf.subarray(0, gn), gl.DYNAMIC_DRAW);
        gl.enableVertexAttribArray(lineP.a.aPos);
        gl.vertexAttribPointer(lineP.a.aPos, 3, gl.FLOAT, false, 0, 0);
        gl.drawArrays(gl.LINES, 0, gn / 3);
      }
    }

    // 恒星 (実カタログ, 地平線より上のみ)。ワールド単位方向を観測者フレームへ投影
    if (N_CAT) {
      if (!starGVB) starGVB = gl.createBuffer();
      // 大気の無い月面では減光が効かないので、地上より一段大きく・明るく描く
      const szK = isMoonSurf ? 4.9 : 4.0, szMin = isMoonSurf ? 1.6 : 0.9;
      const brK = isMoonSurf ? 1.35 : 1.15, brA = isMoonSurf ? 0.115 : 0.13;
      const brMin = isMoonSurf ? 0.62 : 0.3;
      let ns = 0;
      for (let i = 0; i < N_CAT; i++) {
        const wx = STAR_W[i*3], wy = STAR_W[i*3+1], wz = STAR_W[i*3+2];
        const up = wx*obsU[0]+wy*obsU[1]+wz*obsU[2];      // sinAlt
        if (up < 0.02) continue;
        const east = wx*obsE[0]+wy*obsE[1]+wz*obsE[2];
        const north = wx*obsN[0]+wy*obsN[1]+wz*obsN[2];
        const o = ns * 7;
        starGArr[o] = east * SKYR; starGArr[o+1] = up * SKYR; starGArr[o+2] = -north * SKYR;
        const m = STAR_MAG[i];
        starGArr[o+3] = Math.max(szMin, szK - 0.55 * m);
        const c = Math.max(brMin, Math.min(1, brK - brA * m));
        const col = STAR_COL[i];                  // B-V 色指数による実際の色味
        starGArr[o+4] = col[0] * c; starGArr[o+5] = col[1] * c; starGArr[o+6] = col[2] * c;
        ns++;
      }
      if (ns) {
        gl.useProgram(pointP.pr);
        gl.uniformMatrix4fv(pointP.u.uVP, false, gVP32);
        gl.uniform1f(pointP.u.uScale, DPR);
        gl.uniform1f(pointP.u.uAlpha, (isMoonSurf ? 1 : 0.95) * starVis);
        gl.bindBuffer(gl.ARRAY_BUFFER, starGVB);
        gl.bufferData(gl.ARRAY_BUFFER, starGArr, gl.DYNAMIC_DRAW);
        gl.enableVertexAttribArray(pointP.a.aPos);
        gl.enableVertexAttribArray(pointP.a.aSize);
        gl.enableVertexAttribArray(pointP.a.aCol);
        gl.vertexAttribPointer(pointP.a.aPos, 3, gl.FLOAT, false, 28, 0);
        gl.vertexAttribPointer(pointP.a.aSize, 1, gl.FLOAT, false, 28, 12);
        gl.vertexAttribPointer(pointP.a.aCol, 3, gl.FLOAT, false, 28, 16);
        gl.drawArrays(gl.POINTS, 0, ns);
      }
    }

    // 太陽系天体: 小さいうちは点、拡大されたらテクスチャ球で描画
    groundVis.length = 0;
    let n = 0;
    const bigBodies = [];
    const halfFov = gFov * 0.5, halfH = H * 0.5;
    const bodies = surfaceBody === "moon" ? MOON_SKY_BODIES : SKY_BODIES;
    for (const b of bodies) {
      let altDeg, azDeg, distAU, magV;
      if (surfaceBody === "moon") {
        distAU = bodySky(b, _gp);                      // _gp = [east, up, -north]
        altDeg = Math.asin(Math.max(-1, Math.min(1, _gp[1]))) / DEG;
        azDeg = (Math.atan2(_gp[0], -_gp[2]) / DEG + 360) % 360;
        magV = null;
      } else {
        const c = computeObs(b);
        altDeg = c.alt; azDeg = c.az; distAU = c.distAU; magV = c.mag;
      }
      if (altDeg < -1 && b !== selected) continue;   // 選択天体は地平線下でも描画
      const angR = Math.asin(Math.min(0.9, b.rkm / (distAU * AU_KM)));
      const spherePx = angR / halfFov * halfH;
      // 地球以外の衛星は、画面上で母惑星の点に埋もれている間は省略 (地上ビューのみ)
      if (surfaceBody !== "moon" && b.parent && b.parent !== "earth" && b !== selected && spherePx < 5) {
        const pc = computeObs(BODY_BY_KEY.get(b.parent));
        const dAz = ((azDeg - pc.az + 540) % 360) - 180;
        const sepPx = Math.hypot(dAz * Math.cos(altDeg * DEG), altDeg - pc.alt) * DEG / gFov * H;
        if (sepPx < 12) continue;
      }
      azAltDir(azDeg, altDeg, _gp);
      const px = _gp[0]*SKYR, py = _gp[1]*SKYR, pz = _gp[2]*SKYR;
      groundVis.push({ b, px, py, pz, rpx: spherePx });
      if (spherePx >= 5) {                          // 画面上で十分大きい → 球
        bigBodies.push({ b, px, py, pz, dist: distAU,
                         wr: SKYR * Math.tan(angR), rpx: spherePx });
        continue;
      }
      let size, r, g, bl;
      if (b === SUN) {
        // 日食で欠けているぶん暗くする (点で描かれる倍率では形は出せない)
        size = 18 * (0.35 + 0.65 * sunLeft); r = 1.0 * sunLeft; g = 0.9 * sunLeft; bl = 0.6 * sunLeft;
      } else if (b.key === "moon") {
        size = 11; r = 0.9; g = 0.92; bl = 0.96;
      } else {
        size = magSize(magV == null ? 3.5 : magV); r = b.colA[0]*0.5+0.5; g = b.colA[1]*0.5+0.5; bl = b.colA[2]*0.5+0.5;
      }
      const o = n * 7;
      groundPtArr[o]=px; groundPtArr[o+1]=py; groundPtArr[o+2]=pz;
      groundPtArr[o+3]=size; groundPtArr[o+4]=r; groundPtArr[o+5]=g; groundPtArr[o+6]=bl;
      n++;
    }
    if (n) {
      gl.useProgram(pointP.pr);
      gl.uniformMatrix4fv(pointP.u.uVP, false, gVP32);
      gl.uniform1f(pointP.u.uScale, DPR);
      gl.uniform1f(pointP.u.uAlpha, 1.0);
      gl.bindBuffer(gl.ARRAY_BUFFER, groundPtVB);
      gl.bufferData(gl.ARRAY_BUFFER, groundPtArr, gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(pointP.a.aPos);
      gl.enableVertexAttribArray(pointP.a.aSize);
      gl.enableVertexAttribArray(pointP.a.aCol);
      gl.vertexAttribPointer(pointP.a.aPos, 3, gl.FLOAT, false, 28, 0);
      gl.vertexAttribPointer(pointP.a.aSize, 1, gl.FLOAT, false, 28, 12);
      gl.vertexAttribPointer(pointP.a.aCol, 3, gl.FLOAT, false, 28, 16);
      gl.drawArrays(gl.POINTS, 0, n);
    }
    gl.disable(gl.BLEND);
    // 拡大された天体はテクスチャ球で描画。太陽方向から照らすので満ち欠けも再現される
    if (bigBodies.length) {
      // 天体はすべて半径 SKYR のドーム上に置いてあるので、重なったときに球どうしが
      // 同じ距離で交差してしまう (日食で月が太陽を隠せない)。位置と半径を同じ率で
      // 縮めれば投影は1画素も変わらないから、実距離の順にドームの半径を変えて
      // 深度だけを正しくする
      if (bigBodies.length > 1) {
        bigBodies.sort((x, y) => x.dist - y.dist);
        for (let i = 0; i < bigBodies.length; i++) {
          const k = 0.55 + 0.45 * (i / (bigBodies.length - 1)), bb = bigBodies[i];
          bb.px *= k; bb.py *= k; bb.pz *= k; bb.wr *= k;
        }
      }
      if (surfaceBody === "moon") { bodySky(SUN, _fwd); }
      else { const sc = computeObs(SUN); azAltDir(sc.az, sc.alt, _fwd); }
      const sunGx = _fwd[0] * SKYR, sunGy = _fwd[1] * SKYR, sunGz = _fwd[2] * SKYR;
      gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.clear(gl.DEPTH_BUFFER_BIT);
      // 距離100に対して半径が極小のため深度精度が足りず、裏側の半球が
      // Zファイティングで突き抜ける。片面カリングで自己交差を防ぐ。
      // この球の巻き方向では FRONT を落とすと観測者側の半球が残る
      // (BACK だと裏側の半球が見えてしまい、満ち欠けが反転する)
      bodyRenderer.beginPass({
        time: nowSec, cameraPosition: ZERO3,
        cullFace: gl.FRONT, depthTest: true, depthWrite: true,
        airSun: _sunG, airDay: dayF,
      });
      let satLx = 0, satLy = 0, satLz = 0;   // 土星の環の照射方向 (ループ内で確定)
      let airBody = null;                    // 大気シェルを重ねる天体 (地球のみ)
      for (const bb of bigBodies) {
        const b = bb.b, R = bb.wr;
        // 天体の実際の自転姿勢 (宇宙ビューと同じ回転) をローカル観測者フレームへ
        // 変換して描く。これにより地球なら「その日時に月へ向いている面」が出る
        const spin = b.rot ? 2 * Math.PI * simDays / b.rot + (b.spin0 || 0) : 0;
        mRotY(spin, SCR.ry);
        if (b.key === "saturn") mMul(SAT_ROT, SCR.ry, SCR.rot);
        else { mRotX(-(b.tilt || 0) * DEG, SCR.rx); mMul(SCR.rx, SCR.ry, SCR.rot); }
        const rw = SCR.rot;   // 列0,1,2 = 天体軸のワールド方向
        SCR.v2[0]=rw[0]; SCR.v2[1]=rw[1]; SCR.v2[2]=rw[2]; worldDirToGround(SCR.v2, SCR.v);
        const axx=SCR.v[0], axy=SCR.v[1], axz=SCR.v[2];
        SCR.v2[0]=rw[4]; SCR.v2[1]=rw[5]; SCR.v2[2]=rw[6]; worldDirToGround(SCR.v2, SCR.v);
        const ayx=SCR.v[0], ayy=SCR.v[1], ayz=SCR.v[2];
        SCR.v2[0]=rw[8]; SCR.v2[1]=rw[9]; SCR.v2[2]=rw[10]; worldDirToGround(SCR.v2, SCR.v);
        const azx=SCR.v[0], azy=SCR.v[1], azz=SCR.v[2];
        const m = gM64;   // f64 のまま合成し、mMul の出力 (f32) だけを GPU へ
        m[0]=axx*R; m[1]=axy*R; m[2]=axz*R; m[3]=0;
        m[4]=ayx*R; m[5]=ayy*R; m[6]=ayz*R; m[7]=0;
        m[8]=azx*R; m[9]=azy*R; m[10]=azz*R; m[11]=0;
        m[12]=bb.px; m[13]=bb.py; m[14]=bb.pz; m[15]=1;
        // 満ち欠けの照射方向: ドーム上の見かけの太陽位置ではなく「天体 → 実際の
        // 太陽」(ワールドで太陽は原点 = -posW) を遠方光源として使う。ドーム上の
        // 2点間で照らすと位相角が 90°-離角/2 に潰れ、常に満ち気味になるため
        if (b === SUN) {
          SCR.sun[0] = sunGx; SCR.sun[1] = sunGy; SCR.sun[2] = sunGz;
        } else {
          const w = posW.get(b.key);
          _gp[0] = -w[0]; _gp[1] = -w[1]; _gp[2] = -w[2];
          const Ld = worldDirToGround(_gp, _fwd);
          if (b.key === "saturn") { satLx = Ld[0]; satLy = Ld[1]; satLz = Ld[2]; }
          SCR.sun[0] = Ld[0] * 1e6; SCR.sun[1] = Ld[1] * 1e6; SCR.sun[2] = Ld[2] * 1e6;
        }
        // 食の遮蔽体。ワールドでの「天体 → 遮蔽体」をそのまま地平フレームへ回し、
        // ドームの縮尺 (球の半径 / 実半径) を掛けて置き直す
        const ecl = eclipseFor(b);
        let eclipse = null;
        if (ecl) {
          const w = posW.get(b.key), sc = R / bodyR(b);
          _eclW[0] = ecl.cw[0] - w[0]; _eclW[1] = ecl.cw[1] - w[1]; _eclW[2] = ecl.cw[2] - w[2];
          worldDirToGround(_eclW, _eclG);
          SCR.ecl.c[0] = bb.px + _eclG[0] * sc;
          SCR.ecl.c[1] = bb.py + _eclG[1] * sc;
          SCR.ecl.c[2] = bb.pz + _eclG[2] * sc;
          SCR.ecl.r = ecl.r * sc; SCR.ecl.sunAng = ecl.sunAng; SCR.ecl.col = ecl.col;
          eclipse = SCR.ecl;
        }
        const mvp = mMul(gVP, m, SCR.mvp);
        SCR.model.set(m);   // uModel は f32 で十分 (法線用)。f64 配列を直接渡さない
        bodyRenderer.draw({ body: b, model: SCR.model, mvp, sunPosition: SCR.sun, radiusPx: bb.rpx, eclipse });
        if (b.air) {
          // 行列とやりたいことは本体と同じで、大きさだけ (1 + air) 倍にする。
          // gM64 は次の天体で上書きされるので、ここで取っておく
          const s = 1 + b.air;
          for (let i = 0; i < 12; i++) SCR.air64[i] = m[i] * s;
          SCR.air64[12] = m[12]; SCR.air64[13] = m[13]; SCR.air64[14] = m[14]; SCR.air64[15] = 1;
          SCR.airSun[0] = SCR.sun[0]; SCR.airSun[1] = SCR.sun[1]; SCR.airSun[2] = SCR.sun[2];
          airBody = b;
        }
      }
      // 大気は加算で重ねるので、本体をすべて描き終えてから最後に足す
      if (airBody) {
        const airMvp = mMul(gVP, SCR.air64, SCR.airMvp);
        SCR.airModel.set(SCR.air64);
        bodyRenderer.drawAtmos({ body: airBody, model: SCR.airModel, mvp: airMvp, sunPosition: SCR.airSun });
      }
      bodyRenderer.endPass();
      // 土星の環 (球として描かれる倍率のときのみ。軸の向きを地上フレームへ変換)
      const satBB = bigBodies.find((x) => x.b.key === "saturn");
      if (satBB) {
        const Ag = worldDirToGround(SATURN_POLE_W, _gp);
        // y = 環の法線 とする正規直交基底 (環は軸対称なので面内回転は任意)
        let xx = -Ag[2], xy = 0, xz = Ag[0];
        let xl = Math.hypot(xx, xy, xz);
        if (xl < 1e-6) { xx = 1; xy = 0; xz = 0; xl = 1; }
        xx /= xl; xz /= xl;
        const zx = xy * Ag[2] - xz * Ag[1], zy = xz * Ag[0] - xx * Ag[2], zz = xx * Ag[1] - xy * Ag[0];
        const s = satBB.wr, m = gM64;
        m[0] = xx * s; m[1] = xy * s; m[2] = xz * s; m[3] = 0;
        m[4] = Ag[0] * s; m[5] = Ag[1] * s; m[6] = Ag[2] * s; m[7] = 0;
        m[8] = zx * s; m[9] = zy * s; m[10] = zz * s; m[11] = 0;
        m[12] = satBB.px; m[13] = satBB.py; m[14] = satBB.pz; m[15] = 1;
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        gl.depthMask(false);
        gl.useProgram(ringP.pr);
        gl.uniformMatrix4fv(ringP.u.uMVP, false, mMul(gVP, m, SCR.mvp));
        SCR.model.set(m);
        gl.uniformMatrix4fv(ringP.u.uModel, false, SCR.model);
        gl.uniform3f(ringP.u.uAxis, Ag[0], Ag[1], Ag[2]);
        // 環も本体と同じ「土星 → 実際の太陽」方向の遠方光源で照らす
        gl.uniform3f(ringP.u.uSun, satLx * 1e6, satLy * 1e6, satLz * 1e6);
        gl.uniform3f(ringP.u.uCam, 0.0, 0.0, 0.0);          // 観測者フレームの原点
        gl.uniform3f(ringP.u.uCenter, satBB.px, satBB.py, satBB.pz);
        gl.uniform2f(ringP.u.uRadii, s * satBB.b.rEq / satBB.b.rkm, s * satBB.b.rPol / satBB.b.rkm);
        gl.uniform2f(ringP.u.uRingR, RING_IN, 1.0 / (RING_OUT - RING_IN));
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, ringTex);
        gl.uniform1i(ringP.u.uProfile, 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, ringVB);
        gl.enableVertexAttribArray(ringP.a.aPos);
        gl.enableVertexAttribArray(ringP.a.aR);
        gl.vertexAttribPointer(ringP.a.aPos, 3, gl.FLOAT, false, 16, 0);
        gl.vertexAttribPointer(ringP.a.aR, 1, gl.FLOAT, false, 16, 12);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, (RING_SEG + 1) * 2);
        gl.disable(gl.BLEND);
        gl.depthMask(true);
      }
      gl.disable(gl.DEPTH_TEST);
    }

    // ---- 皆既日食のコロナ ----
    // 普段は光球が明るすぎて見えず、太陽面が完全に隠れて初めて現れる。
    // 板は月の球より奥 (太陽のドーム半径) へ置き、深度テストで中心を月に
    // 食わせて輪にする — 手前に置くと、ただの光の玉になってしまう。
    // Bloom の有無によらず出す: これはカメラや目の中の滲みではなく、
    // 実際にそこにある光だから
    {
      const cAmt = Math.max(0, Math.min(1, (sunCov - 0.985) / 0.015));
      const sBB = bigBodies.find((x) => x.b === SUN);
      const sv = sBB || groundVis.find((v) => v.b === SUN);
      if (cAmt > 0 && sv && sv.py > 0) {
        const cr = sBB ? sBB.wr
                       : SKYR * Math.tan(Math.asin(Math.min(0.9, SUN.rkm / (sunAU * AU_KM))));
        gl.enable(gl.DEPTH_TEST);
        gl.depthMask(false);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE);
        gl.useProgram(billP.pr);
        gl.uniformMatrix4fv(billP.u.uVP, false, gVP32);
        gl.uniform3f(billP.u.uCenter, sv.px, sv.py, sv.pz);
        gl.uniform3f(billP.u.uRight, gV64[0], gV64[4], gV64[8]);
        gl.uniform3f(billP.u.uUp, gV64[1], gV64[5], gV64[9]);
        gl.bindBuffer(gl.ARRAY_BUFFER, billVB);
        gl.enableVertexAttribArray(billP.a.aCorner);
        gl.vertexAttribPointer(billP.a.aCorner, 2, gl.FLOAT, false, 0, 0);
        // 内側ほど明るい真珠色。太陽半径の 5倍あたりまで裾を引く
        gl.uniform1f(billP.u.uFall, 1.8);
        gl.uniform1f(billP.u.uSize, cr * 5.0);
        gl.uniform3f(billP.u.uCol1, 0.16 * cAmt, 0.17 * cAmt, 0.21 * cAmt);
        gl.uniform3f(billP.u.uCol2, 0.85 * cAmt, 0.88 * cAmt, 0.96 * cAmt);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        gl.disable(gl.BLEND);
        gl.disable(gl.DEPTH_TEST);
        gl.depthMask(true);
      }
    }

    // 太陽の眩しさ (グレア)。宇宙ビューと同じ理由で Bloom のときだけ足す —
    // Bloom はトーンマップ済みの画面を取り込むので、太陽の円盤は空や雲と同じ
    // 1.0 に潰れていて、Bloom だけでは太陽を特別扱いできない。
    //
    // 地平線より下では出さない。深度バッファは球の描画前に消しているので
    // 地形では隠せず、また昇る前から光っていたら嘘になる。地平線近くは
    // 大気を長く通って実際に減光するので、高度で薄くする (月面には大気が
    // 無いので、この減衰は入れない = 昇った瞬間から容赦なく眩しい)
    if (bloomOn) {
      const sv = groundVis.find((v) => v.b === SUN);
      const sinAlt = sv ? sv.py / SKYR : -1;
      if (sv && sinAlt > 0) {
        // 日食で隠れているぶんは眩しくない。皆既ではグレアが完全に消え、
        // 空だけが暗く残る
        const fade = (surfaceBody === "moon"
          ? 1 : Math.min(1, sinAlt / 0.10)) * (1 - sunCov);
        // 大気を長く通るほど青が抜けて赤くなる (夕日が赤い理由)。地平ぎわの
        // 太陽を白いまま光らせると、周りが焼けているのにそこだけ昼の色になる。
        // 月面には大気が無いので白のまま
        const red = surfaceBody === "moon"
          ? 1 : Math.min(1, Math.max(0, sinAlt) / 0.30);
        const gm = 0.30 + 0.70 * red, bm = 0.08 + 0.92 * red * red;
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE);
        gl.depthMask(false);
        gl.useProgram(billP.pr);
        gl.uniformMatrix4fv(billP.u.uVP, false, gVP32);
        gl.uniform3f(billP.u.uCenter, sv.px, sv.py, sv.pz);
        gl.uniform3f(billP.u.uRight, gV64[0], gV64[4], gV64[8]);
        gl.uniform3f(billP.u.uUp, gV64[1], gV64[5], gV64[9]);
        gl.bindBuffer(gl.ARRAY_BUFFER, billVB);
        gl.enableVertexAttribArray(billP.a.aCorner);
        gl.vertexAttribPointer(billP.a.aCorner, 2, gl.FLOAT, false, 0, 0);
        // 裾 → 芯 の順。角度で決めるので、画角を狭めても見かけの比率は変わらない
        // 大気のある地上では、太陽まわりの広い暈は skyDayColor のミー散乱が
        // すでに作っている。ここで足すのは目やカメラの中で起きるグレアだけに
        // 絞る — 両方を大きく出すと二重になって白い塊になる。
        // 月面には大気が無く暈も出ないので、宇宙ビューと同じ広さで足す
        const wide = surfaceBody === "moon" ? 1.0 : 0.34;
        gl.uniform1f(billP.u.uFall, 1.6);
        gl.uniform1f(billP.u.uSize, SKYR * GLARE_TAN * wide);
        gl.uniform3f(billP.u.uCol1, 0.55 * fade, 0.32 * fade * gm, 0.12 * fade * bm);
        gl.uniform3f(billP.u.uCol2, 1.00 * fade, 0.86 * fade * gm, 0.66 * fade * bm);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        // 芯の落ち方を平らにしない。加算で 1.0 に張り付いた領域が広がると、
        // その縁が輪郭として読めて「太陽が大きくなった」に見えてしまう
        gl.uniform1f(billP.u.uFall, 1.5);
        gl.uniform1f(billP.u.uSize, SKYR * GLARE_TAN * wide * 0.22);
        gl.uniform3f(billP.u.uCol1, 1.0 * fade, 0.80 * fade * gm, 0.45 * fade * bm);
        gl.uniform3f(billP.u.uCol2, 1.0 * fade, 1.00 * fade * gm, 1.00 * fade * bm);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        gl.disable(gl.BLEND);
        gl.depthMask(true);
      }
    }

    // 彗星のコマ・尾 (太陽接近時のみ)。観測者フレームへ変換し、他の天体と同じく
    // 天球ドーム上へ一様縮小して置く (真の距離のままだと高倍率時に near 面で消える)
    {
      const gfpx = (H / 2) / Math.tan(gFov / 2);

        if (!(dW > 1e-9)) continue;

        const wl = Math.hypot(w[0], w[1], w[2]) || 1;
        SCR.v2[0] = w[0] / wl; SCR.v2[1] = w[1] / wl; SCR.v2[2] = w[2] / wl;
        worldDirToGround(SCR.v2, SCR.v);

        keplerAU(c, simDays + 2, SCR.v);
        toWorld(SCR.v, SCR.v2);
        let vx = SCR.v2[0] - w[0], vy = SCR.v2[1] - w[1], vz = SCR.v2[2] - w[2];
        const vl = Math.hypot(vx, vy, vz) || 1;
        SCR.v2[0] = vx / vl; SCR.v2[1] = vy / vl; SCR.v2[2] = vz / vl;
        worldDirToGround(SCR.v2, SCR.v);

                    ax, ay, az, SCR.v[0], SCR.v[1], SCR.v[2],
                    gfpx, gV64[0], gV64[4], gV64[8], SKYR / dW);

  function drawGroundOverlay() {

    octx.font = '12px "Avenir Next","Hiragino Sans",sans-serif';
    const o = T().obs;
    octx.fillStyle = "rgba(150,178,224,0.55)";
    for (const [az, lab] of [[0, o.N], [90, o.E], [180, o.S], [270, o.W]]) {
      azAltDir(az, 0, _gp);
      const s = projGround([_gp[0]*SKYR, _gp[1]*SKYR, _gp[2]*SKYR]);
      if (s && s.x >= 0 && s.x <= W && s.y >= 0 && s.y <= H) octx.fillText(lab, s.x, s.y - 4);
    }

    if (showConst && starVis > 0.04) {

        // 画面内に見えている頂点の平均位置に名前を置く (中心点が画角外でも
