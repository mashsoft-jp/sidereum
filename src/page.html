<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- black-translucent は不可: iOS のバグでセッションによって WebView が
     「画面高 − ステータスバー」サイズで生成され、下部 59pt が描画不能になる -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Sidereum">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Sidereum (シデレウム β版) — 見上げる空から、太陽系の果てまで</title>
<style>
@@include:styles.css@@
</style>

<div id="app">
  <canvas id="gl" aria-label="太陽系 3D シミュレーション"></canvas>
  <canvas id="overlay"></canvas>
  <div id="noGL">お使いの環境では WebGL が利用できないため、<br>3D 表示を開始できませんでした。</div>

  <header id="title" class="hud">
    <button id="menuBtn" aria-label="メニュー" aria-haspopup="true">☰</button>
    <h1 class="logo">SIDEREUM<span class="beta">(β版)</span></h1>
  </header>

  <!-- 狭い画面は 3 つ並べる幅が無いので、選択中のビューを出す select にする
       (どちらを出すかは CSS。中身は同じなので状態は片方に持たせない) -->
  <div id="viewMode" role="group" aria-label="ビュー切替">
    <select id="vmSelect" aria-label="ビュー切替">
      <option value="space">宇宙</option>
      <option value="ground">地上</option>
      <option value="moon">月面</option>
    </select>
    <button id="vmSpace" class="on">宇宙</button>
    <button id="vmGround">地上</button>
    <button id="vmMoon">月面</button>
  </div>

  <!-- 項目が15個まで増え、同じ見た目で連なると目的のものを探せない。案内 / 表示 /
       画質 / 設定・情報 の4つの group に分ける (見出しの文言は applyLang が入れる)。
       観測地は別枠 -->
  <div id="menu" class="hud" role="menu">
    <div class="menuGroup" role="group" aria-labelledby="menuGrpGuide">
      <div class="menuHead" id="menuGrpGuide"></div>
      <button id="menuHelp" role="menuitem"></button>
      <button id="menuTour" role="menuitem"></button>
      <button id="menuCal" role="menuitem"></button>
    </div>
    <div class="menuGroup" role="group" aria-labelledby="menuGrpShow">
      <div class="menuHead" id="menuGrpShow"></div>
      <button id="menuGrid" role="menuitemcheckbox" aria-checked="false"></button>
      <button id="menuConst" role="menuitemcheckbox" aria-checked="false"></button>
      <button id="menuDso" role="menuitemcheckbox" aria-checked="false"></button>
      <button id="menuTerrain" role="menuitemcheckbox" aria-checked="false"></button>
      <button id="menuMeteor" role="menuitemcheckbox" aria-checked="false"></button>
    </div>
    <div class="menuGroup" role="group" aria-labelledby="menuGrpQuality">
      <div class="menuHead" id="menuGrpQuality"></div>
      <button id="menuBloom" role="menuitemcheckbox" aria-checked="false"></button>
      <button id="menuHiRes" role="menuitemcheckbox" aria-checked="false"></button>
    </div>
    <div class="menuGroup" role="group" aria-labelledby="menuGrpSet">
      <div class="menuHead" id="menuGrpSet"></div>
      <button id="menuFullscreen" role="menuitem"></button>
      <button id="menuShare" role="menuitem"></button>
      <button id="menuUnit" role="menuitem"></button>
      <button id="menuLang" role="menuitem"></button>
      <button id="menuAbout" role="menuitem"></button>
    </div>
    <div id="menuBuild"></div>
  </div>

  <!-- 観測地 (地上=地球の観測地 / 月面=月面地点)。ハンバーガーと天体リストの間に配置 -->
  <div id="obsSiteBar">
    <button id="obsSiteChip" class="hud" aria-haspopup="true" aria-expanded="false"></button>
    <div id="obsSitePop" class="hud" hidden>
      <div id="obsLoc">
        <select id="obsCity" aria-label="都市"></select>
        <span class="obsField">
          <input id="obsLat" type="number" step="0.1" min="0" max="90" aria-label="緯度">
          <button id="obsNS" class="obsHemi" type="button"></button>
        </span>
        <span class="obsField">
          <input id="obsLon" type="number" step="0.1" min="0" max="180" aria-label="経度">
          <button id="obsEW" class="obsHemi" type="button"></button>
        </span>
        <button id="obsGeo"></button>
      </div>
      <div id="moonSiteRow" class="moonOnly">
        <canvas id="moonMap" aria-label="月の表側と観測地点"></canvas>
        <select id="moonSite" aria-label="月面の観測地点"></select>
      </div>
    </div>
  </div>

  <div id="modalScrim"></div>
  <aside id="about" class="hud" aria-modal="true"></aside>
  <aside id="howto" class="hud" aria-modal="true"></aside>
  <aside id="tourList" class="hud" aria-modal="true"></aside>
  <aside id="skyCal" class="hud" aria-modal="true"></aside>
  <div id="welcome"></div>

  <div id="navPanel" class="hud">
    <button id="navCollapse" aria-label="リストを隠す">«</button>
    <!-- 各行の絵だけのトグルと同じ絵をここにも出し、絵と語を結びつける
         (絵は applyLang が入れる。文字だけ差し替えられるよう span で分ける) -->
    <div id="masterToggles">
      <button id="orbitsBtn" class="on"><span class="mtIcon"></span><span class="mtText">軌道</span></button>
      <button id="labelsBtn" class="on"><span class="mtIcon"></span><span class="mtText">名前</span></button>
    </div>
    <nav id="nav" aria-label="天体を選択"></nav>
  </div>
  <button id="navExpand" aria-label="リストを表示">»</button>

  <div id="clock" class="hud">
    <div class="dtrow">
      <!-- 日送り。矢印キーの繰り上がりは日付欄には入れられない (桁ごとの編集状態へ
           外から届かず、6月31日のような組み合わせが残る) ので、ここで受ける -->
      <span class="dateRow"><button type="button" id="dayPrev" aria-label="前日">‹</button><input type="date" id="dateInput" min="1900-01-01" max="2199-12-31" aria-label="日付を指定"><button type="button" id="dayNext" aria-label="翌日">›</button></span>
      <span class="timeRow"><input type="time" id="timeInput" aria-label="時刻を指定"><button type="button" id="tzText"></button></span>
    </div>
    <button id="nowBtn">現在時刻に合わせる</button>
  </div>

  <aside id="info" class="hud" aria-live="polite">
    <button id="closeInfo" aria-label="閉じる">✕</button>
    <p class="eyebrow" id="infoEyebrow"></p>
    <h2 id="infoName"></h2>
    <div id="infoTabs">
      <button id="tabFacts" class="on"></button>
      <button id="tabObs"></button>
    </div>
    <table><tbody id="infoRows"></tbody></table>
    <p class="fact" id="infoFact"></p>
    <p class="credit" id="infoCredit"></p>
  </aside>

  <div id="hint">ドラッグで回転 ・ ホイール / ピンチでズーム (Shift+で距離) ・ 天体クリックで接近</div>

  <!-- 高解像度テクスチャを ON にした直後の確認。先に適用してから「保存してよいか」を
       聞く。端末が耐えられず落ちても、保存前なら次に開いたとき既定へ戻る -->
  <div id="hiResConfirm" class="hud" role="alertdialog" aria-labelledby="hiResConfirmText">
    <p id="hiResConfirmText"></p>
    <div class="row">
      <button id="hiResRevert"></button>
      <button id="hiResKeep" class="primary"></button>
    </div>
  </div>

  <footer id="controls" class="hud">
    <button id="ctrlCollapse" aria-label="操作パネルを隠す">⌄</button>
    <button id="play" class="primary"><span id="playIcon"><svg viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><rect x="2.4" y="1.8" width="2.6" height="8.4" rx="0.7"/><rect x="7" y="1.8" width="2.6" height="8.4" rx="0.7"/></svg></span><span id="playLabel">停止</span></button>
    <label class="slider" id="speedLabel" for="speed" title="速度"><svg class="ctlIcon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="4.5"/><path d="M6 3.3V6.1l2 1.3"/></svg><span class="vh">速度</span></label>
    <button id="speedDown" class="step" aria-label="遅くする">−</button>
    <input type="range" id="speed" min="0" max="100" value="0" aria-label="時間の速さ">
    <button id="speedUp" class="step" aria-label="速くする">＋</button>
    <span id="speedVal"></span>

    <!-- カメラ視点プルダウン (距離・ズームの左横、col1 を2行ぶん占有) -->
    <select id="camSelect" class="spaceOnly" aria-label="カメラ視点">
      <option value="" selected>カメラ</option>
      <option value="top">真上</option>
      <option value="def">デフォルト</option>
      <option value="side">真横</option>
      <option value="reset">全体表示</option>
    </select>
    <!-- モバイルで select の上に重ねるアイコン (select の中に SVG は置けない)。
         説明文の {cam} もここを複製するので、絵は一箇所にまとまる -->
    <span id="camIcon" class="spaceOnly" aria-hidden="true" title="カメラ"><svg class="ctlIcon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linejoin="round"><path d="M1 4.1h2.3l.9-1.3h3.6l.9 1.3H11v5.4H1z"/><circle cx="6" cy="6.7" r="1.9"/></svg><span class="vh">カメラ</span></span>
    <span class="camGap"></span>
    <span class="slider spaceOnly" id="magLabel" title="ズーム"><svg class="ctlIcon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" aria-hidden="true"><circle cx="5.1" cy="5.1" r="3.3"/><path d="M7.6 7.6l2.7 2.7"/></svg><span class="vh">ズーム</span></span>
    <button id="magOut" class="step spaceOnly" aria-label="ズームアウト">−</button>
    <input type="range" id="mag" class="spaceOnly" min="0" max="100" value="0" aria-label="拡大率">
    <button id="magIn" class="step spaceOnly" aria-label="ズームイン">＋</button>
    <span id="magVal" class="spaceOnly"></span>

    <span class="camGap"></span>
    <span class="slider spaceOnly" id="zoomLabel" title="距離"><svg class="ctlIcon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.3 2.6v6.8M10.7 2.6v6.8M1.3 6h9.4M3.2 4.4L1.6 6l1.6 1.6M8.8 4.4L10.4 6 8.8 7.6"/></svg><span class="vh">距離</span></span>
    <button id="zoomOut" class="step spaceOnly" aria-label="遠ざける">−</button>
    <input type="range" id="zoom" class="spaceOnly" min="0" max="100" value="40" aria-label="注視点との距離">
    <button id="zoomIn" class="step spaceOnly" aria-label="近づける">＋</button>
    <span id="zoomVal" class="spaceOnly"></span>

    <!-- 地上ビュー用 -->
    <span class="groundOnly"></span>
    <span class="slider groundOnly" id="gFovLabel" title="ズーム"><svg class="ctlIcon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" aria-hidden="true"><circle cx="5.1" cy="5.1" r="3.3"/><path d="M7.6 7.6l2.7 2.7"/></svg><span class="vh">ズーム</span></span>
    <button id="gFovOut" class="step groundOnly" aria-label="ズームアウト">−</button>
    <input type="range" id="gFov" class="groundOnly" min="0" max="100" value="43" aria-label="ズーム">
    <button id="gFovIn" class="step groundOnly" aria-label="ズームイン">＋</button>
    <span id="gFovVal" class="groundOnly"></span>

    <span class="groundOnly"></span>
    <span class="slider groundOnly" id="gAzLabel" title="方位"><svg class="ctlIcon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="4.6"/><path d="M6 2.2l1.7 5.6L6 6.6 4.3 7.8z" fill="currentColor" stroke="none"/></svg><span class="vh">方位</span></span>
    <button id="gAzLeft" class="step groundOnly" aria-label="左へ回す">◀</button>
    <svg id="gAzTape" class="groundOnly" viewBox="-90 -22 180 36" aria-hidden="true"></svg>
    <button id="gAzRight" class="step groundOnly" aria-label="右へ回す">▶</button>
    <span id="gAzDir" class="groundOnly"></span>

  </footer>

  <!-- 俯角 (宇宙) / 高度 (地上・月面) の縦スライダー。操作パネルとは別に画面の
       右端へ置き、高さは画面に合わせて伸縮させる -->
    <div id="angleCell" class="hud spaceOnly">
      <span id="angleLabel" title="角度"><svg class="ctlIcon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" aria-hidden="true"><path d="M1.2 9.6h9.6M1.2 9.6L9.4 2.8"/><path d="M6.6 9.6a5.4 5.4 0 0 0-1.1-3.1"/></svg><span class="vh">角度</span></span>
      <button id="angleUp" class="step" aria-label="上から見下ろす">▲</button>
      <input type="range" id="angle" min="-90" max="90" value="20" aria-label="カメラ俯角">
      <button id="angleDown" class="step" aria-label="横から見る">▼</button>
      <span id="angleVal"></span>
    </div>

    <div id="gAltCell" class="hud groundOnly">
      <span id="gAltLabelTop" title="高度"><svg class="ctlIcon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" aria-hidden="true"><path d="M1.2 9.6h9.6M1.2 9.6L9.4 2.8"/><path d="M6.6 9.6a5.4 5.4 0 0 0-1.1-3.1"/></svg><span class="vh">高度</span></span>
      <button id="gAltUp" class="step" aria-label="上を向く">▲</button>
      <input type="range" id="gAlt" min="-80" max="90" value="30" aria-label="高度">
      <button id="gAltDown" class="step" aria-label="下を向く">▼</button>
      <span id="gAltVal"></span>
    </div>

  <button id="ctrlExpand" aria-label="操作パネルを表示">⌃</button>

  <!-- ガイドツアーのナレーションバー (ツアー中のみ表示。操作パネルと入れ替わる) -->
  <div id="tourBar" class="hud">
    <div id="tourProg"></div>
    <div id="tourHead">
      <span id="tourTitle"></span>
      <span id="tourStep"></span>
      <span id="tourDone" aria-live="polite"></span>
      <button id="tourClose" aria-label="ツアーを終了">✕</button>
    </div>
    <p id="tourText"></p>
    <div id="tourNav">
      <button id="tourPrev" aria-label="前のシーン">◀</button>
      <div id="tourDots"></div>
      <button id="tourResume" hidden></button>
      <button id="tourAuto"></button>
      <button id="tourNext" class="primary"></button>
    </div>
  </div>
</div>

<script>
@@script@@
</script>

<script>
// 一度取った画像を二度取らないよう Service Worker を登録する (方針は sw.js)。
// 本体とは独立させてあり、登録に失敗しても表示には影響しない
// (file:// や非対応ブラウザ、プライベートモードなど)
if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
